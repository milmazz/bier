# Ordering behavior model for Bier (PostgREST v16.0 compatibility).
#
# Scope: the `order` query parameter and its embedded variant `<embed>.order`.
# Covers direction (asc/desc), null placement (nullsfirst/nullslast), JSON-path
# ordering (object keys and array indexes), ordering on computed columns,
# ordering on related (to-one) columns, and the error envelopes for bad order
# syntax / invalid related order.
#
# Every entry cites a source line. Behavior not traceable to a source line is
# listed under `gaps` at the bottom, not asserted here.
#
# v16.0 re-sync notes (previous pin: v14.12):
#   * PostgREST's Haskell sources moved from `src/PostgREST/...` to
#     `src/library/PostgREST/...`; all source anchors below are re-pinned.
#   * ONE behavior change lands in this area: embed-path target-name resolution
#     for ALIASED embeds (see `order.embed.alias` and
#     `order.embed.alias.legacy_target_name`). Everything else re-verified
#     byte-identical and only re-anchored.
#   * Diffed v14.12 -> v16.0 to prove the rest is unchanged: `pOrder`/`pOrdDir`/
#     `pNulls` (QueryParams.hs) and `pgFmtOrderTerm`/`orderF`/`pgFmtJsonPath`
#     (SqlFragment.hs) are byte-identical; the whole ordering block of
#     JsonOperatorSpec/QuerySpec is unchanged apart from the two alias tests;
#     the only ordering-related CHANGELOG entry in the 16.0 section is
#     "Deprecate filters, orders and limits with the name of an embedded table
#     when it has an alias" (#4075).
#   * Coverage added this pass: related orders across COMPUTED relationships
#     (`order.related.computed_relationship`, cases 1227/1228) — the fixtures
#     already exist in the consolidated DB's `test` schema, so the former gap
#     of the same name is retired — and the nulls-order/limit interaction
#     (`order.nulls.alongside_limits`, case 1229). The latter is NOT new in
#     v16.0: it is upstream's #4109 regression guard, shipped in 13.0.2 and
#     already present at the v14.12 pin; it had simply never been covered by
#     this area, and pagination's twin (case 1276) carries no nulls clause.
#   * Also modelled this pass: `order=` over a MUTATION's returned
#     representation (`order.mutation_representation`, case 1230 for the
#     top-level PATCH variant; the three variants needing web_content /
#     artists+albums stay in the gap of the same name), and `order=` applied to
#     an RPC/function result (`order.rpc_result`, cases 1231/1232). Neither is
#     new in v16.0 — both predate the v14.12 pin; they had simply never been
#     modelled by this area.

area: ordering
version: PostgREST v16.0

# Case schema: the conformance cases in this area validate against
# spec/case.schema.json. All ordering cases use raw.githubusercontent.com source
# URLs with a #L line anchor, matching sibling areas (e.g. pagination, 1250+).

grammar:
  # The order value parser. Top-level order terms and per-relation order terms
  # are comma-separated; `try pOrderRelationTerm <|> pOrderTerm`.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L769
  order_value: "<term>[,<term>]*"
  term: "<field>[.<direction>][.<nulls>]   |   <relation>(<field>)[.<direction>][.<nulls>]"
  field: "<column>[<json-arrow><key-or-index>]*   (-> or ->> arrows)"
  # asc/desc are parsed by pOrdDir.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L790
  directions: [asc, desc]
  # nullsfirst/nullslast are parsed by pNulls.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L786
  nulls: [nullsfirst, nullslast]
  separator: "."   # the pDelimiter between field, direction and nulls
  # The parsed value is keyed by embed path: qsOrder :: [(EmbedPath, [OrderTerm])],
  # so `order=` targets the top relation and `<a>.<b>.order=` targets a nested
  # embed.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L81

defaults:
  # When direction is omitted, no ASC/DESC is emitted to SQL; PostgreSQL's
  # default (ASC) applies. When nulls is omitted, nothing is emitted; PostgreSQL
  # default applies (NULLS LAST for ASC, NULLS FIRST for DESC).
  # The SQL fragment only emits a direction/null clause when present in the term.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L348
  direction_when_omitted: asc        # PostgreSQL default
  nulls_when_omitted_asc: nullslast  # PostgreSQL default for ASC
  nulls_when_omitted_desc: nullsfirst # PostgreSQL default for DESC

sql_mapping:
  # OrderAsc -> "ASC", OrderDesc -> "DESC"
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L359
  asc: "ASC"
  desc: "DESC"
  # OrderNullsFirst -> "NULLS FIRST", OrderNullsLast -> "NULLS LAST"
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L362
  nullsfirst: "NULLS FIRST"
  nullslast: "NULLS LAST"
  # ORDER BY is emitted only when the term list is non-empty.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L526
  order_clause: "ORDER BY <term>[, <term>]*"
  # A field carrying a json path is emitted verbatim when the column's IR type is
  # json/jsonb, and wrapped in to_jsonb(...) for every other column type — this is
  # what makes `->`/`->>` work on composite-type and array columns.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L254
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L337
  json_path_arrow: "-> / ->>"
  # A numeric json-path segment is emitted with an explicit ::int cast, a string
  # segment as a plain unknown literal.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L444
  json_path_index: "-><n>::int"

embed_target_resolution:
  # CHANGED in v16.0. An `<embed>.order=` path segment is resolved against the
  # read-plan forest by `matchTarget`:
  #   * canonical (url-use-legacy-target-names=false): the segment must equal
  #     `fromMaybe relName relAlias` — i.e. once an embed is aliased, ONLY the
  #     alias addresses it;
  #   * legacy (url-use-legacy-target-names=true, the default): the segment may
  #     equal either the relation name OR the alias.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L1027
  #
  # Matching an ALIASED embed by its relation name flags the node
  # (relIsLegacyTargetNameMatch) and collects a deprecation warning.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L1032
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L151
  #
  # The warning is surfaced as a response header only while the legacy mode is on:
  #   Warning: 299 <product-token> "<msg> Update `<relName>` to `<alias>` in query string filters, orders or limits."
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L213
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L270
  #
  # The header is emitted only when the config key is on AND the plan collected
  # at least one legacy match.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L215
  #
  # Config key gating it, default true.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L324
  config_key: url-use-legacy-target-names
  default: true
  # With the legacy mode OFF, addressing an aliased embed by its relation name is
  # a 400 PGRST108 carrying an alias-specific details/hint pair (distinct from the
  # plain "not embedded" hint).
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L214
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L220
  #
  # NOTE: `order=<relation>(<col>)` (a *related* order, not an embed path) does
  # NOT go through matchTarget/updateNode — addRelatedOrders matches strictly on
  # `fromMaybe relName relAlias`, so an aliased relation is addressable only by
  # its alias there, with no legacy fallback and no Warning.
  # source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L878

entries:
  - id: order.asc
    claim: >
      `order=<col>.asc` sorts the result ascending by that column.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1079
    cases: [1200]

  - id: order.desc
    claim: >
      `order=<col>.desc` sorts the result descending by that column.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1087
    cases: [1201]

  - id: order.no_direction
    claim: >
      `order=<col>` with no direction or nulls clause sorts ascending
      (PostgreSQL default applies, no clause emitted).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1144
    cases: [1202]

  - id: order.nullsfirst
    claim: >
      `order=<col>.nullsfirst` (no direction) places NULL rows first; the
      remaining rows follow PostgreSQL's default (ascending) order.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1094
    cases: [1203]

  - id: order.asc.nullslast
    claim: >
      `order=<col>.asc.nullslast` sorts ascending with NULL rows last.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1104
    cases: [1204]

  - id: order.desc.nullsfirst
    claim: >
      `order=<col>.desc.nullsfirst` sorts descending with NULL rows first.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1113
    cases: [1205]

  - id: order.desc.nullslast
    claim: >
      `order=<col>.desc.nullslast` sorts descending with NULL rows last.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1122
    cases: [1206]

  - id: order.multi_column
    claim: >
      Multiple comma-separated terms order by each in turn; each term carries
      its own direction and nulls clause, e.g.
      `order=client_id.desc.nullslast,id.desc`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1131
    cases: [1207]

  - id: order.nulls.alongside_limits
    claim: >
      A nulls clause survives being combined with `limit` at the same level and
      at an embed level:
      `order=id.asc.nullslast&limit=1&projects.order=id.asc.nullsfirst&projects.limit=2`
      returns the first client with its first two projects. Upstream's it-block
      ("works alongside order by with nulls order") is the regression guard for
      issue #4109 — "Fix regression that makes `ORDER BY` with nulls-order not
      work alongside limits", CHANGELOG 13.0.2 — so it predates the previous
      v14.12 pin (RangeSpec.hs#L227 there) and is unchanged at v16.0; it was
      simply never covered by this spec tree. It is the nulls-carrying twin of
      the plain nested-limit assertion at RangeSpec.hs#L202 (pagination case
      1276), which carries no nulls clause.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L226
    cases: [1229]

  - id: order.computed_column
    claim: >
      Ordering by a computed (function) column works, e.g. `order=anti_id.desc`
      where anti_id(items) = id * -1, so desc on anti_id yields ascending id.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L515
    cases: [1208]

  - id: order.json_arrow_text
    claim: >
      Ordering by a JSON column with the `->>` (text) arrow works,
      e.g. `order=data->>id.asc`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L242
    cases: [1209]

  - id: order.json_arrow_nested_nulls
    claim: >
      Ordering by a two-level JSON path with nulls placement works,
      e.g. `order=data->foo->>bar.nullsfirst`; rows lacking the path sort first.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L247
    cases: [1210]

  - id: order.json_array_index
    claim: >
      A json-path segment may be a numeric array index, at one or more levels:
      `order=numbers->0.desc`, `order=numbers_mult->2->2.asc`. The column need not
      be json/jsonb — an int[]/int[][] column is wrapped with `to_jsonb(...)` and
      the index emitted as `-><n>::int`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L260
    cases: [1225, 1226]

  - id: order.composite_arrow
    claim: >
      Ordering on a field of a composite-type column via a JSON arrow works:
      `->` selects the field for sorting (`order=num->i.asc`) and `->>` sorts on
      its text form (`order=num->>i.desc`). This is a distinct grammar path from
      jsonb ordering (the arrow operates on a composite type, not jsonb).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L252
    cases: [1219, 1220]

  - id: order.embed
    claim: >
      `<embed>.order=<col>.<dir>` orders the rows of an embedded resource
      independently of the top-level resource, e.g. `tasks.order=name.asc`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1154
    cases: [1211]

  - id: order.embed.alias
    claim: >
      CHANGED in v16.0. When an embed is aliased, the embedded-order key is the
      ALIAS: `select=the_tasks:tasks(...)&the_tasks.order=name.asc`. (In v14.12
      the canonical key was the relation name, `tasks.order=`.) The alias form
      emits no Warning header.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1159
    cases: [1212]

  - id: order.embed.alias.legacy_target_name
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names=true` (the default) an
      aliased embed may still be addressed by its relation name in filters,
      orders and limits (`select=the_tasks:tasks(...)&tasks.order=name.asc`).
      The request succeeds with the same body as the alias form, and the response
      carries a deprecation Warning header whose value is
      `299 <product-token> "<message> Update <relName> to <alias> in query string
      filters, orders or limits."`, where <message> is "Embedded resource was
      referenced by relation name even though it has an alias. This is deprecated
      and will stop working in a future release." and the relName/alias pair is
      rendered backtick-quoted. Upstream's product token is
      PostgRESTv<major.minor>.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1183
    cases: [1224]

  - id: order.embed.alias.legacy_disabled
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names=false`, addressing an
      aliased embed by its relation name in an order (or filter/limit) is a
      400 PGRST108 whose details/hint are alias-specific:
      details "Target names are not allowed in filters if they have an alias",
      hint "Change 'tasks' to 'the_tasks' in filters, orders or limits."
      (contrast entry `order.related_not_embedded_error`, whose hint is the plain
      "Verify that '<rel>' is included in the 'select' query parameter.").
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1709
    cases: []   # not runnable on the frozen harness — see gaps

  - id: order.embed.to_one_parent
    claim: >
      An `<embed>.order` on a to-one (many-to-one) embed is accepted and does not
      change the embed's shape: it still serializes as a single JSON object, e.g.
      `select=id,name,clients(id,name)&clients.order=name.asc`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1169
    cases: [1223]

  - id: order.embed.two_levels
    claim: >
      Embedded ordering can be applied at each nesting level via dotted embed
      paths, e.g. `tasks.order=name.asc&tasks.users.order=name.desc`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1164
    cases: [1213]

  - id: order.related_to_one
    claim: >
      `order=<relation>(<col>).<dir>` orders the top resource by a column of a
      to-one (many-to-one / one-to-one) embedded relation, e.g.
      `order=clients(name).nullsfirst`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L14
    cases: [1214]

  - id: order.related_to_one.alias
    claim: >
      A related order references an aliased to-one relation by its alias, e.g.
      `select=id,client:clients(name)&order=client(name).asc`. Unlike an embedded
      order path, a related order has no legacy relation-name fallback.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L25
    cases: [1215]

  - id: order.related_to_one.one_to_one_jsonb
    claim: >
      A related order works on a one-to-one relationship combined with a JSON
      arrow on the related column, e.g.
      `select=id,trash_details(id,jsonb_col)&order=trash_details(jsonb_col->key).asc`
      (and `.desc`); trash_details.id references trash.id, forming a one-to-one
      relationship.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L47
    cases: [1221]

  - id: order.related.computed_relationship
    claim: >
      A related order also works across a COMPUTED relationship (a function
      taking the table's composite type and returning SETOF another table):
      `order=computed_designers(id).desc` on
      `computed_designers(videogames) RETURNS SETOF designers ROWS 1` sorts by
      the computed to-one parent. The to-one requirement is enforced the same
      way as for FK relationships — the one-to-many twin
      `order=computed_videogames(id).desc` (no `ROWS 1`) is a 400 PGRST118.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L35
    cases: [1227, 1228]

  - id: order.embed.by_nested_related
    claim: >
      An embedded resource can be ordered by a column of its own nested to-one
      relation via `<embed>.order=<relation>(<col>).<dir>`, e.g.
      `select=name,tasks(id,name,projects(id,name))&tasks.order=projects(id).desc`,
      and the embedded order may carry multiple terms, e.g.
      `tasks.order=projects(id).desc,name`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L67
    cases: [1222]

  - id: order.mutation_representation
    claim: >
      `order` is not a read-only parameter: it also orders the rows a MUTATION
      returns under `Prefer: return=representation`. Top level —
      `PATCH /no_pk?order=a.desc` with body `{"b":"1"}` returns the three updated
      rows sorted by `a` descending with the NULL row first (DESC defaults to
      NULLS FIRST, per `defaults` above), status 200 and
      `Preference-Applied: return=representation`. The same holds for a
      `DELETE`'s representation (`/artists?id=lt.3&select=id,name,albums(title)&order=id.desc`)
      and for a batch `POST` upsert (`/artists?select=id,name,albums(title)&order=id.desc`
      with `resolution=merge-duplicates`). The embedded variant
      `<embed>.order=` likewise orders the representation's embedded rows for
      `PATCH` and `PUT`
      (`/web_content?id=eq.0&select=id,name,web_content(name)&web_content.order=name.asc`).
    # Additional anchors for the same behavior (one `source:` key per entry, so
    # the siblings are cited here):
    #   PATCH, embedded order:
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L739
    #   DELETE, top-level order:
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L159
    #   PUT, embedded order:
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L557
    #   batch POST upsert, top-level order:
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L569
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L443
    # Case 1230 asserts the top-level PATCH variant verbatim. The three variants
    # that need `web_content` / `artists`+`albums` have no fixture home — see the
    # gap of the same id.
    cases: [1230]

  - id: order.rpc_result
    claim: >
      `order` is not restricted to table/view reads: it also orders a FUNCTION's
      result set on the `/rpc/<fn>` surface, alongside filters and limits.
      Ascending: `/rpc/getitemrange?order=id&min=0&max=15` returns ids 1..15 with
      `Content-Range: 0-14/*` (RangeSpec.hs#L30). The direction and json-path
      grammar are the same as for a relation read: upstream's
      `/rpc/returns_complex?select=val->r&val->i=gt.0.5&order=val->>i.desc`
      (the `source` below) proves a `->>` json-arrow DESC order over a function
      returning a dynamic TABLE with a composite type.
    # Additional anchors for the same behavior (one `source:` key per entry, so
    # the siblings are cited here):
    #   RPC top-level order, ascending (the request cases 1231/1232 mirror):
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L30
    #   Docs, order on an RPC call:
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/functions.rst#L283
    #   Docs, "will also inline filters, order and limits":
    #     https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/functions.rst#L290
    # The only pre-existing on-disk coverage was incidental and outside this
    # band: pagination case 1271 (`/rpc/getallprojects?select=id&order=id`),
    # which asserts a count envelope, not ordering.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L318
    cases: [1231, 1232]

  - id: order.related_not_to_one_error
    claim: >
      A related order on a relation that is not many-to-one or one-to-one fails
      with 400 PGRST118 ("A related order on '<rel>' is not possible").
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L107
    cases: [1216]

  - id: order.related_not_embedded_error
    claim: >
      A related order referencing a relation that is not in the `select`
      (not embedded) fails with 400 PGRST108
      ("'<rel>' is not an embedded resource in this request"), hint
      "Verify that '<rel>' is included in the 'select' query parameter."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L139
    cases: [1217]

  - id: order.bad_syntax_error
    claim: >
      An unparseable order value fails with 400 PGRST100 and a parse-error body
      ("failed to parse order (...)"), e.g. `order=id.asc.nullslasttt`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1173
    cases: [1218]

gaps:
  - id: order.embed.alias.legacy_disabled
    why: >
      NOT uncovered in spec/ — it is covered from the select band. The
      byte-identical request and the exact 400/PGRST108 envelope already exist on
      disk as `spec/conformance/cases/1139_embed_alias_target_name_pgrst108.yaml`
      (feature `select/embed/alias/target-name-disallowed-error`), which carries
      `config: {url-use-legacy-target-names: false}` and cites the same
      QuerySpec.hs#L1709 it-block. Since that upstream request drives a filter,
      an order (`tasks.order=name.asc`) and a limit through the same target name,
      an ordering-band duplicate would assert nothing new, so this area models the
      behavior as an entry with `cases: []` and defers the assertion to 1139.
      The one caveat is a harness limitation that applies to 1139 EQUALLY, not
      only to a hypothetical new case: the frozen harness boots per-config variant
      instances for a hard-coded id list (`@variant_case_ids`,
      test/support/conformance_server.ex:58 — currently 1467-1473, 1491, 1493,
      1654, 1677, 1678, 1680, 1682, 1703, 1758, 1763, 1764), and **1139 is not in
      it**, so 1139 today runs against the default instance where
      `url-use-legacy-target-names` is still true. Wiring 1139 into
      `@variant_case_ids` is the single harness-owner action that closes this
      gap for both bands; no new case is needed.

  - id: order.mutation_representation
    why: >
      loader_exposure — PARTIAL, and narrowed this pass. The top-level PATCH
      variant (UpdateSpec.hs#L443) is now asserted verbatim by case 1230; only
      three of the four upstream assertions remain uncovered, all for the same
      reason — the relations they drive do not exist anywhere in the
      consolidated fixture DB:
        * the embedded-order variants (PATCH #L739, PUT #L557) need
          `web_content` (a self-referencing parent/child table), and
        * the DELETE (#L159) and batch-POST upsert (#L569) variants need
          `artists` + `albums`.
      Verified against a freshly loaded `bier_test`:
      `select table_schema, table_name from information_schema.tables where
      table_name in ('web_content','artists','albums')` returns ZERO rows.
      Standing that graph up would mint a shared mutable fixture surface that
      belongs to the mutations/representations areas, not to ordering, so it is
      recorded here rather than added to ordering.delta.sql.
      A PREVIOUS revision of this gap also withheld the top-level PATCH case,
      arguing that sibling inserts into `mutations.no_pk` (1352, 1379, 1394)
      made the representation seed-dependent under ExUnit's randomized
      within-module order. That rationale was WRONG and is retracted: those
      writes never persist. The shared conformance instance is configured with
      `db_tx_end: :rollback` (test/support/conformance_server.ex, base_opts/0)
      and `Bier.Mutation.finish_tx/3` (lib/bier/mutation.ex) aborts every
      mutation transaction after the response is computed; there is no
      `Prefer: tx=` override path in lib/, and none of the sibling cases sends
      `tx=commit` in any event. `mutations.no_pk` therefore always holds exactly
      the loader-seeded (NULL,NULL), ('1','0'), ('2','0') — confirmed against
      the loaded DB — and the only deliberate deviation from a straight `test.*`
      copy anywhere in that schema is the loader's `mutations.articles` reset.

  - id: order.rpc_result
    why: >
      loader_exposure — PARTIAL. The entry `order.rpc_result` is covered for the
      plain-column form by cases 1231/1232 (`/rpc/getitemrange?order=id[.desc]`,
      the `ordering` schema mirrors `getitemrange`). The stronger upstream
      assertion — `/rpc/returns_complex?select=val->r&val->i=gt.0.5&order=val->>i.desc`
      (JsonOperatorSpec.hs#L318), which drives a json-arrow DESC order over a
      function returning a dynamic TABLE with a composite type — cannot be
      minted: `returns_complex` exists in no schema of the consolidated fixture
      DB (verified: zero rows in `pg_proc` for that name), and the function is an
      RPC-area object, so exposing it means editing the live loader input
      `spec/conformance/fixtures/rpc.sql` (forbidden) rather than
      `ordering.delta.sql`. Closing this needs the loader to expose
      `returns_complex` (upstream test/spec/fixtures/schema.sql) under an
      ordering-visible schema. The docs example on the same surface
      (`/rpc/best_films_2017?rating=gt.8&order=title.desc`,
      docs/references/api/functions.rst#L283) is blocked identically —
      `best_films_2017`/`films` are absent too.

  - id: order.spread_embed
    why: >
      v16.0 newly exercises embedded orders on SPREAD embeds
      (`...processes(...)&order=name&processes.order=name`, and its nested twin
      `processes.supervisors.order=name`) and related orders that target a
      spread embed (`order=process_categories(name)`,
      `order=processes(factory_id).desc`,
      `order=budget_categories(budget_owner)`).
      Sources:
      https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L163
      https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L157
      https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L168
      https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L146
      Both are real ordering behaviors, but every relation they need
      (factories, processes, process_costs, process_categories, supervisors,
      process_supervisor, budget_expenses, budget_categories) is absent from the
      consolidated fixture DB — no spec/ area owns the spread/aggregate fixture
      graph. Standing them up in ordering.delta.sql would mint a large shared
      fixture surface outside this area's ownership, so no case is added; the
      behavior is recorded here instead.
  - id: order.aggregate_column
    why: >
      No upstream assertion orders BY an aggregate result (e.g.
      `select=count(),client_id&order=count().desc`). Every AggregateFunctionsSpec
      request orders by a plain or spread-embed column, so nothing in this area is
      traceable for "ordering on aggregate columns" — an exhaustive scan of
      v16.0's test/spec for `order=<...>(sum|count|avg|max|min)()` returns zero
      hits. The spread-embed related orders it does use are covered by the
      `order.spread_embed` gap above, not here.
  - id: order.without_other_constraints
    why: >
      QuerySpec.hs#L1151 ("without other constraints") only asserts status 200 for
      `/items?order=id.asc` with no body assertion; it adds nothing over case 1200,
      so no case was minted for it.
