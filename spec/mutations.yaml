# Behavior model: mutations (POST / PATCH / PUT / DELETE)
# PostgREST version pinned: v16.0
#
# Every entry carries a `source` URL with a line anchor into PostgREST's own
# test suite or source. Behaviors that could not be traced to a real source
# line are recorded under `gaps` at the bottom, NOT invented.
#
# Ground-truth priority: PostgREST tests > PostgREST source > docs.

area: mutations
version: v16.0

# --------------------------------------------------------------------------
# INSERT (POST)
# --------------------------------------------------------------------------
insert:
  method: POST
  body:
    # A single JSON object inserts one row; a JSON array inserts many (bulk).
    accepts_object_or_array: true
    # Single-object half of the claim (one object -> one row):
    object_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L21
    # Array/bulk half of the claim (array -> many rows) on /compound_pk:
    array_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L268
    # x-www-form-urlencoded bodies are accepted and treated as a single row.
    accepts_form_urlencoded: true
    form_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L169
    # Leading/trailing insignificant whitespace around the JSON is ignored.
    ignores_insignificant_whitespace: true
    whitespace_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L403
    # An empty object {} (or [{}]) inserts a row using all column defaults.
    empty_object_inserts_defaults: true
    empty_object_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L343
    # An empty array [] inserts nothing and (with return=rep) returns [].
    empty_array_inserts_nothing: true
    empty_array_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L239
  status:
    # Successful insert returns 201 Created.
    created: 201
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L27
  location_header:
    # The Location header is emitted ONLY when Prefer: return=headers-only is
    # requested. Every Location assertion in InsertSpec.hs is paired with
    # return=headers-only (L139 /projects?id=eq.11, L207 /auto_incrementing_pk
    # ?id=eq.2, L773 composite). A plain POST (no Prefer) and a
    # return=representation insert do NOT set Location (L102/L114/L125/L268 all
    # assert matchHeaderAbsent hLocation). Do not assume a bare POST emits it.
    emitted_only_with_headers_only: true
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L204
    headers_only_projects_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L136
    # Under return=representation, selecting columns that exclude the pk emits no
    # Location header (and does not throw). NOTE: under return=headers-only the
    # Location IS still emitted even when select excludes the pk (L131-L139),
    # so this "absent" claim is specific to the representation path.
    absent_when_select_excludes_pk: true
    absent_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L122
    # A table with no pk never gets a Location header.
    absent_when_no_pk: true
    no_pk_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L218
    # Composite pk is encoded as multiple eq filters in the Location (with
    # return=headers-only). Assertion line is L773 (the it-block opens at L766).
    composite_pk_encoded: true
    composite_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L763
  errors:
    # Non-uniform JSON array (not all objects, or objects with different keys)
    # -> 400 PGRST102 "All object keys must match".
    non_uniform_array: {status: 400, code: PGRST102, message: "All object keys must match"}
    non_uniform_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L74
    # Empty or invalid JSON body -> 400 PGRST102 "Empty or invalid json".
    invalid_json: {status: 400, code: PGRST102, message: "Empty or invalid json"}
    invalid_json_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L283
    empty_body: {status: 400, code: PGRST102, message: "Empty or invalid json"}
    empty_body_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L293
    # Duplicate pk surfaces Postgres 23505 as 409 Conflict.
    duplicate_pk: {status: 409, code: "23505"}
    duplicate_pk_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L314
    # Conflicting unique constraint also -> 409 (on /withUnique).
    unique_violation: {status: 409, code: "23505"}
    unique_violation_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L322
    # not-null violation surfaces Postgres 23502 as 400.
    not_null_violation: {status: 400, code: "23502"}
    not_null_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L210
    # Unknown table -> 404 PGRST205, even when ?columns is also invalid.
    table_not_found: {status: 404, code: PGRST205}
    table_not_found_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L477

# --------------------------------------------------------------------------
# columns= query parameter (applies to POST, PATCH, PUT)
# --------------------------------------------------------------------------
columns_param:
  # JSON keys NOT listed in ?columns are ignored (not inserted/updated).
  ignores_unlisted_keys: true
  source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L436
  # Blank ?columns= -> 400 PGRST100 (parse error).
  blank_is_parse_error: {status: 400, code: PGRST100}
  blank_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L455
  # A ?columns column that does not exist -> 400 PGRST204 (column not found).
  unknown_column: {status: 400, code: PGRST204}
  unknown_column_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L466
  # On PATCH, an unknown ?columns column is likewise 400 PGRST204.
  unknown_column_patch: {status: 400, code: PGRST204}
  unknown_column_patch_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L348

# --------------------------------------------------------------------------
# missing=default preference (Prefer: missing=default)
# --------------------------------------------------------------------------
missing_default:
  # With Prefer: missing=default + ?columns=, JSON objects lacking a listed
  # column receive that column's table/view DEFAULT instead of NULL.
  # Without missing=default, missing values become NULL.
  applies_table_defaults: true
  source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L496
  # Echoed in Preference-Applied as "missing=default, ...".
  preference_applied: "missing=default"
  preference_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L511
  # Also works on UPDATE (PATCH).
  applies_on_update: true
  update_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L370
  # A GENERATED ALWAYS column can never receive a value, even under
  # missing=default: Postgres raises 428C9 and PostgREST surfaces it as 400 with
  # details "Column \"b\" is a generated column."
  #
  # CHANGED IN v16.0: at v14.12 this assertion was PG-version-conditional --
  # PostgreSQL < 14 produced 42601 "cannot insert into column \"b\"". v16.0
  # dropped support for PostgreSQL 13 (EOL), so the test now asserts 428C9
  # unconditionally. Bier targets PG >= 14, so 428C9 is the only shape.
  generated_always_column: {status: 400, code: "428C9", message: "cannot insert a non-DEFAULT value into column \"b\"", details: "Column \"b\" is a generated column."}
  generated_always_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/InsertSpec.hs#L547

# --------------------------------------------------------------------------
# UPDATE (PATCH)
# --------------------------------------------------------------------------
update:
  method: PATCH
  status:
    # Successful update with no representation returns 204 No Content.
    no_content: 204
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L68
    # With return=representation the status is 200 and the body is an array.
    representation: 200
    representation_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L93
    # Matching zero rows still returns 204 (no return=) or 200 with [] (return=rep).
    zero_rows_no_return: 204
    zero_rows_no_return_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L88
    zero_rows_return_rep: {status: 200, body: "[]"}
    zero_rows_return_rep_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L78
  content_range:
    # 204 updates emit Content-Range "0-<n-1>/*" reflecting affected rows.
    single_row: "0-0/*"
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L75
    multiple_rows: "0-1/*"
    multiple_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L115
  empty_body:
    # An empty body ({} / [] / [{}]) makes no updates; returns 204 with
    # Content-Range "*/*" (no return=), or 200 with [] (return=rep).
    no_updates: true
    content_range: "*/*"
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L232
    return_rep_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L301
  errors:
    invalid_json: {status: 400, code: PGRST102, message: "Empty or invalid json"}
    invalid_json_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L37
    empty_payload: {status: 400, code: PGRST102, message: "Empty or invalid json"}
    empty_payload_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L47
    # Unknown table -> 404 PGRST205.
    table_not_found: {status: 404, code: PGRST205}
    table_not_found_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L15

# --------------------------------------------------------------------------
# DELETE
# --------------------------------------------------------------------------
delete:
  method: DELETE
  status:
    # Successful delete with no representation returns 204; Content-Range "*/*".
    no_content: {status: 204, content_range: "*/*"}
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L15
    # With return=representation returns 200 and the deleted rows as an array.
    representation: 200
    representation_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L27
    # No rows matched + return=rep -> 200 with [] body, Content-Range "*/*".
    zero_rows_return_rep: {status: 200, body: "[]"}
    zero_rows_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L104
  count_exact:
    # count=exact reports the deleted count in Content-Range "*/<n>".
    content_range: "*/<n>"
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L27
  select_shaping:
    # ?select on DELETE+return=rep shapes/renames/casts the returned rows.
    supports_rename_cast: true
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L67
  errors:
    table_not_found: {status: 404, code: PGRST205}
    table_not_found_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/DeleteSpec.hs#L113

# --------------------------------------------------------------------------
# UPSERT via POST (Prefer: resolution=...)
# --------------------------------------------------------------------------
upsert_post:
  method: POST
  resolution_merge_duplicates:
    # Prefer: resolution=merge-duplicates -> INSERT ... ON CONFLICT DO UPDATE.
    # On pk conflict the existing rows are updated. Status 201 if any row was
    # inserted; 200 if everything was an update (nothing inserted).
    behavior: "insert-or-update on conflict"
    status_inserted: 201
    status_all_updated: 200
    inserted_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L19
    all_updated_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L34
    preference_applied: "resolution=merge-duplicates"
    pref_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L31
  resolution_ignore_duplicates:
    # Prefer: resolution=ignore-duplicates -> INSERT ... ON CONFLICT DO NOTHING.
    # Conflicting rows are skipped; return=rep returns only newly inserted rows.
    behavior: "insert, skip conflicting"
    status: 201
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L165
    preference_applied: "resolution=ignore-duplicates"
    pref_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L174
  on_conflict_param:
    # ?on_conflict=<cols> targets a UNIQUE constraint (not the pk) as the
    # conflict target for the upsert.
    targets_unique: true
    single_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L81
    compound_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L94
  no_pk_behavior:
    # If the table has no pk, the resolution preference is silently ignored and
    # NO Preference-Applied: resolution=... is emitted.
    ignores_resolution: true
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L155
  empty_payload:
    # Empty array payload with merge-duplicates inserts nothing -> 200, [].
    status: 200
    source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L75

# --------------------------------------------------------------------------
# UPSERT via PUT
# --------------------------------------------------------------------------
upsert_put:
  method: PUT
  semantics:
    # PUT addresses a single resource by its full pk via eq filters and either
    # inserts it (201) or replaces it (200/204). Body is a single-element array.
    insert_status: 201
    insert_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L361
    update_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L414
    # A payload array with MORE than one element is not an error on PUT: only
    # the first element is applied (and returned). PUT addresses exactly one
    # resource, so trailing elements are ignored rather than bulk-upserted.
    multi_element_payload_uses_first_only: true
    multi_element_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L428
    # PUT + Prefer: return=minimal -> 204 with no Content-Type and
    # Preference-Applied: return=minimal.
    return_minimal_status: 204
    return_minimal_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L543
  restrictions:
    # limit/offset are not allowed on PUT -> 400 PGRST114.
    no_limit_offset: {status: 400, code: PGRST114, message: "limit/offset querystring parameters are not allowed for PUT"}
    limit_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L295
    offset_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L302
    # Filters must be exactly the pk columns with eq operators, else 405 PGRST105.
    pk_eq_only: {status: 405, code: PGRST105, message: "Filters must include all and only primary key columns with 'eq' operators"}
    pk_eq_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L309
    # No-pk table with PUT -> 405 PGRST105.
    no_pk: {status: 405, code: PGRST105}
    no_pk_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L355
    # URL pk must match the payload pk, else 400 PGRST115.
    pk_mismatch: {status: 400, code: PGRST115, message: "Payload values do not match URL in primary key column(s)"}
    pk_mismatch_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L344
  ignores_range_header: true
  ignores_range_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L477

# --------------------------------------------------------------------------
# pg-safeupdate: full-table UPDATE/DELETE protection
# --------------------------------------------------------------------------
safe_mutations:
  # When the pg-safeupdate extension is loaded, an UPDATE/DELETE with no WHERE
  # condition raises Postgres 21000 -> 400.
  update_requires_where: {status: 400, code: "21000", message: "UPDATE requires a WHERE clause"}
  update_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/PgSafeUpdateSpec.hs#L18
  delete_requires_where: {status: 400, code: "21000", message: "DELETE requires a WHERE clause"}
  delete_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/PgSafeUpdateSpec.hs#L37
  # A filter satisfies the WHERE requirement -> 204.
  filter_satisfies: {status: 204}
  filter_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/PgSafeUpdateSpec.hs#L31

# --------------------------------------------------------------------------
# max-affected preference (limited / guarded mutations)
# --------------------------------------------------------------------------
max_affected:
  # Prefer: handling=strict, max-affected=N caps the number of rows a mutation
  # may affect. Exceeding N -> 400 PGRST124. Within N -> success + Preference-Applied.
  #
  # v16.0 note: PreferencesSpec.hs was split into Feature/Query/Preferences/
  # {Handling,MaxAffected,Timezone}Spec.hs. The max-affected block moved
  # verbatim (v14.12 PreferencesSpec.hs L123-L238 is byte-identical to v16.0
  # Preferences/MaxAffectedSpec.hs L13-L128), so the behavior is unchanged and
  # only the anchors were re-homed.
  strict_exceeds: {status: 400, code: PGRST124, message: "Query result exceeds max-affected preference constraint"}
  exceeds_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L14
  strict_within: {status: 204}
  within_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L22
  # handling=lenient ignores the constraint (never fails on it).
  lenient_ignores: true
  lenient_source: https://github.com/PostgREST/postgrest/blob/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L48

gaps:
  - "The GENERATED ALWAYS insert error (modeled under missing_default.generated_always_column) has no conformance case: the upstream target is table `foo` (columns a text, b text GENERATED ALWAYS AS (...) STORED), which does not exist in the consolidated fixture database and has no generated-column stand-in there (no is_generated='ALWAYS' column exists in test.* or mutations.*). loader_exposure: add a generated-always table and expose it under the `mutations` area schema as a real table (a view mirror does not preserve the generated-column rejection) before a case can assert 428C9."
  - "limit/offset on PATCH/DELETE (true 'limited update/delete' requiring an order=) still has no dedicated test case in PostgREST v16.0 test/spec/Feature/Query/{Update,Delete}Spec.hs (re-checked at the v16.0 pin); modeled here only via max-affected (PGRST124). The classic PGRST109/PGRST110 limited-mutation errors are still marked 'no longer used' in src/library/PostgREST/Error.hs#L153-L154 (the src/ tree moved to src/library/ in v16.0), so they are intentionally omitted."
  - "db-max-rows does NOT cap rows affected by POST/PATCH/DELETE (QueryLimitedSpec.hs#L81-L116, 'max-rows=2 on mutations'). That spec is config-driven (configDbMaxRows = Just 2) and its black-box cases are owned by the config/pagination bands (cases 1700-1701), so no mutations-band case duplicates it. The only v16.0 change there was adding &order=last_name for determinism, not a behavior change."
  - "CSV insert is marked pendingWith \"Decide on what to do with CSV insert\" in InsertSpec.hs#L629, so the disparate-csv-types path is not asserted upstream and is omitted; only the simpler CSV return=representation cases are tested but were left out of this band to keep fixtures JSON-only."
  - "PUT return=minimal yields 204 with hContentType absent and Preference-Applied: return=minimal (UpsertSpec.hs#L543-L552). The status is modeled under upsert_put.semantics.return_minimal_status, but no conformance case covers it: the upstream test targets the case-sensitive /UnitTest relation (pk \"idUnitTest\"), which does not exist anywhere in the consolidated fixture database. loader_exposure: add test.\"UnitTest\" and expose it under the `mutations` area schema (isolate_mutations' table list is hardcoded to items, articles, complex_items, tiobe_pls, simple_pk, no_pk, single_unique, compound_unique, safe_update_items, safe_delete_items) before a black-box case can assert this."
  - "Upsert + Prefer: missing=default on SERIAL / GENERATED-BY-DEFAULT surrogate primary keys (UpsertSpec.hs#L107, #L120, #L133 for merge-duplicates and #L235, #L247, #L259 for ignore-duplicates) has no case: the upstream targets `surr_serial_upsert`, `surr_gen_default_upsert` and the case-sensitive `Surr_Gen_Default_Upsert` do not exist anywhere in the consolidated fixture database. loader_exposure: these three tables must be added AND exposed under the `mutations` area schema as real tables (the area's view mirror does not carry column DEFAULTs / identity, which is exactly why bier.fixtures.load's isolate_mutations already materializes complex_items as a real table); its table list is hardcoded, so a fixtures delta alone is not enough."
