# Behavior model: OpenAPI document generation
#
# Area scope: OpenAPI 3.0 (emitted as Swagger 2.0) document generation rules,
# descriptions sourced from COMMENTs, and security schemes.
#
# PostgREST version pinned: v16.0
# Primary source: src/library/PostgREST/Response/OpenAPI.hs
#   https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs
# Behavior tests: test/spec/Feature/OpenApi/*.hs
# Docs: https://postgrest.org/en/v16/references/api/openapi.html
#
# NOTE: PostgREST emits a Swagger 2.0 document (the top-level field is
# `"swagger": "2.0"`), built via the `Data.Swagger` (swagger2) library. The
# AGENT_PLAN names this area "OpenAPI 3.0"; the actual on-the-wire artifact in
# v16.0 is Swagger 2.0. Bier must match the wire format byte-for-byte, so this
# model describes Swagger 2.0 shapes. Conformance cases [1650..1699].
#
# ---------------------------------------------------------------------------
# v14.12 -> v16.0 re-sync, re-verified by diffing both pins rather than carried
# over. Scope of the diff: `git diff v14.12..v16.0 -- test/spec/Feature/OpenApi/
# src/PostgREST/Response/OpenAPI.hs src/library/PostgREST/Response/OpenAPI.hs`
# plus docs/references/api/openapi.rst and the CHANGELOG.
#
#   * OpenAPI.hs: renamed src/PostgREST/... -> src/library/PostgREST/... (v16
#     splits the cabal package into a library + executable). The only content
#     change is an import-block reflow of three multi-line import lists
#     (3 insertions, 6 deletions), which shifts every anchor below the imports
#     by -3 lines. No generator logic moved.
#   * All six Feature/OpenApi specs changed ONLY in their scaffolding: the
#     shared `SpecWith ((), Application)` signature plus a per-spec cfg in
#     test/spec/SpecHelper.hs + Main.hs became a self-carried
#     `SpecWithConfig` / `withConfig <cfg>`. Every it-block body and every
#     assertion is unchanged; the configs are the same values (e.g. v14.12's
#     `testIgnorePrivOpenApiCfg = baseCfg { configOpenApiMode = OAIgnorePriv,
#     configDbSchemas = fromList ["test","v1"] }`, SpecHelper.hs#L189-190, is
#     byte-equal to v16.0's inline withConfig at IgnorePrivOpenApiSpec.hs#L21-26).
#   * docs/references/api/openapi.rst: ZERO diff between the pins. The
#     configuration docs for openapi-mode / openapi-security-active /
#     openapi-server-proxy-uri / db-root-spec are unchanged, and the CHANGELOG
#     mentions nothing in this area.
#
# The only wire-visible delta is externalDocs.url, which embeds docsVersion
# ("v14" -> "v16", Version.hs#L32-35).
#
# READ THAT AS A CLAIM ABOUT CHANGE, NOT ABOUT COVERAGE. The scaffolding-only
# finding is what let the previous pass stop looking; this pass audited the
# it-blocks themselves and found three defects that predate both pins (case
# 1651's Content-Type, case 1650's citation, case 1682's unreachable Accept)
# plus eleven never-modelled it-blocks, six of which are now cased
# (1683..1688). See `gaps` for the five that are not.
#
# A LATER REVIEW PASS found four more defects that survived all of the above,
# and none of them were version drift — they were wrong claims and a wrong
# fixture label:
#   * `schema: openapi` on 38 of the 39 cases named a schema that exists
#     nowhere, and the frozen harness turns that label into an
#     `Accept-Profile: openapi` header. Now `schema: test`. See the first
#     `gaps` entry — this is the area-wide one.
#   * openapi/rpc/post-body (and case 1683) claimed an all-OUT routine
#     documents `properties: {}`. It documents no such key; the swagger2
#     encoder drops every field left at its default.
#   * case 1662 cited OpenApiSpec.hs#L117 for five assertions when that anchor
#     supports only three; GET 200/206 descriptions are asserted by no upstream
#     test and are now cited to the generator (OpenAPI.hs#L321-323).
#   * the openapi-server-proxy-uri gap claimed no value-level expectation was
#     traceable; the configuration docs print the exact fragment. Modelled in
#     the openapi/root/server-proxy-uri entry (its case was later HELD — see
#     the next block).
# The lesson the tree should carry forward: "the diff between pins is
# scaffolding-only" says nothing about whether the pre-existing claims were
# ever right.
#
# A THIRD REVIEW PASS found four more, all citation/runnability defects rather
# than behavior errors, and all fixed here:
#   * openapi/table/response-status claimed per-method gating
#     ("POST/PATCH/DELETE are emitted only when the table is
#     insertable/updatable/deletable") on an anchor (#L321, `at 206`) that
#     supports no gating claim at all. makePathItem gates ONCE on the
#     DISJUNCTION (#L309) and the True arm sets all three methods together
#     (#L339), so an insert-only table still documents PATCH and DELETE. An
#     implementer building three independent checks would have diverged.
#     Reworded; source re-pointed to #L309.
#   * openapi/rpc/post-body cited OpenApiSpec.hs#L514 (the a_json COLUMN
#     schema) for a claim about the RPC POST path item. That anchor supports
#     only the swagger2 default-drop sub-claim. Source re-pointed to #L875,
#     the it-block that asserts the POST body schema; #L514 kept in the prose.
#   * case 1682's source (RootSpec.hs#L27) CONTRADICTED its own body_exact —
#     that it-block asserts upstream's "PostgREST API" root() document, not
#     the "Overridden" one this case expects. Source promoted to the docs
#     anchor that prints the expected body; RootSpec kept in notes for the
#     status + Content-Type half it does support.
#   * case 1689 shipped unrunnable: a `config:` block with no entry in the
#     frozen harness's @variant_case_ids, so it would have run against the
#     shared instance with the proxy config ignored. Disclosing it under
#     `gaps` was not enough — a shipped-and-red case is a defect. The case is
#     withdrawn; the behavior stays fully modelled in its entry, with the
#     harness change recorded as an open gap.
# ---------------------------------------------------------------------------

version: v16.0

entries:
  # -------------------------------------------------------------------------
  # Root document & content negotiation
  # -------------------------------------------------------------------------
  - id: openapi/root/media-type
    claim: >
      GET / serves the generated document for `Accept: application/openapi+json`
      AND for `Accept: application/json` — but the response Content-Type is
      `application/openapi+json; charset=utf-8` in BOTH cases. inspectPlan
      treats the Accept header as a gate only: `producedMTs = [MTOpenAPI,
      MTApplicationJSON, MTAny]`, and any non-empty intersection yields
      `Right MTOpenAPI` (Plan.hs#L247-250). The response builder then ignores
      the planned media type and hard-codes
      `MediaType.toContentType MTOpenAPI` (Response.hs#L208).
      HEAD / with application/openapi+json returns 200 with an empty body and
      no Content-Length header (OpenApiSpec.hs#L21-28: methodHead "/",
      matchStatus 200, matchHeaderAbsent hContentLength).
      Under db-root-spec the root is a routine instead and negotiates normally
      — that is where `application/json; charset=utf-8` comes from
      (RootSpec.hs#L27-34, cased as 1682).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response.hs#L208
    cases: [1650, 1651, 1681]

  - id: openapi/root/non-root-406
    claim: >
      Requesting application/openapi+json on a non-root path (e.g. /items)
      yields 406 Not Acceptable. An unsupported media type (e.g. text/csv) on
      the root path also yields 406 — it is the empty-intersection branch of
      inspectPlan, `Left . ApiRequestErr . MediaTypeError` (Plan.hs#L251).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L30
    cases: [1652, 1653]

  - id: openapi/root/swagger-version-info
    claim: >
      The document has top-level `"swagger": "2.0"`, and `info.title` defaults
      to "PostgREST API" and `info.description` to "This is a dynamic API
      generated by PostgREST" when the exposed schema has no COMMENT
      (OpenAPI.hs#L396-397). `info.version` is the running PostgREST version:
      `prettyVersion`, the first two components joined by "."
      (Version.hs#L22-24), wired at OpenAPI.hs#L395.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L396
    cases: [1654]

  - id: openapi/root/external-docs
    claim: >
      `externalDocs.url` is `https://postgrest.org/en/<docsVersion>/references/api.html`
      and externalDocs.description is "PostgREST Documentation"
      (OpenAPI.hs#L399-400). `docsVersion` is "v" plus the first component of
      the running version (Version.hs#L32-35), so under the v16.0 pin the url
      is `https://postgrest.org/en/v16/references/api.html` (it was
      `.../en/v14/...` under the v14.12 pin — the one wire-visible delta of
      this re-sync).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L400
    cases: [1655]

  - id: openapi/root/introspection-path
    claim: >
      The document documents itself. makePathItems prepends makeRootPathItem to
      the table and routine items (OpenAPI.hs#L378-380), producing a fixed "/"
      path item whose GET has tags ["Introspection"], summary "OpenAPI
      description (this document)", produces
      [application/openapi+json, application/json] and one 200 "OK" response
      (OpenAPI.hs#L367-376). Built from `mempty :: Operation` with no
      `parameters` lens set, so the operation has no parameters key.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L367
    cases: [1687]

  - id: openapi/root/media-list
    claim: >
      The document-level `produces` and `consumes` are the same four-element
      list in source order — `makeMimeList [MTApplicationJSON,
      MTVndSingularJSON True, MTVndSingularJSON False, MTTextCSV]` at
      OpenAPI.hs#L405 and #L406 — i.e. ["application/json",
      "application/vnd.pgrst.object+json;nulls=stripped",
      "application/vnd.pgrst.object+json", "text/csv"]. Static: it does not
      vary with the schema, the role, or the database's media handlers. Not to
      be confused with the two-element per-operation `produces` of the "/"
      path item.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L405
    cases: [1688]

  - id: openapi/root/db-root-spec
    claim: >
      The db-root-spec config option (PGRST_DB_ROOT_SPEC / pgrst.db_root_spec,
      alias root-spec) overrides the entire root OpenAPI document with a
      function's return value. getResource maps the root path [] to
      `ResourceRoutine (qiName qi)` when configDbRootSpec is `Just qi`
      (ApiRequest.hs#L123), otherwise to ResourceSchema (#L124) — so the root
      goes through the ordinary routine path and its ordinary media
      negotiation. NOTE the arm ORDER: `(OADisabled,_) -> Left
      OpenAPIDisabled` is matched first (#L122), so openapi-mode=disabled wins
      over db-root-spec. The documented example function returns
      {"swagger":"2.0","info":{"title":"Overridden","description":"This is a my
      own API"}} and `curl http://localhost:3000` returns exactly that
      (docs/references/api/openapi.rst#L71-101).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L123
    cases: [1682]

  - id: openapi/root/server-proxy-uri
    claim: >
      Without openapi-server-proxy-uri the document's schemes/host/basePath
      describe the server itself: proxyUri falls through to
      `("http", configServerHost, configServerPort, "/")` (OpenAPI.hs#L445-451,
      the Nothing arm at #L451).
      With openapi-server-proxy-uri set, pickProxy parses the URI and those
      three keys are taken from it (OpenAPI.hs#L416-443), wired into the
      document as `basePath ?~ T.unpack b` (#L392), `schemes ?~ [s']` (#L393,
      with `s' = if s == "http" then Http else Https` at #L410) and
      `host .~ h'` (#L401, with `h' = Just $ Host (escapeHostName h) (Just p)`
      at #L411 — swagger2 renders that pair as "<host>:<port>"). The port is
      implied by the scheme when the URI omits it: `("", "https") -> 443`
      (#L442). An empty URI path becomes "/" (#L432). The docs print the exact
      resulting fragment for `openapi-server-proxy-uri = https://postgrest.com`
      — `"host": "postgrest.com:443"`, `"basePath": "/"`,
      `"schemes": ["https"]` (docs/references/configuration.rst#L856-870).
      A malformed URI never reaches here: the CLI rejects it at startup
      (`isMalformedProxyUri`, guarded at OpenAPI.hs#L422).
      UNCASED ON PURPOSE, `cases: []`. The previous pass shipped this as case
      1689 with a `config: {openapi-server-proxy-uri: ...}` block, but the
      frozen harness routes a config-carrying case to a dedicated instance
      ONLY if its id is listed in @variant_case_ids
      (test/support/conformance_server.ex), and 1689 is not there. url_for/1
      then falls through to the shared auth instance, the proxy config is
      silently ignored, and `$.host` comes back as `127.0.0.1:<port>` — the
      case would fail for a reason that has nothing to do with Bier's
      generator. A shipped-and-red case is worse than an uncased entry, so
      the case is HELD: the behavior, the exact expected values and the
      citations live here in full, and the case can be re-added verbatim from
      this entry the moment the harness owner allocates the variant id. See
      the matching `gaps` entry for the one-line harness change required.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/configuration.rst#L854
    cases: []

  # -------------------------------------------------------------------------
  # Descriptions sourced from COMMENTs
  # -------------------------------------------------------------------------
  - id: openapi/comments/schema-title-description
    claim: >
      The COMMENT on the exposed schema seeds info.title/info.description:
      the first line (up to the first "\n") becomes info.title, the remainder
      (after stripping leading newlines) becomes info.description.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L413
    cases: [1656]

  - id: openapi/comments/table-summary-description
    claim: >
      A table/view COMMENT seeds each operation's summary (first line) and
      description (remaining lines, leading newlines stripped). A single-line
      COMMENT yields summary only and no description key — the description is
      `mfilter (/="") tDesc` (OpenAPI.hs#L318), so an empty remainder drops the
      key rather than emitting "".
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L313
    cases: [1657, 1658]

  - id: openapi/comments/column-description
    claim: >
      A column COMMENT becomes the property `description`. For a primary key,
      "Note:\nThis is a Primary Key.<pk/>" is appended (preceded by the comment
      and a blank line if a comment exists). For a single-column M2O/O2O foreign
      key the FK note "This is a Foreign Key to `<tbl>.<col>`.<fk table='<tbl>'
      column='<col>'/>" is appended.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L139
    cases: [1659, 1660]

  - id: openapi/rpc/summary-description
    claim: >
      A function COMMENT seeds the RPC path-item operation summary/description
      the same way (first line -> summary, rest -> description).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L351
    cases: [1670]

  # -------------------------------------------------------------------------
  # Table path items, parameters & definitions
  # -------------------------------------------------------------------------
  - id: openapi/table/path-parameters
    claim: >
      For each table the GET parameters are, in order: one
      $ref:#/parameters/rowFilter.<table>.<col> per column, then select, order,
      range, rangeUnit, offset, limit, preferCount. POST parameters are
      body.<table>, select, preferPost. The shared parameter definitions are
      built by makeParamDefs (OpenAPI.hs#L225-231); the four prefer* ones come
      from makePreferParam, whose `enum` key is omitted when the family has no
      literal values (OpenAPI.hs#L177-185) — which is why preferParams alone
      has no enum.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L320
    cases: [1661, 1686]

  - id: openapi/table/response-status
    claim: >
      Which METHODS a table path item carries is decided ONCE, by a
      DISJUNCTION — not per method. makePathItem is
      `("/" ++ T.unpack tn, p $ tableInsertable t || tableUpdatable t ||
      tableDeletable t)` (OpenAPI.hs#L309): the False arm emits GET alone
      (`pr = (mempty :: PathItem) & get ?~ getOp`, #L338, selected at #L340)
      and the True arm adds POST, PATCH and DELETE TOGETHER
      (`pw = pr & post ?~ postOp & patch ?~ patchOp & delete ?~ deletOp`,
      #L339, selected at #L341). CONSEQUENCE an implementer must not miss: an
      insert-only relation (insertable, NOT updatable, NOT deletable) still
      documents PATCH and DELETE, and a relation that is none of the three
      documents none of them. Do NOT gate the three methods independently on
      tableInsertable/tableUpdatable/tableDeletable respectively — that
      diverges from PostgREST on every asymmetric relation.
      Statuses, all emitted by the same function: GET has 206 "Partial
      Content" (#L321) and 200 "OK" whose schema is an array of
      `#/definitions/<table>` (#L322-328); POST has 201 "Created" (#L331);
      PATCH has 204 "No Content" (#L334); DELETE has 204 "No Content"
      (#L337). Upstream asserts only the POST/PATCH/DELETE descriptions
      (OpenApiSpec.hs#L117, #L119, #L121); the two GET ones rest on the
      generator alone — see case 1662's notes.
      CORRECTED this pass: the entry previously claimed "POST/PATCH/DELETE are
      emitted only when the table is insertable/updatable/deletable", which
      reads as three independent gates and is not what makePathItem does; its
      `source:` also pointed at #L321 (`at 206`), which supports neither
      gating claim. Case 1662's notes already stated the disjunction
      correctly.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L309
    cases: [1662, 1663]

  - id: openapi/table/definition
    claim: >
      definitions.<table> is `type: object` with description from the table
      COMMENT, a property per column, and a `required` array of the NOT NULL
      columns. Views produce the same shape but with no `required` key when no
      column is non-nullable.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L100
    cases: [1664]

  # -------------------------------------------------------------------------
  # Type mapping & defaults
  # -------------------------------------------------------------------------
  - id: openapi/types/mapping
    claim: >
      PostgreSQL->Swagger mapping: character varying/character/text -> string;
      boolean -> boolean; smallint/integer/bigint -> integer (format int32 for
      smallint/integer, int64 for bigint); numeric/real/double precision ->
      number; json/jsonb -> no type, only format; arrays -> type array with
      items typed from the element type (json[]/jsonb[] items are {}). format is
      the verbatim column type except smallint/integer->int32, bigint->int64.
      character(n) carries maxLength n.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L56
    cases: [1665, 1666, 1667]

  - id: openapi/types/enum
    claim: >
      An enum column gets `type: string`, `format: <enum type name>`, and an
      `enum` array listing the labels in declaration order.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L112
    cases: [1668]

  - id: openapi/defaults/detection
    claim: >
      Column defaults are surfaced as the property `default`, JSON-decoded:
      text default -> "default" (string), boolean false -> false, integer 42 ->
      42, numeric 42.2 -> 42.2, date -> "1900-01-01", time -> "13:00:00". String
      types strip the `::type` cast suffix and the surrounding quotes.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L90
    cases: [1669]

  # -------------------------------------------------------------------------
  # RPC path items
  # -------------------------------------------------------------------------
  - id: openapi/rpc/get-params
    claim: >
      For a non-VOLATILE function the GET path-item lists one query parameter
      per argument (in: query). Scalar args use type/format from the type;
      array args use type:string (format <type>[]); a VARIADIC arg uses
      type:array with collectionFormat:multi and a typed items. `required` is
      true for args without a DEFAULT, false otherwise. OUT params are omitted.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L187
    cases: [1671, 1672]

  - id: openapi/rpc/post-body
    claim: >
      The POST path-item has parameters [args (body), $ref preferParams]
      (OpenAPI.hs#L216-223). Upstream asserts that body schema DIRECTLY, and
      that it-block — not the a_json one — is this entry's source: "includes
      function summary/description and body schema for arguments in the post
      path item" reads
      `paths./rpc/varied_arguments_openapi.post.parameters[0].schema`
      (OpenApiSpec.hs#L875, binding at #L879) and compares it to a literal
      object carrying `required` (#L892-908), `properties` (#L909-1003),
      `"type": "object"` (#L1004) and the COMMENT-derived `description`
      (#L1005) — nth 0 of the parameters array being the `args` body param,
      which is why the $ref preferParams sits at index 1.
      The args body schema is an object with a property
      per argument (OpenAPI.hs#L157) and a `required` array holding exactly the
      params for which `ppReq` holds (OpenAPI.hs#L158) — the no-DEFAULT,
      non-OUT ones. An INOUT param with no DEFAULT is both a property and
      required. A routine whose params are ALL OUT has NO input arguments at
      all — the routines query keeps only input arguments (`WHERE type IS NOT
      NULL`, SchemaCache.hs#L427) — so `pdParams` is empty and BOTH lenses are
      left at their aeson defaults (empty map, empty list). The swagger2
      encoder drops every field still equal to its default
      (Data/Swagger/Internal/AesonUtils.hs, `| Just x == def = rest`), so such
      a routine documents NEITHER a `properties` key NOR a `required` key: the
      whole args schema is exactly `{"type": "object"}` (plus `description`
      when the function carries a COMMENT). CORRECTED this pass — the entry
      previously claimed `properties: {}` was emitted. Upstream proves the
      default-drop in this same spec file: the `a_json` column schema is
      asserted to equal EXACTLY `{"format":"json"}`, with no `properties`, no
      `required` and no `type` (OpenApiSpec.hs#L514-526), and the
      child_entities_view definition is asserted as a whole object with no
      `required` key (#L179-209). The schema description is the function
      COMMENT (title + "\n\n" + description), asserted at #L1005 as
      "An RPC function\n\nJust a test for RPC function arguments".
      RE-POINTED this pass: `source:` used to be OpenApiSpec.hs#L514, the
      `it "json to any"` block asserting the a_json COLUMN schema. That anchor
      supports ONLY the ancillary swagger2 default-drop sub-claim above and
      says nothing about the RPC POST path item, its `parameters` list or its
      args schema — the entry's headline claim. It stays cited in the prose
      as the supporting evidence it always was; the primary anchor is now the
      it-block that actually asserts the POST body schema.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L875
    cases: [1673, 1683, 1684]

  - id: openapi/rpc/volatility-methods
    claim: >
      VOLATILE functions emit a POST path item only; every other volatility
      emits both GET and POST. The switch has exactly two arms, `Volatile ->
      post` and `_ -> get + post` (OpenAPI.hs#L363-365), so STABLE and
      IMMUTABLE share one arm.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L363
    cases: [1674, 1685]

  # -------------------------------------------------------------------------
  # openapi-mode: privileges
  # -------------------------------------------------------------------------
  - id: openapi/mode/follow-privileges
    claim: >
      In the default openapi-mode (follow-privileges) a table/function the
      request role lacks privileges on is omitted from paths. The privileged
      TABLE #/paths//authors_only is hidden for anonymous (OpenApiSpec.hs#L211
      "doesn't include privileged table for anonymous", Nothing at #L215) and
      appears with the privileged JWT (#L217, tag at #L222). The privileged
      FUNCTION #/paths//rpc/privileged_hello is hidden for anonymous
      (OpenApiSpec.hs#L1009 "doesn't include privileged function for anonymous",
      Nothing at #L1013) and appears with the privileged JWT (#L1015, tag at
      #L1018).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L1009
    cases: [1675, 1676]

  - id: openapi/mode/ignore-privileges
    claim: >
      With openapi-mode=ignore-privileges every exposed table/function is
      included regardless of the request role's privileges.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/IgnorePrivOpenApiSpec.hs#L41
    cases: [1677]

  - id: openapi/mode/disabled
    claim: >
      With openapi-mode=disabled, GET / returns 404 with the PGRST126 error
      body {"code":"PGRST126","details":null,"hint":null,"message":"Root
      endpoint metadata is disabled"}.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/DisabledOpenApiSpec.hs#L17
    cases: [1678]

  # -------------------------------------------------------------------------
  # Security schemes
  # -------------------------------------------------------------------------
  - id: openapi/security/default-absent
    claim: >
      By default the document has neither a top-level `security` nor a
      `securityDefinitions` key: makeSecurityDefinitions returns `mempty` and
      the security list is a comprehension guarded by the same flag
      (OpenAPI.hs#L382-385, #L407-408).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L1094
    cases: [1679]

  - id: openapi/security/active
    claim: >
      With openapi-security-active=true the document carries
      `security: [ { "JWT": [] } ]` and `securityDefinitions.JWT` =
      { type: apiKey, in: header, name: Authorization, description:
      'Add the token prepending "Bearer " (without quotes) to it' }
      (OpenAPI.hs#L387-388 for the scheme, #L412 for the name "JWT").
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/SecurityOpenApiSpec.hs#L21
    cases: [1680]

# ---------------------------------------------------------------------------
# Per-object fixture dependencies. Copied from content_negotiation.yaml's
# precedent: these cases assert over DECLARATIONS (volatility, return type,
# argument modes, COMMENTs, GRANTs), not over seed rows, so a fixture edit can
# silently turn a green case into a green-but-meaningless one. Each entry names
# the object, the property depended on, and what breaks if it changes.
# ---------------------------------------------------------------------------
fixture_notes:
  - object: test.root()
    property: >
      RETURNS json (conformance/fixtures.sql#L1621), transcribed from the
      DOCUMENTED example (docs/references/api/openapi.rst#L71) rather than from
      upstream's fixture, which declares `returns "application/openapi+json"`
      (test/spec/fixtures/schema.sql#L1867). Body is the "Overridden" document,
      not upstream's "PostgREST API" one.
    breaks: >
      Case 1682's body_exact is the Overridden document and its Accept is
      application/json — both follow from this declaration. Because the return
      type is plain json and not the mime-named domain, the routine registers
      no application/openapi+json handler (only the built-in {*/*,
      application/json, text/csv, application/geo+json} of
      SchemaCache.hs#L1016-1022), so an Accept of application/openapi+json is
      406/PGRST107 upstream. The case asked for exactly that until this pass.
  - object: test.jwt_test()
    property: >
      VOLATILE — `LANGUAGE sql SECURITY DEFINER` with no volatility keyword
      (conformance/fixtures.sql#L1099). Upstream's is IMMUTABLE
      (test/spec/fixtures/schema.sql#L347-349).
    breaks: >
      The upstream immutable-volatility it-block (OpenApiSpec.hs#L1078) reads
      /rpc/jwt_test and asserts GET and POST are both present. Transcribed
      literally against this fixture it would assert the OPPOSITE of upstream
      (POST only). Case 1685 uses test.three_defaults (IMMUTABLE) instead.
      Adding a volatility keyword to jwt_test would silently make the upstream
      form transcribable and this note stale.
  - object: test.variadic_param(VARIADIC v text[] DEFAULT '{}')
    property: >
      The DEFAULT '{}' (conformance/fixtures.sql#L1372), matching upstream
      test/spec/fixtures/schema.sql#L1277.
    breaks: >
      Case 1672 asserts `required: false` on the VARIADIC query parameter.
      That comes from the DEFAULT (`& required ?~ r`, OpenAPI.hs#L191), NOT
      from the parameter being VARIADIC. Dropping the DEFAULT flips the
      assertion while leaving collectionFormat/items untouched.
  - object: test.many_out_params / test.single_inout_param
    property: >
      Argument MODES: all-OUT (fixtures.sql#L1360) and single INOUT with no
      DEFAULT (#L1356). Neither carries an explicit GRANT, so both are visible
      to the anonymous role only via PostgreSQL's default PUBLIC EXECUTE.
    breaks: >
      Cases 1683/1684 assert the presence and absence of the args-schema
      `required` key. A REVOKE EXECUTE ON ... FROM PUBLIC would drop both
      routines from the document under the default follow-privileges mode and
      turn the assertions into vacuous absent-path passes.
  - object: schema openapi_no_comment
    property: >
      Exists and carries NO comment (fixtures.sql#L247, granted #L2002).
    breaks: >
      Case 1654's default title/description. Adding a COMMENT ON SCHEMA
      openapi_no_comment turns the case into a copy of 1656 with the wrong
      expectations. Conversely, the COMMENT ON SCHEMA test (fixtures.sql#L1675)
      is what case 1656 asserts — the two must stay on different schemas, which
      is why the harness boots a separate instance for 1654 rather than
      running a `COMMENT ... IS NULL` precondition.

