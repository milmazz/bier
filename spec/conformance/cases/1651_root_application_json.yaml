id: 1651
feature: openapi/root/media-type
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/openapi+json; charset=utf-8
  body_jsonpath:
    - { path: "$.swagger", equals: "2.0" }
notes: >
  GET / with Accept: application/json is ACCEPTED for the generated document
  but the response Content-Type is still application/openapi+json;
  charset=utf-8. Two source lines decide it. inspectPlan (Plan.hs#L247-250)
  computes `producedMTs = [MTOpenAPI, MTApplicationJSON, MTAny]` and returns
  `Right MTOpenAPI` for ANY non-empty intersection with the Accept list — the
  requested type is only a gate, never the answer; a non-intersecting Accept
  (e.g. text/csv) is the 406 of case 1653. The response builder then discards
  the planned media type entirely: `actionResponse (MaybeDbResult InspectPlan
  ...)` hard-codes `MediaType.toContentType MTOpenAPI` (Response.hs#L208), and
  toContentType appends "; charset=utf-8" for every type except octet-stream
  and MTOther (MediaType.hs#L59-65).
  CORRECTED this pass. The case previously expected `application/json;
  charset=utf-8`, citing RootSpec.hs#L27. That it-block does assert exactly
  that pair — but at v16.0 RootSpec runs under `baseCfg { configDbRootSpec =
  Just $ QualifiedIdentifier mempty "root" }` (RootSpec.hs#L16), so the root
  path is a ResourceRoutine (ApiRequest.hs#L123), not ResourceSchema, and the
  response goes through the ordinary routine media negotiation instead of
  Response.hs#L208. Case 1682 models that path; this case models the generated
  document, which declares no `config:`. Verify the enclosing `withConfig`, not
  just the it-block.
  This is NOT a v16.0 behavior change: v14.12 has the identical pair at
  src/PostgREST/Plan.hs#L226-229 and src/PostgREST/Response.hs#L214. The
  defect was in the model, not in upstream.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response.hs#L208
