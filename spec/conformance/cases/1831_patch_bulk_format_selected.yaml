id: 1831
feature: domain_representations/write/patch_bulk_format_selected
request:
  method: PATCH
  path: /datarep_todos_computed?id=lt.4&select=id,name,label_color,dark_color
  headers:
    Accept: application/json
    Content-Type: application/json
    Prefer: return=representation
  body_json: { "label_color": "#221100", "due_at": "2019-01-03T11:00:00Z" }
schema: domain_representations
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "0-2/*"
    Preference-Applied: return=representation
  body_exact:
    [
      {
        "id": 1,
        "name": "Report",
        "label_color": "#221100",
        "dark_color": "#110880",
      },
      {
        "id": 2,
        "name": "Essay",
        "label_color": "#221100",
        "dark_color": "#110880",
      },
      {
        "id": 3,
        "name": "Algebra",
        "label_color": "#221100",
        "dark_color": "#110880",
      },
    ]
notes: >
  Upstream UpdateSpec "for multiple rows" > "parses values in payload and formats
  individually selected values in return=representation". One payload patches
  three rows; the parsed value is applied to each and every returned row is
  formatted through the representation casts, computed dark_color included.
  Content-Range spans the three matched rows (0-2/*). Body verified against a
  freshly loaded bier_test.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L681
