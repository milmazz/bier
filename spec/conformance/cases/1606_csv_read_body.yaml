id: 1606
feature: content_negotiation/csv/read
request:
  method: GET
  path: /simple_pk?order=k.desc
  headers: { Accept: "text/csv; version=1" }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: text/csv; charset=utf-8
    Content-Length: "21"
  body_contains: "k,extra\nxyyx,u\nxYYx,v"
notes: >-
  text/csv (even with a version param) yields a CSV header row plus data rows,
  and the CSV body carries no trailing newline (Content-Length 21). Mirrors
  QuerySpec "should respond with CSV to 'text/csv' request". CHANGED in v16.0:
  the upstream it-block now sends an explicit `?order=k.desc` so the row order
  is deterministic (v14.12 relied on the physical order); the asserted body and
  Content-Length are unchanged.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1234
