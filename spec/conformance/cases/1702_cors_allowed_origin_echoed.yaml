id: 1702
feature: config/server-cors-allowed-origins/match
request:
  method: OPTIONS
  path: /items
  headers:
    Accept: "*/*"
    Origin: http://example.com
    Access-Control-Request-Method: POST
    Access-Control-Request-Headers: Content-Type
schema: config
config:
  db-schemas: test
  db-anon-role: postgrest_test_anonymous
  server-cors-allowed-origins: "http://example.com, http://example2.com"
preconditions: []
expect:
  status: 200
  headers:
    Access-Control-Allow-Origin: http://example.com
    Access-Control-Allow-Credentials: "true"
notes: "Preflight from an allowed origin echoes that origin and sets credentials true. Mirrors CorsSpec.hs 'OPTIONS preflight request should return Access-Control-Allow-Origin equal to origin' (the v14.12 io test moved into the hspec suite in v16.0)."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L74
