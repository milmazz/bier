id: 1769
feature: observability/server-timing/options-root
request:
  method: OPTIONS
  path: /
  headers: {}
schema: observability
config:
  server-timing-enabled: true
preconditions: []
expect:
  status: 200
  headers_present: [Server-Timing]
  headers_match:
    Server-Timing: "jwt;dur=[0-9]+\\.[0-9]+.*parse;dur=[0-9]+\\.[0-9]+.*response;dur=[0-9]+\\.[0-9]+"
  body_exact: null
notes: >
  OPTIONS on the root document carries a Server-Timing header. Upstream asserts
  ONLY the presence of jwt, parse and response
  (test/spec/Feature/Query/ServerTimingSpec.hs#L104-L111, via the presence-only
  matchServerTimingHasTiming, SpecHelper.hs#L76-L82) — third leg of the same
  upstream it-block that cases 1757 (table) and 1768 (rpc) cover.
  DO NOT assert that plan and transaction are absent. The anchored line is the
  `ActSchemaInfo` arm of `Plan.actionPlan`: it returns `NoDb SchemaInfoPlan`,
  so no read plan is built and `MainTx.mainTx` yields `NoDbTx`
  (MainTx.hs#L87) — but both stages are still wrapped in `withTiming`
  (App.hs#L210, App.hs#L225), which branches only on configServerTimingEnabled
  (App.hs#L272-L279). A real v16.0 `OPTIONS /` response therefore contains
  `plan;dur=` and `transaction;dur=`. An earlier pass of this case carried
  `headers_absent_in_value: {Server-Timing: [plan, transaction]}`; that pinned
  behavior PostgREST does not have and has been removed.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L177
