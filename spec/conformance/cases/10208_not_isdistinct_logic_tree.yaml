id: 10208
feature: operators/not/logic_tree
request:
  method: GET
  path: /entities?and=(id.not.eq.2,arr.not.isdistinct.{1,2,3})&select=id
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 3 }
notes: >
  The `not` prefix also applies to isdistinct inside an and() logic tree:
  `NOT (arr IS DISTINCT FROM '{1,2,3}')`, i.e. null-safe equality. Mirrors
  AndOrParamsSpec.hs 'operators with not' / 'isdistinct can be negated'.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L196
