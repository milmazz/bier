id: 10223
feature: operators/fts/auto_tsvector/language/jsonb
request:
  method: GET
  path: /tsearch_to_tsvector?select=jsonb_search&jsonb_search=fts(french).amusant
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "jsonb_search": { "text_search": "C'est un peu amusant de faire l'impossible" } }
notes: >
  Same double use of the (language) modifier as case 10222, against a jsonb
  column: `to_tsvector('french', jsonb_search) @@ to_tsquery('french',
  'amusant')`. Mirrors QuerySpec.hs it "finds matches with different
  dictionaries and uses them as configuration for to_tsvector()"
  (jsonb_search assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L407
