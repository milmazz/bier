id: 10210
feature: operators/quantifier/lte_all
request:
  method: GET
  path: /projects?id=lte(all).{4,3}
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1, "name": "Windows 7", "client_id": 1 }
    - { "id": 2, "name": "Windows 10", "client_id": 1 }
    - { "id": 3, "name": "IOS", "client_id": 2 }
notes: >
  lte(all) -> `id <= ALL('{4,3}')`. Mirrors QuerySpec.hs any/all quantifiers
  'works with the lt/lte operator' (second assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1527
