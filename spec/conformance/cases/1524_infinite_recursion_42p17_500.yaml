id: 1524
feature: errors/sqlstate/infinite_recursion
request:
  method: GET
  path: /infinite_recursion?select=*
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 500
  headers:
    Content-Length: "128"
  body_exact:
    code: "42P17"
    message: 'infinite recursion detected in rules for relation "infinite_recursion"'
    details: null
    hint: null
notes: >
  test.infinite_recursion is a view defined over itself, so planning a read of
  it raises SQLSTATE 42P17. 42P17 has its own rule in the SQLSTATE map and maps
  to HTTP 500 (Error.hs:588); the envelope is the raw PG ServerError, with the
  SQLSTATE as code and no detail or hint. Note the relation resolves fine in the
  schema cache — this is an execution-time failure, not a PGRST205. Mirrors
  QuerySpec.hs "test infinite recursion error 42P17" / "return http status 500"
  (L1680-L1685), which asserts this exact body and Content-Length 128.
  The PG message names the relation unqualified, so the body is
  byte-identical to upstream's regardless of schema; reproduced on a freshly
  loaded bier_test (SQLSTATE 42P17, same message). Fixture objects come from
  fixtures/errors.delta.sql.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1680
