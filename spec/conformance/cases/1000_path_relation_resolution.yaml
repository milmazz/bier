id: 1000
feature: url_grammar/path/relation
request:
  method: GET
  path: /items?id=eq.5
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: 0-0/*
  body_exact: [{ "id": 5 }]
notes: "Single path segment resolves to a relation; a single row is addressed by a horizontal filter, not a path id. Mirrors QuerySpec 'matches with equality' (v16.0: it at L40, get \"/items?id=eq.5\" at L41, body [{\"id\":5}] at L42, Content-Range 0-0/* + Content-Length 10 at L43-L46). Anchor kept at the it-line. NOTE: the 'matches items IN' test (get \"/items?id=in.(1,3,5)\") is the unrelated block at L64; do not re-anchor onto it."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L40
