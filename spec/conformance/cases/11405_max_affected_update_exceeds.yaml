id: 11405
feature: mutations/max-affected/strict-exceeds-update
request:
  method: PATCH
  path: /tiobe_pls?name=eq.Java
  headers:
    Content-Type: application/json
    Prefer: handling=strict, max-affected=0
  body: [{ "name": "Java", "rank": 19 }]
schema: mutations
preconditions: []
expect:
  status: 400
  body_exact: { "code": "PGRST124", "details": "The query affects 1 rows", "hint": null, "message": "Query result exceeds max-affected preference constraint" }
notes: >-
  max-affected guards PATCH as well as DELETE (cases 1390/1391): one matching
  row against max-affected=0 exceeds the cap, so the mutation is rolled back
  with PGRST124 and the affected count is reported verbatim in `details`
  ("The query affects 1 rows"). Mirrors
  Preferences/MaxAffectedSpec.hs#L31-L37 ("should fail if items updated more
  than 0"), including its single-element-array PATCH payload.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L32
