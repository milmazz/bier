id: 11802
feature: auth/role-claim-key/missing-key
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload:
      role: postgrest_test_author
      other: true
schema: auth
preconditions: []
config:
  jwt-role-claim-key: "$.myRole"
expect:
  status: 401
notes: >-
  A configured `jwt-role-claim-key` fully replaces the default `$.role`: with
  `$.myRole` configured, the token's `role` claim is NOT consulted, the path
  matches nothing, and the request falls back to `db-anon-role`
  (Auth/Jwt.hs#L114-L115) which cannot read `authors_only` -> 401. Upstream
  asserts the status only.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L150
