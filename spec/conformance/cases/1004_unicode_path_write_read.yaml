notes: "Insert into percent-encoded unicode relation, returns representation with unicode column name. The exposed schema is تست, set inline in v16.0 at UnicodeSpec.hs#L15 (configDbSchemas = fromList [\"تست\"]); schema created at fixtures/schema.sql#L10. The cited UnicodeSpec block sends both Prefer: tx=commit and Prefer: return=representation (L22) and expects 201 (L26)."
