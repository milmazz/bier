id: 1286
feature: pagination/count/preference_applied_on_read
request:
  method: GET
  path: /items?id=eq.1&order=id
  headers:
    Accept: application/json
    Prefer: count=exact
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-0/1"
    Preference-Applied: "count=exact"
  body_exact: [{"id":1}]
notes: >
  `Prefer: count=exact` is echoed back as `Preference-Applied: count=exact` on
  a plain read, not only on mutations. responsePreferences masks
  resolution/representation/missing/max-affected per plan but passes
  preferCount through unfiltered for EVERY plan (Response.hs:296), and the
  WrappedReadPlan branch of actionResponse appends
  `prefAppliedHeader $ responsePreferences plan ctxApiRequest` to its headers
  (Response.hs:63); prefAppliedHeader serializes `toHeaderValue <$>
  preferCount` = "count=exact" (Preferences.hs:183, :232). Upstream asserts
  this header only on mutations (InsertSpec.hs:101, DeleteSpec.hs:33), so the
  read-path assertion is derived from source (ground-truth priority 2).
  Status is 200, not 206: total = 1 and the returned window is 1 + 0 - 0 = 1,
  which is not < 1 (RangeQuery.hs:108). Contrast case 1267, where 'count=none'
  produces no Preference-Applied header at all. Verified against a freshly
  loaded bier_test: pagination.items exposes only `id` and holds ids 1..15, so
  `id=eq.1` matches exactly one row.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response.hs#L63
