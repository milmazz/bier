id: 1550
feature: headers/prefer/preference-applied
request:
  method: POST
  path: /projects?select=name,client_id
  headers:
    Prefer: "return=representation"
    Content-Type: application/json
  body: { "id": 10, "name": "New Project", "client_id": 2 }
schema: headers
preconditions: []
expect:
  status: 201
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "*/*"
    Preference-Applied: "return=representation"
  headers_absent: [Location]
  body_exact: [{ "name": "New Project", "client_id": 2 }]
notes: >
  A single applied "Prefer: return=representation" is echoed verbatim in
  Preference-Applied with NO count token: count defaults to none unless a
  "count=exact" preference is also supplied. Contrast the separate it-block at
  InsertSpec.hs:93-102, which sends "Prefer: return=representation" and
  "Prefer: count=exact" as two headers and therefore asserts
  "Preference-Applied: return=representation, count=exact" (L101) plus
  "Content-Range: */1" (L100) — that one is mirrored by case 1300. This case
  deliberately exercises the single-preference path, so Content-Range is "*/*".
  Mirrors the exact it-block at InsertSpec.hs:116-125 ("should not throw and
  return location header when selecting without PK").
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L116
