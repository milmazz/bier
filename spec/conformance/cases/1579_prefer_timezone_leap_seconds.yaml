id: 1579
feature: headers/prefer/timezone-leap-seconds
request:
  method: GET
  path: /timestamps
  headers:
    Prefer: "timezone=05:30:15"
schema: headers
preconditions: []
expect:
  status: 400
  body_exact:
    code: "22023"
    message: 'time zone "05:30:15" appears to use leap seconds'
    details: "PostgreSQL does not support leap seconds."
    hint: null
notes: >
  NEW in PostgREST v16.0: because the `timezone` preference is no longer
  filtered against pg_timezone_names, a syntactically-offset-looking value
  that PostgreSQL rejects surfaces as a database error rather than being
  ignored. A seconds-precision offset raises SQLSTATE 22023 with a DETAIL,
  and the DETAIL is carried through into the error envelope's `details`
  (the generic PgError path, not a PGRST* one); 22023 maps to 400 via
  Error.hs#L561-L564. No Preference-Applied is emitted because the request
  fails. Mirrors the exact it-block at Preferences/TimezoneSpec.hs:80-86
  ("fails on leap seconds"). Message and detail text re-verified against a
  loaded bier_test (PostgreSQL 17).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L80
