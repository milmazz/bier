id: 1581
feature: headers/prefer/timezone-invalid-lenient
request:
  method: GET
  path: /timestamps
  headers:
    Prefer: "handling=lenient, timezone=Invalid/Timezone"
schema: headers
preconditions: []
expect:
  status: 400
  body_exact:
    code: "22023"
    message: 'invalid value for parameter "TimeZone": "Invalid/Timezone"'
    details: null
    hint: null
notes: >
  BEHAVIOR CHANGE in PostgREST v16.0. Under v14.12 this returned 200 with the
  default timezone and `Preference-Applied: handling=lenient` (the timezone
  token being dropped as unacceptable). v16.0 documents the new rule
  explicitly — "handling=lenient is ignored for timezone. Invalid time zones
  always return an error" (docs/references/api/preferences.rst#L65-L67) —
  because the preference parser no longer classifies any `timezone=` token as
  invalid (src/library/PostgREST/ApiRequest/Preferences.hs#L161-L163), so
  `handling` has nothing to suppress and PostgreSQL's 22023 reaches the
  client as a 400. Mirrors the exact it-block at
  Preferences/TimezoneSpec.hs:51-57 ("should throw error with
  handling=lenient").
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L51
