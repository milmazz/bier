id: 1267
feature: pagination/count/none
request:
  method: GET
  path: /items?order=id
  headers:
    Accept: application/json
    Prefer: count=none
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-14/*"
  headers_absent: ["Preference-Applied"]
  body_exact: [{"id":1},{"id":2},{"id":3},{"id":4},{"id":5},{"id":6},{"id":7},{"id":8},{"id":9},{"id":10},{"id":11},{"id":12},{"id":13},{"id":14},{"id":15}]
notes: >
  count=none yields Content-Range total '*' even for a full result; status 200.
  Mirrors RangeSpec.hs:168 (the request is at :169-170, the asserted
  Content-Range at :172). `Preference-Applied` must be ABSENT: 'count=none' is
  not a PreferCount value — fromHeaders parses count with
  `parsePrefs [ExactCount, PlannedCount, EstimatedCount]`
  (Preferences.hs:134) — so preferCount stays Nothing and prefAppliedHeader
  returns Nothing for a request carrying no other preference
  (Preferences.hs:174-183). Contrast case 1286, where count=exact IS echoed.
  Upstream asserts only the Content-Range here; the absence is source-derived.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L168
