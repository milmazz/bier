id: 1399
feature: mutations/upsert/put/error/offset-not-allowed
request:
  method: PUT
  path: /tiobe_pls?name=eq.Javascript&offset=1
  headers: { Content-Type: application/json }
  body: [{ "name": "Javascript", "rank": 1 }]
schema: mutations
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: { "message": "limit/offset querystring parameters are not allowed for PUT", "code": "PGRST114", "details": null, "hint": null }
notes: >-
  The PGRST114 restriction covers `offset` as well as `limit` (case 1383): both
  produce the identical envelope. Mirrors UpsertSpec.hs#L302-L307
  ("fails if offset is specified").
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L303
