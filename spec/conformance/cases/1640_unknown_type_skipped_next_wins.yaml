id: 1640
feature: content_negotiation/precedence/unknown-skipped
request:
  method: GET
  path: /simple_pk
  headers: { Accept: "text/unknowntype, text/csv" }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: text/csv; charset=utf-8
notes: >-
  An unmatched leading media type is SKIPPED, not fatal: negotiateContent walks
  the accept list and picks the first entry for which a handler exists, so
  "text/unknowntype, text/csv" resolves to CSV rather than 406. Mirrors QuerySpec
  'should respond correctly to multiple types in accept header' (which asserts
  the 200); the Content-Type follows from firstAcceptedPick
  (Plan/Negotiate.hs#L63) plus toMime MTTextCSV (MediaType.hs#L72), the same
  mechanism asserted by cases 1604/1605.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1229
