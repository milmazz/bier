id: 11402
feature: mutations/insert/form-urlencoded-body
request:
  method: POST
  path: /menagerie
  headers: { Content-Type: application/x-www-form-urlencoded }
  body_raw: "integer=7&double=2.71828&varchar=forms+are+fun&boolean=false&date=1900-01-01&money=$3.99&enum=foo"
schema: mutations
preconditions: []
expect:
  status: 201
  headers:
    Content-Length: "0"
  headers_absent: [Content-Type]
notes: >-
  An application/x-www-form-urlencoded body is accepted and treated as a single
  row: the form field names are the column names and `+` decodes to a space.
  Verbatim mirror of InsertSpec.hs#L169-L180 (context "from an html form"),
  including its asserted 201, absent Content-Type and Content-Length 0.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L171
