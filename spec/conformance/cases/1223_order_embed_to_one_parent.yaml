id: 1223
feature: ordering/embed/to_one_parent
request:
  method: GET
  path: /projects?id=eq.1&select=id,name,clients(id,name)&clients.order=name.asc
  headers: { Accept: application/json }
schema: ordering
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - id: 1
      name: "Windows 7"
      clients: { id: 1, name: "Microsoft" }
notes: >
  "ordering embeded parents does not break things": an <embed>.order on a to-one
  (many-to-one) embed is accepted and is a no-op on the shape — the embed still
  serializes as a single JSON object, not an array. projects.client_id = 1 =>
  Microsoft.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1169
