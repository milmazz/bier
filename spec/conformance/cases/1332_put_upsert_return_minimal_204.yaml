id: 1332
feature: representations/put/single-upsert-return-minimal
request:
  method: PUT
  path: /items?id=eq.2
  headers:
    Prefer: "return=minimal"
    Content-Type: application/json
  body: [{ "id": 2 }]
schema: representations
preconditions: []
expect:
  status: 204
  headers:
    Preference-Applied: "return=minimal"
  headers_absent: [Content-Type]
  body_exact: ""
notes: >-
  PUT single upsert with return=minimal yields 204 with empty body regardless of
  insert vs replace, and echoes Preference-Applied: return=minimal. Directly
  mirrors the upstream it-block "works with request method PUT and
  return=minimal" (UpsertSpec.hs#L543-L552: matchStatus 204,
  matchHeaderAbsent hContentType, "Preference-Applied" <:> "return=minimal"),
  substituting /items for /UnitTest — the mutable relation this area's fixture
  isolates. Status/body come from the None arm of the SingleUpsert dispatch
  (Response.hs#L153); the echo from responsePreferences passing
  preferRepresentation through for any MutateReadPlan{} (Response.hs#L281-L283)
  plus prefAppliedHeader (Response.hs#L143).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L543
