id: 1770
feature: observability/server-timing/render-format
request:
  method: GET
  path: /organizations?id=eq.6
  headers: { Accept: application/json }
schema: observability
config:
  server-timing-enabled: true
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_match:
    Server-Timing: "\\Ajwt;dur=[0-9]+\\.[0-9], parse;dur=[0-9]+\\.[0-9], plan;dur=[0-9]+\\.[0-9], transaction;dur=[0-9]+\\.[0-9], response;dur=[0-9]+\\.[0-9]\\z"
  body_exact: [{ "id": 6, "name": "Oscorp", "referee": 3, "auditor": 4, "manager_id": 6 }]
notes: >
  Pins the exact wire rendering of Server-Timing, which case 1750 leaves loose
  (its regex allows any separator and any number of decimals). serverTimingHeader
  joins the five metrics with the two-byte separator ", " in the fixed order
  jwt, parse, plan, transaction, response (Performance.hs:35-41), and renders
  each duration with `showFFloat (Just 1)` — EXACTLY one fractional digit, no
  more (Performance.hs:34). The module doctest is the ground truth for the whole
  string: `serverTimingHeader ServerTiming { plan=Just 0.1, transaction=Just 0.2,
  response=Just 0.3, jwt=Just 0.4, parse=Just 0.5}` renders
  ("Server-Timing","jwt;dur=0.4, parse;dur=0.5, plan;dur=0.1, transaction;dur=0.2,
  response;dur=0.3") — the anchored line. The values are milliseconds:
  `withTiming` measures with PostgREST.TimeIt.timeItT, which multiplies the
  monotonic-clock delta by 1000 (TimeIt.hs:18). The regex is anchored with \A/\z
  so a trailing/leading metric, a missing space after the comma, or a second
  decimal digit all fail.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/Performance.hs#L29
