id: 10230
feature: operators/fts/auto_tsvector/recursive_domain
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search_rec_domain&text_search_rec_domain=fts(simple).of
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_rec_domain": "'do':7 'fun':5 'impossible':9 'it':1 'kind':3 'of':4 's':2 'the':8 'to':6" }
notes: >
  `text_search_rec_domain` is a domain over a domain
  (`tsvector_not_empty AS tsvector_not_null AS tsvector`). The base type is
  resolved TRANSITIVELY -- a WITH RECURSIVE walk of pg_type.typbasetype below
  PG17 (SchemaCache.hs#L383), pg_basetype() on PG17+ -- so cfBaseType is still
  `tsvector` and the to_tsvector() wrap is still skipped (Plan.hs#L335). A
  single-level (non-recursive) resolution would leave cfBaseType at
  `tsvector_not_null` and re-introduce the broken to_tsvector() wrap. Mirrors
  QuerySpec.hs it "works when the column type is a recursive tsvector domain".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L309
