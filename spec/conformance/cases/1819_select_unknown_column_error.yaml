id: 1819
feature: domain_representations/read/unknown_column_error
request:
  method: GET
  path: /datarep_todos?select=id,label_color,banana
  headers: { Accept: application/json }
schema: domain_representations
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    {
      "code": "42703",
      "details": null,
      "hint": null,
      "message": "column datarep_todos.banana does not exist",
    }
notes: >
  Selecting an unknown column alongside data-representation columns must still fail
  the ordinary way: the representation resolver leaves the unknown field untouched
  (no transform is installed) and Postgres raises 42703, surfaced as a 400 with the
  standard error envelope. Mirrors QuerySpec.hs 'fails in some reasonable way when
  selecting fields that don't exist'. Upstream also asserts Content-Length 98; this
  case asserts the body instead, consistently with the other error case in this area
  (1809).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1556
