id: 1711
feature: config/validation/invalid-role-claim-key
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_JWT_ROLE_CLAIM_KEY: ".role.other"
preconditions: []
expect:
  exit_code: nonzero
  stderr_contains: "failed to parse role-claim-key value (.role.other)"
notes: "An invalid jwt-role-claim-key JSPath aborts startup. Mirrors test_cli.py:test_invalid_role_claim_key over fixtures.yaml invalidroleclaimkeys[0]. v16.0 moved to RFC 9535 JSONPath, so a leading-dot expression (the v14.12 grammar) is now itself invalid — the query must start with '$'."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_cli.py#L216
