id: 10232
feature: operators/fts/tsquery_operators/or
request:
  method: GET
  path: /tsearch?text_search_vector=fts.impossible%7Cpossible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'fun':5 'imposs':9 'kind':3" }
    - { "text_search_vector": "'also':2 'fun':3 'possibl':8" }
notes: >
  The tsquery OR operator `|` (percent-encoded %7C) passes through to
  to_tsquery unchanged: `text_search_vector @@
  to_tsquery('impossible|possible')` (SqlFragment.hs#L412). Case 1090 uses the
  same encoding incidentally inside a `not.fts` value; this case pins the
  operator itself. Mirrors QuerySpec.hs it "can use lexeme boolean
  operators(&=%26, |=%7C, !) in to_tsquery" (second assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L193
