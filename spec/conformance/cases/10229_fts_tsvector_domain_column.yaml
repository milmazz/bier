id: 10229
feature: operators/fts/auto_tsvector/domain
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search_domain&text_search_domain=fts(simple).of
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_domain": "'do':7 'fun':5 'impossible':9 'it':1 'kind':3 'of':4 's':2 'the':8 'to':6" }
notes: >
  `text_search_domain` is of domain type `tsvector_not_null AS tsvector`. The
  to_tsvector() exemption keys on cfBaseType (Plan.hs#L335), and cfBaseType is
  the introspected `data_type`, which for a domain is substituted with
  format_type(base_type) when the base type lives in pg_catalog
  (SchemaCache.hs#L608). So the domain resolves to `tsvector` and the filter
  emits a bare `text_search_domain @@ to_tsquery('simple', 'of')`. If the
  exemption were keyed on the nominal type instead, the query would compile to
  to_tsvector(<tsvector domain>) and fail to type-check. Mirrors QuerySpec.hs
  it "works when the column type is a tsvector domain".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L302
