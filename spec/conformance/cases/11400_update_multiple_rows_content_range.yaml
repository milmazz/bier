id: 11400
feature: mutations/update/multiple-rows-content-range
request:
  method: PATCH
  path: /no_pk?b=eq.0
  headers: { Content-Type: application/json }
  body: { "b": "1" }
schema: mutations
preconditions: []
expect:
  status: 204
  headers:
    Content-Range: 0-1/*
  headers_absent: [Content-Type, Content-Length]
notes: >-
  A PATCH that affects more than one row reports the affected count in
  Content-Range as `0-<n-1>/*` — here two rows (`no_pk` seeds ('1','0') and
  ('2','0'), plus a (null,null) row that the b=eq.0 filter excludes) give
  "0-1/*". Mirrors UpdateSpec.hs#L102-L117 ("can update multiple items",
  PATCH /no_pk?b=eq.0). Upstream additionally sends Prefer: tx=commit so it can
  read the rows back in the same test; this case omits it because the frozen
  harness runs with db-tx-end=rollback and asserts the wire response only, and
  because a committed write would leak into other cases.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L115
