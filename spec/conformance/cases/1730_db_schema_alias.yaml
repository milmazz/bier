id: 1730
feature: config/aliases/db-schema-singular
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  file:
    db-schema: "aliased_schema"
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'db-schemas = "aliased_schema"'
notes: "Singular db-schema is a deprecated alias for db-schemas. In v16.0 the pair is resolved inside parseDbSchemas (Config.hs#L296, #L361-L371)."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L296
