id: 1557
feature: headers/profile/default-schema
request:
  method: GET
  path: /parents
  headers: { Accept: application/json }
schema: headers
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Profile: v1
  body_exact:
    - { "id": 1, "name": "parent v1-1" }
    - { "id": 2, "name": "parent v1-2" }
notes: >
  No Accept-Profile -> the first exposed schema (v1) is used and echoed in
  Content-Profile. The echo is conditional on more than one schema being
  exposed: getSchema returns
  `Right (defaultSchema, length configDbSchemas /= 1)` (ApiRequest.hs#L161) and
  profileHeader emits nothing when that flag is False (Response.hs#L257-L262),
  so a single-schema instance would send no Content-Profile at all. Both
  upstream (`configDbSchemas = ["v1","v2","SPECIAL \"@/\\#~_-"]`,
  MultipleSchemaSpec.hs#L21) and this suite's shared instance expose several
  schemas, so the header is present. Mirrors MultipleSchemaSpec.hs:24-33.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/MultipleSchemaSpec.hs#L24
