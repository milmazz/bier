id: 1442
feature: rpc/args/variadic-post-form
request:
  method: POST
  path: /rpc/variadic_param
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body_raw: "v=hi&v=there"
schema: rpc
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: ["hi", "there"]
notes: >
  POST with Content-Type application/x-www-form-urlencoded binds arguments from
  the form body through the same DirectArgs path GET uses — `(Inv, MTUrlEncoded)
  -> DirectArgs $ maybe mempty (toRpcParams proc . payArray) iPayload`
  (Plan.hs#L222) — so a VARIADIC param repeats exactly like a repeated query
  param and "v=hi&v=there" yields ["hi", "there"]. Mirrors the upstream "works
  with POST and repeated params from html form" / "n>1" it-block (L746, request
  at L747, expectation at L751); contrast case 1415, where the same param is
  supplied as a JSON array under a JSON content type, and case 1416, the GET
  repeated-query-param form. Verified against a loaded bier_test:
  `select rpc.variadic_param('hi','there')` -> {hi,there}.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L747
