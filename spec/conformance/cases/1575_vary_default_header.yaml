id: 1575
feature: headers/vary/default
request:
  method: GET
  path: /projects
  headers: { Accept: application/json }
schema: headers
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Vary: "Accept, Prefer, Range"
notes: >
  NEW in PostgREST v16.0: every successful response carries
  `Vary: Accept, Prefer, Range` so caching proxies and CDNs key on the three
  request headers that change the representation. Emitted in App.hs'
  `toWaiResponse`, which appends `varyHeader` unless the response already
  carries a Vary (src/library/PostgREST/App.hs#L253, #L259, #L262). It is not
  route-specific — the same header is on reads, writes, RPC and OPTIONS —
  so this single case pins the default value. Upstream asserts only the
  status and this header ("match any body"), which is why no body assertion
  is made here. Mirrors the exact it-block at
  HttpHeaderSpec.hs:26-34 ("Test default Vary header value matches default
  one"), whose request is also `GET /projects` with the base config.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/HttpHeaderSpec.hs#L26
