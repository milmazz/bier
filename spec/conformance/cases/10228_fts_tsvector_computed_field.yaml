id: 10228
feature: operators/fts/computed_field/tsvector
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search_vector&text_search_vector=fts(simple).of
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'do':7 'fun':5 'impossible':9 'it':1 'kind':3 'of':4 's':2 'the':8 'to':6" }
notes: >
  `text_search_vector` here is not a column but the computed field
  `test.text_search_vector(test.tsearch_to_tsvector) RETURNS tsvector`
  (`select to_tsvector('simple', $1.text_search)`), so the fts filter targets a
  function call that already yields tsvector and no to_tsvector() wrap is
  applied. The 'simple' config keeps stop words, which is why the lexeme 'of'
  is present and matches. Mirrors QuerySpec.hs it "works with tsvector computed
  fields".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L295
