id: 1703
feature: config/server-cors-allowed-origins/empty-allows-all
request:
  method: OPTIONS
  path: /items
  headers:
    Accept: "*/*"
    Origin: http://anyorigin.com
    Access-Control-Request-Method: POST
    Access-Control-Request-Headers: Content-Type
schema: config
config:
  # The ONLY key upstream overrides for this group is the empty origin list
  # (CorsSpec.hs#L111 `withConfig baseCfg { configServerCorsAllowedOrigins = [] }`).
  # db-schemas/db-anon-role are deliberately absent: this case carries the
  # `config` profile label, so pinning db-schemas to `test` would make the
  # declared config contradict the Accept-Profile the harness sends.
  server-cors-allowed-origins: ""
preconditions: []
expect:
  status: 200
  headers:
    Access-Control-Allow-Origin: "*"
  headers_match:
    Access-Control-Allow-Methods: "POST"
notes: >
  Empty (but present) CORS config allows all origins: the preflight answers
  Access-Control-Allow-Origin "*" and its Access-Control-Allow-Methods value
  contains POST. In v16.0 server-cors-allowed-origins is a plain list whose
  empty value makes corsOrigins Nothing (Cors.hs#L31). Mirrors CorsSpec.hs
  "OPTIONS preflight request should allow all origins when config is not set or
  empty", whose two matchers are `"Access-Control-Allow-Origin" <:> "*"` and
  `matchHeaderValuePresent "Access-Control-Allow-Methods" "POST"`
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L125);
  the body is explicitly unconstrained upstream (MatchBody (\_ _ -> Nothing)),
  so this case asserts none.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L113
