id: 1703
feature: config/server-cors-allowed-origins/empty-allows-all
request:
  method: OPTIONS
  path: /items
  headers:
    Accept: "*/*"
    Origin: http://anyorigin.com
    Access-Control-Request-Method: POST
    Access-Control-Request-Headers: Content-Type
schema: config
config:
  db-schemas: test
  db-anon-role: postgrest_test_anonymous
  server-cors-allowed-origins: ""
preconditions: []
expect:
  status: 200
  headers:
    Access-Control-Allow-Origin: "*"
  body_jsonpath: []
notes: "Empty (but present) CORS config allows all origins; preflight returns '*' and lists POST in allowed methods. In v16.0 server-cors-allowed-origins is a plain list whose empty value makes corsOrigins Nothing (Cors.hs#L31). Mirrors CorsSpec.hs 'OPTIONS preflight request should allow all origins when config is not set or empty'."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L113
