id: 1742
feature: config/server-cors-allowed-origins/default-preflight
request:
  method: OPTIONS
  path: /
  headers:
    Accept: "*/*"
    Origin: http://example.com
    Access-Control-Request-Method: POST
    Access-Control-Request-Headers: "Foo,Bar"
schema: config
config:
  # Required: the permissive "*" preflight only holds at PostgREST's default
  # EMPTY origin list (SpecHelper baseCfg, configServerCorsAllowedOrigins = []).
  # Nothing else is declared — db-schemas/db-anon-role play no part in the
  # assertions and would contradict the `config` profile label.
  # KNOWN HARNESS GAP: this block is inert today (see config.yaml gaps,
  # "needed_assertion: the runner must honour `config` on HTTP cases").
  server-cors-allowed-origins: ""
preconditions: []
expect:
  status: 200
  headers:
    Access-Control-Allow-Origin: "*"
    Access-Control-Allow-Methods: "GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD"
    Access-Control-Allow-Headers: "Authorization, Foo, Bar, Accept, Accept-Language, Content-Language"
    Access-Control-Max-Age: "86400"
notes: >
  Upstream runs this it-block under plain `baseCfg`, whose
  `configServerCorsAllowedOrigins = []`
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/SpecHelper.hs#L167),
  so the case must declare `server-cors-allowed-origins: ""` explicitly — the
  "*" answer holds only for the empty origin list, not for a populated
  allowlist (which echoes the Origin and adds Allow-Credentials; see case 1702).
  With that empty list a preflight is answered "naively and permissively": corsOrigins
  is Nothing so Allow-Origin is "*" (Cors.hs#L31), the method list is the fixed
  Cors.hs#L33 set plus HEAD, Allow-Headers is "Authorization" plus the names
  echoed from Access-Control-Request-Headers (Cors.hs#L34/#L47) plus the CORS
  simple request headers, and Max-Age is 60*60*24 = 86400 (Cors.hs#L38).
  Mirrors CorsSpec.hs "replies naively and permissively to preflight request".
  The `config` block above is not yet honoured by the frozen runner for HTTP
  cases — recorded in config.yaml under
  "needed_assertion: the runner must honour `config` on HTTP cases".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L15
