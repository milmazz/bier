id: 1275
feature: pagination/count/estimated_falls_back_to_exact
request:
  method: HEAD
  path: /getallprojects_view?id=lt.3
  headers:
    Accept: application/json
    Prefer: count=estimated
schema: pagination
preconditions:
  - "ANALYZE test.projects;"
expect:
  status: 200
  headers:
    Content-Type: "application/json; charset=utf-8"
    Content-Range: "0-1/2"
notes: >
  count=estimated over a filtered view that matches 2 rows: Content-Range
  '0-1/2', status 200. Mirrors QueryLimitedSpec.hs:60 ("gives exact count when
  query rows <= maxRows"), whose server runs with max-rows=2.
  HOW THE TOTAL IS PICKED (model behavior PAG-023; MainTx.hs:129): for
  count=estimated PostgREST compares the EXACT total against db-max-rows —
  `if tableTotal > (fromIntegral <$> configDbMaxRows) then max tableTotal
  plannerEstimate else tableTotal` — it does NOT compare the planner estimate
  against db-max-rows. Upstream takes the else branch (2 > Just 2 is False) and
  reports the exact 2.
  Bier's conformance server sets db_max_rows: nil and overrides max-rows only
  for the `config` schema, so the comparison is `Just 2 > Nothing`, which is
  True: the reported total is max(exactTotal, plannerEstimate), NOT simply the
  exact count. A small exact count is therefore *not* deterministic regardless
  of max-rows. This expectation is safe only because EXPLAIN of the same query
  against the loaded bier_test also reports "Plan Rows": 2 — the SQL function
  behind the view is inlined, so its `ROWS 2019` declaration
  (fixtures.sql:1319-1322) never reaches the plan and estimate == exact. That
  coincidence is exactly why the model's gaps section emits no further
  count=estimated case.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QueryLimitedSpec.hs#L60
