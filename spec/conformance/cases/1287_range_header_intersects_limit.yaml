id: 1287
feature: pagination/range_header/intersects_limit
request:
  method: GET
  path: /items?select=id&order=id.asc&limit=2
  headers:
    Accept: application/json
    Range-Unit: items
    Range: 0-5
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-1/*"
  body_exact: [{"id":1},{"id":2}]
notes: >
  The Range header does not override limit/offset — the two windows are
  INTERSECTED: `headerAndLimitRange = rangeIntersection headerRange limitRange`
  (ApiRequest.hs:185), and that intersection becomes the top-level range
  (ApiRequest.hs:188, :191). Here limit=2 yields limitRange 0..1
  (QueryParams.hs:181, :187 -> `Range (BoundaryBelow 0) (BoundaryAbove 1)`) and
  'Range: 0-5' yields headerRange 0..5, so the effective window is 0..1: two
  rows, Content-Range '0-1/*'. An implementation that let the header override
  the params would return six rows with '0-5/*', which is what makes this case
  the discriminating one — case 1261 (limit=3 + 'Range: 0-1'), the only
  upstream it-block combining the two, is the single shape where intersection
  and override agree. Derived from source (ground-truth priority 2). Verified
  against a freshly loaded bier_test: pagination.items holds ids 1..15 and
  exposes only `id`.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L185
