id: 11815
feature: auth/audience/absent-succeeds
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "exp": 9999999999, "role": "postgrest_test_author", "id": "jdoe" }
schema: auth
config:
  jwt-aud: youraudience
preconditions: []
expect:
  status: 200
notes: >-
  With jwt-aud set, a verified token that carries NO `aud` claim at all still
  succeeds: the audience check is skipped when the key is absent
  (`parseMaybe (.:? "aud")` yields Nothing, so `audMatchesCfg` is never
  applied). Distinct from case 1494, which sends no JWT and short-circuits
  before claim validation, and from 11816, where the key is present but null.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L142
