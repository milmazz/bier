id: 11817
feature: auth/audience/array-single-match
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "exp": 9999999999, "role": "postgrest_test_author", "id": "jdoe", "aud": ["youraudience"] }
schema: auth
config:
  jwt-aud: youraudience
preconditions: []
expect:
  status: 200
notes: >-
  A single-element array `aud` whose only element matches jwt-aud -> 200. Its
  own upstream it-block, separate from the multi-element match pinned by case
  1471.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L64
