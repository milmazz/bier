id: 1499
feature: auth/role-claim-key/array-index
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload:
      customObject: { "manyRoles": ["other", "postgrest_test_author"] }
      other: {}
schema: auth
preconditions: []
config:
  jwt-role-claim-key: "$.customObject.manyRoles[1]"
expect:
  status: 200
notes: >-
  RFC 9535 index selector: `$.customObject.manyRoles[1]` picks the second
  element of the array claim as the role. Zero-based, same as the v14.12 JSPath
  DSL — only the leading `$` is new (CHANGELOG.md#L89). Upstream asserts the
  status only.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L129
