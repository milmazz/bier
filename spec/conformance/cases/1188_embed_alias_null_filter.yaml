id: 1188
feature: filters/embed/alias
request:
  method: GET
  path: /entities?select=name,childs:child_entities()&childs=is.null
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "name": "entity 3" }
    - { "name": null }
notes: >
  An embedded resource that carries an alias can be targeted by that ALIAS in
  an embedded filter: `childs:child_entities()` + `childs=is.null` performs the
  same anti-join as case 1186's target-name form. This is the forward-compatible
  spelling PostgREST v16.0 steers users to (see cases 1189/1190 and the
  url-use-legacy-target-names deprecation). Same fixture reasoning as 1186:
  child_entities has parent_ids {1,1,2,1,1,2}, so only entities 1 and 2 have
  children; entity 3 and the unnamed entity 4 have none. Mirrors
  RelatedQueriesSpec "related conditions through null operator on embed" >
  "works on a one-to-many relationship" (alias branch, L191-198).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L191
