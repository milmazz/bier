id: 1833
feature: domain_representations/write/patch_columns_param_ignores_other_keys
request:
  method: PATCH
  path: /datarep_todos_computed?id=eq.2&columns=due_at
  headers:
    Accept: application/json
    Content-Type: application/json
    Prefer: return=representation
  body_json:
    {
      "due_at": "2019-01-03T11:00:00Z",
      "smth": "here",
      "label_color": "invalid",
      "fake_id": 13,
    }
schema: domain_representations
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "0-0/*"
    Preference-Applied: return=representation
  body_exact:
    [
      {
        "id": 2,
        "name": "Essay",
        "label_color": "#000100",
        "dark_color": "#000080",
        "due_at": "2019-01-03T11:00:00Z",
      },
    ]
notes: >
  Upstream UpdateSpec "with ?columns parameter" > "ignores json keys not included
  in ?columns; parses only the ones specified". Only due_at is taken from the
  body, so the deliberately invalid "label_color": "invalid" is never handed to
  the `json AS color` parser (which would reject it) and the stored label_color
  is returned unchanged as "#000100" — proof that the ?columns filter is applied
  before the write-side casts. Body verified against a freshly loaded bier_test.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L711
