id: 1441
feature: rpc/prefer/max-affected-returns-single
request:
  method: POST
  path: /rpc/ret_void
  headers:
    Content-Type: application/json
    Accept: application/json
    Prefer: "handling=strict, max-affected=20"
  body: {}
schema: rpc
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: "PGRST128"
    message: "Function must return SETOF or TABLE when max-affected preference is used with handling=strict"
    details: null
    hint: null
notes: >
  RPC-specific rule, decided in callReadPlan before the routine runs:
  `failMaxAffectedRpcReturnsSingle (Just (PreferMaxAffected _), Just Strict) rout
  = if funcReturnsSingle rout then Left $ ApiRequestErr MaxAffectedRpcViolation`
  (Plan.hs#L238). `funcReturnsSingle` is true for every non-set return type
  (Routine.hs#L102-105), and `void` is a Single Scalar (funcReturnsVoid
  Routine.hs#L122-124), so a void-returning routine trips it. Status 400
  (Error.hs#L125), code PGRST128 (Error.hs#L172), message verbatim from
  Error.hs#L198; the upstream envelope at MaxAffectedSpec.hs#L127 shows
  details/hint null. Distinct from PGRST124 (MaxAffectedViolationError,
  Error.hs#L168), which the headers area covers as cases 1555/1556.
  Deviation from upstream: upstream posts an empty body to
  /rpc/delete_items_returns_void, a fixture Bier's conformance DB does not have;
  this case uses the already-loaded void routine `ret_void` (the same routine as
  case 1409) with the JSON `{}` body shape that case 1409 already proves
  resolves. Neither substitution touches the rule under test — the check reads
  only the routine's return type and the Prefer header, never the arguments.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L122
