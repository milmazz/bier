id: 1622
feature: content_negotiation/octet-stream/bytea-roundtrip
request:
  method: POST
  path: /rpc/unnamed_bytea_param
  headers:
    Content-Type: application/octet-stream
    Accept: application/octet-stream
  body: "hello-bytes"
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/octet-stream
  # Exact, not body_contains: upstream asserts `respBody == file`, i.e. byte
  # equality with the request payload and nothing appended. (The \SOH prefix
  # seen in CustomMediaSpec belongs to AGGREGATE-produced bodies; this is a
  # scalar function return, so the bytes come back untouched.)
  body_raw: "hello-bytes"
notes: >-
  POST to an RPC with a single unnamed bytea parameter echoes the raw request
  bytes back, and the Content-Type is a bare application/octet-stream with NO
  charset. Mirrors RpcSpec 'can insert bytea directly'; a short ASCII payload
  stands in for upstream's image.png fixture. That it-block asserts ONLY
  `respBody == file` (no status, no Content-Type), so the rest of this case is
  cited piece by piece rather than inferred from it:
  (1) octet-stream is negotiable here because upstream's fixture declares the
  routine as `returns "application/octet-stream"` -- a DOMAIN named after the
  mime, not plain bytea:
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/fixtures/schema.sql#L2372
  (2) a mime-named-DOMAIN RETURN TYPE -- on a plain non-set-returning function
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1080-L1086)
  or on the aggregate itself, i.e. `proc.prorettype`, NOT its stype
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1062)
  -- is the ONLY way an octet-stream handler gets registered,
  because the built-in handler map carries json/csv/geojson/"*/*" and nothing
  else
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1016).
  A routine returning plain `bytea` is therefore NOT negotiable as
  octet-stream -- that negative is case 1623, and this case must not be read as
  licensing a "bytea return => octet-stream" rule.
  (3) 200 is the ordinary status of a successful POST /rpc, pinned by the
  sibling single-unnamed-parameter it-block at
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1257
  (4) no charset: toContentType appends '; charset=utf-8' to every media type
  EXCEPT MTOctetStream and MTOther --
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L62
  Bier fixture note: spec/conformance/fixtures/content_negotiation.delta.sql
  corrects fixtures.sql:1201, which transcribed the routine as `RETURNS bytea`
  and made this response unreachable (406/PGRST107).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1184
