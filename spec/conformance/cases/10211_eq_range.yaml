id: 10211
feature: operators/eq/range
request:
  method: GET
  path: /ranges?range=eq.[1,3]&select=id
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1 }
notes: >
  eq is not scalar-only: `range = '[1,3]'` compares whole numrange values.
  Row 5 (range IS NULL) is excluded, unlike the null-safe isdistinct of case
  10206. Mirrors AndOrParamsSpec.hs 'can handle range operators' (eq
  assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L122
