id: 11415
feature: mutations/update/resource-embedding-m2m-with-parent
request:
  method: PATCH
  path: /users?id=eq.1&select=name,tasks(name,project:projects(name))
  headers:
    Content-Type: application/json
    Prefer: return=representation
  body: { "name": "Kevin Malone" }
schema: mutations
# No setup needed: the consolidated fixture seeds test.users id=1 ('Angela
# Martin'), the junction test.users_tasks with (1,1),(1,2),(1,3),(1,4), and
# tasks 1-4 = Design w7/Code w7/Design w10/Code w10 pointing at projects 1
# ('Windows 7') and 2 ('Windows 10') -- the same values upstream asserts. The
# conformance server runs every request with db-tx-end=rollback, so the update
# never persists.
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Preference-Applied: return=representation
  body_exact:
    - name: "Kevin Malone"
      tasks:
        - { "name": "Design w7", "project": { "name": "Windows 7" } }
        - { "name": "Code w7", "project": { "name": "Windows 7" } }
        - { "name": "Design w10", "project": { "name": "Windows 10" } }
        - { "name": "Code w10", "project": { "name": "Windows 10" } }
notes: >-
  PATCH + return=representation resolves a many-to-many embed (users -> tasks
  through the users_tasks junction) AND a to-one parent nested inside it
  (project:projects(name)) over the updated rows. Mirrors the it-block "without
  filters" under context "embeds an M2M relationship plus parent after update"
  (UpdateSpec.hs#L537-L556), asserting the same request, body, 200,
  Content-Type json and Preference-Applied: return=representation. The junction
  rows are returned in task-id order, the same order the frozen read-side M2M
  cases assert (e.g. case 1117). The block's sibling "with filters" it-block
  (#L558-L574, tasks.name=ilike.code* + tasks.project.name=like.*10, nulling one
  nested parent) is left uncased: embed-level filtering is owned by the
  select/filters bands, not by this one.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L539
