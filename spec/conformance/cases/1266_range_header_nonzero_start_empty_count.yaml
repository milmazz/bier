id: 1266
feature: pagination/range_header/nonzero_start_empty_with_count
request:
  method: GET
  path: /menagerie_empty
  headers:
    Accept: application/json
    Range-Unit: items
    Range: 1-2
    Prefer: count=exact
schema: pagination
preconditions: []
expect:
  status: 416
  headers:
    Content-Range: "*/0"
    Content-Length: "144"
  body_exact:
    message: "Requested range not satisfiable"
    code: "PGRST103"
    details: "An offset of 1 was requested, but there are only 0 rows."
    hint: null
notes: >
  Range with nonzero start over an empty table + count=exact
  (rangeHdrsWithCount) -> 416, Content-Range '*/0'. Mirrors RangeSpec.hs:463,
  which requests '/menagerie' — upstream's single-column EMPTY pagination
  table. Bier's consolidated fixture kept openapi.sql's 7-column type-mapping
  table as `test.menagerie` and renamed the empty one to
  `test.menagerie_empty` (fixtures.sql:75-79, :719-722), so the path targets
  `/menagerie_empty`.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L463
