id: 1685
feature: openapi/rpc/volatility-methods
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  body_jsonpath:
    - { path: "$.paths['/rpc/three_defaults'].get", present: true }
    - { path: "$.paths['/rpc/three_defaults'].post", present: true }
notes: >
  An IMMUTABLE function documents both a GET and a POST operation. The
  volatility switch has exactly two arms — `Volatile -> post only`, `_ -> get +
  post` (OpenAPI.hs#L363-365) — so IMMUTABLE and STABLE share the second arm.
  Case 1674 already pins the Volatile arm (test.reset_table) and the STABLE
  half of the wildcard arm (test.getallusers); this case pins the IMMUTABLE
  half, which upstream asserts separately at OpenApiSpec.hs#L1078-1085
  ("includes GET and POST methods for immutable functions").
  Upstream reads /rpc/jwt_test, whose declaration is IMMUTABLE
  (test/spec/fixtures/schema.sql#L347-349). The consolidated fixtures' copy is
  NOT: conformance/fixtures.sql#L1099 declares `test.jwt_test()` as `LANGUAGE
  sql SECURITY DEFINER` with no volatility keyword, i.e. VOLATILE, so it
  documents a POST only and asserting the upstream it-block over it verbatim
  would assert the opposite of upstream. This case uses
  `test.three_defaults(a int DEFAULT 1, b int DEFAULT 2, c int DEFAULT 3)
  LANGUAGE sql IMMUTABLE` (conformance/fixtures.sql#L1377) instead. See the
  fixture_notes entry in openapi.yaml.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L1078
