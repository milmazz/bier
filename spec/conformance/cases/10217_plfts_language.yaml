id: 10217
feature: operators/plfts/language
request:
  method: GET
  path: /tsearch?text_search_vector=plfts(french).amusant%20impossible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'amus':5 'fair':7 'impossibl':9 'peu':4" }
notes: >
  The optional parenthesised text-search config is not specific to fts: every
  FtsOperator accepts it, and pgFmtFtsLang prepends it as the first argument,
  giving `@@ plainto_tsquery('french', 'amusant impossible')`. Mirrors
  QuerySpec.hs 'finds matches with different dictionaries' (plfts assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L233
