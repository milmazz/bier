id: 1705
feature: config/dump-config/defaults
request:
  kind: cli
  flag: "--dump-config"
schema: config
config: {}
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'db-uri = "postgresql://"'
    - 'db-schemas = "public"'
    - 'db-anon-role = ""'
    - 'db-max-rows = ""'
    - 'server-port = 3000'
    - 'server-host = "!4"'
    - 'server-reuseport = false'
    - 'log-level = "error"'
    - 'db-tx-end = "commit"'
    - 'jwt-secret = ""'
    - 'jwt-role-claim-key = "$$.role"'
    - 'client-error-verbosity = "verbose"'
    - 'openapi-mode = "follow-privileges"'
    - 'server-unix-socket-mode = "660"'
    - 'url-use-legacy-target-names = true'
    - 'admin-server-port = ""'
    - 'admin-server-unix-socket = ""'
    - 'admin-server-unix-socket-mode = "660"'
notes: "Dumping config with no overrides yields the documented default values. Golden file: test/io/configs/expected/defaults.config. v16.0 changed the jwt-role-claim-key default dump to the RFC 9535 form \"$$.role\" and added client-error-verbosity, server-reuseport, url-use-legacy-target-names and the admin-server-unix-socket* keys."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/configs/expected/defaults.config#L1
