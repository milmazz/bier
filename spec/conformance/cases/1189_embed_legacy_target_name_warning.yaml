id: 1189
feature: filters/embed/legacy_target_name
request:
  method: GET
  path: '/projects?id=eq.1&select=id,name,the_tasks:tasks(id,name)&tasks.name=like.Code*'
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_match:
    Warning: '^299 \S+ "Embedded resource was referenced by relation name even though it has an alias\. This is deprecated and will stop working in a future release\. Update `tasks` to `the_tasks` in query string filters, orders or limits\."$'
  body_exact:
    - { "id": 1, "name": "Windows 7", "the_tasks": [{ "id": 2, "name": "Code w7" }] }
notes: >
  NEW IN v16.0 (upstream #4075), isolated to a FILTER. Upstream's it-block
  ("filters, orders and limits aliased embeded entities using the target name",
  QuerySpec#L1183-L1187) exercises a filter, an order and a limit at once; this
  case strips it to the filter alone, because `addFilters` is an independent
  caller of `updateNode useTargetNames` (the anchor below, reached from
  Plan.hs#L398) - the deprecation must fire from the horizontal filter by
  itself, not only from the order/limit path. The embed is aliased
  `the_tasks:tasks(...)` while the filter still targets the relation name
  `tasks.`, so matchTarget resolves it via the legacy branch (Plan.hs#L1029),
  updateLegacyAttrs sets relIsLegacyTargetNameMatch (Plan.hs#L1033-L1036),
  readPlanWarning (Plan.hs#L167) turns it into a (relName, alias) pair, and
  App.hs emits `299 PostgRESTv<version> "<msg> Update `tasks` to `the_tasks` in
  query string filters, orders or limits."` (gated on
  url-use-legacy-target-names = true, App.hs#L215; header built at
  App.hs#L264-L270). The agent token is asserted as `\S+` rather than a literal
  PostgREST version, since it identifies the emitting server. Fixture: project
  1 owns tasks 1 "Design w7" and 2 "Code w7"; only "Code w7" matches like.Code*.
  The verbatim upstream filter+order+limit form is covered cross-area by case
  1138.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L855
