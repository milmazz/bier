id: 1280
feature: pagination/count/exact_partial_206_range_header
request:
  method: GET
  path: /rpc/getitemrange?min=2&max=4
  headers:
    Accept: application/json
    Range-Unit: items
    Range: 1-1
    Prefer: count=exact
schema: pagination
preconditions: []
expect:
  status: 206
  headers:
    Content-Range: "1-1/2"
  body_exact: [{"id":4}]
notes: >
  The Range header selects the window on an /rpc/ read exactly as limit/offset
  do, and count=exact still reports the full function result size. Mirrors
  RpcSpec.hs:56 ("using the Range header"), which sends
  rangeHdrsWithCount (ByteRangeFromTo 1 1) = 'Range: 1-1' + 'Range-Unit: items'
  + 'Prefer: count=exact' (SpecHelper.hs:192). Case 1270 covers the
  limit/offset form of the same assertion. Verified against a freshly loaded
  bier_test: pagination.getitemrange(2,4) is
  `SELECT * FROM items WHERE id > 2 AND id <= 4`, yielding ids 3 and 4 (total
  2); the window 1-1 returns id 4, so 1 + 1 - 1 = 1 < 2 and the status is 206
  (RangeQuery.hs:108).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L56
