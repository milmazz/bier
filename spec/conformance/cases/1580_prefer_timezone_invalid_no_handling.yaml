id: 1580
feature: headers/prefer/timezone-invalid-default
request:
  method: GET
  path: /timestamps
  headers:
    Prefer: "timezone=Invalid/Timezone"
schema: headers
preconditions: []
expect:
  status: 400
  body_exact:
    code: "22023"
    message: 'invalid value for parameter "TimeZone": "Invalid/Timezone"'
    details: null
    hint: null
notes: >
  BEHAVIOR CHANGE in PostgREST v16.0. With no `handling` preference at all,
  v14.12 silently discarded an unknown timezone and answered 200 with the
  server's default zone and no Preference-Applied; v16.0 hands the value to
  PostgreSQL, which raises SQLSTATE 22023 -> 400
  (src/library/PostgREST/ApiRequest/Preferences.hs#L138 removed the
  pg_timezone_names gate; Error.hs#L561-L564 maps the SQLSTATE). The docs
  now say plainly "For an invalid time zone, PostgREST returns a database
  error" and show `HTTP/1.1 400 Bad Request`
  (docs/references/api/preferences.rst#L114-L123). Mirrors the exact it-block
  at Preferences/TimezoneSpec.hs:35-41 ("should throw error without
  handling"). Compare 1554 (handling=strict) and 1581 (handling=lenient):
  all three now produce this identical response.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L35
