id: 1194
feature: filters/embed/null_filtering
request:
  method: GET
  path: /entities?select=name,child_entities(name,grandchild_entities())&child_entities.grandchild_entities=not.is.null&child_entities=not.is.null
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - name: "entity 1"
      child_entities:
        - { "name": "child entity 1" }
        - { "name": "child entity 2" }
notes: >
  Null filtering composes across nesting levels: `child_entities.grandchild_entities=not.is.null`
  is itself an embedded filter (dotted path -> the child level), so it keeps
  only child rows that have at least one grandchild, and the outer
  `child_entities=not.is.null` then keeps only entities that still have at
  least one such child. `addNullEmbedFilters` rewrites each `is null` /
  `not.is null` filter whose field names an embed into a
  CoercibleFilterNullEmbed over that embed's aggregate alias, at every depth
  of the tree (Plan.hs#L959-L963 recurses into the forest). Both embeds are
  projected empty/partially so the related arrays stay out of the body.
  Mirrors RelatedQueriesSpec "related conditions through null operator on
  embed" > "works on nested embeds" (v16.0 L217-L223) verbatim, request and
  body.

  Fixture check against the consolidated bier_test: grandchild_entities
  parent_ids are 1,1,2,2,2, so child_entities 1 and 2 are the only ones with
  grandchildren, and both belong to entity 1 — the sole surviving parent.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RelatedQueriesSpec.hs#L217
