id: 11816
feature: auth/audience/null-ignored
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "exp": 9999999999, "role": "postgrest_test_author", "id": "jdoe", "aud": null }
schema: auth
config:
  jwt-aud: youraudience
preconditions: []
expect:
  status: 200
notes: >-
  An explicit `aud: null` is ignored even when jwt-aud is set -> 200. Its own
  upstream it-block, separate from the empty-array branch pinned by case 1473.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L129
