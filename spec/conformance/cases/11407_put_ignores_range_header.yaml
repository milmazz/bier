id: 11407
feature: mutations/upsert/put/ignores-range-header
request:
  method: PUT
  path: /tiobe_pls?name=eq.Java
  headers:
    Content-Type: application/json
    Prefer: return=representation
    Range: 1-1
  body: [{ "name": "Java", "rank": 5 }]
schema: mutations
preconditions: []
expect:
  status: 200
  body_exact: [{ "name": "Java", "rank": 5 }]
notes: >-
  A Range header on PUT is ignored: PUT addresses exactly one resource by its
  full primary key, so the request neither fails with 416 nor returns an empty
  window — the upserted row is returned as usual. Mirrors UpsertSpec.hs#L477-L487
  ("ignores the Range header"), which PUTs Java with ("Range", "1-1") and still
  gets back the single updated row. The seeded `tiobe_pls` already contains
  Java, so this is the update (200) leg, as in case 1382.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L484
