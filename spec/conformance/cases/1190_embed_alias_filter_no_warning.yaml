id: 1190
feature: filters/embed/alias
request:
  method: GET
  path: '/projects?id=eq.1&select=id,name,the_tasks:tasks(id,name)&the_tasks.name=like.Code*'
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1, "name": "Windows 7", "the_tasks": [{ "id": 2, "name": "Code w7" }] }
  headers_absent: [Warning]
notes: >
  The alias spelling of case 1189: targeting the aliased embed by its ALIAS
  (`the_tasks.name=like.Code*`) filters the same embedded rows and emits NO
  deprecation Warning header. Plan.updateNode's legacy matchTarget branch
  accepts `relName == targetNodeName || relAlias == Just targetNodeName`
  (the anchor below), so the alias resolves under the default
  url-use-legacy-target-names = true; updateLegacyAttrs only sets
  relIsLegacyTargetNameMatch when the match was by relation name AND an alias
  exists (Plan.hs#L1033-L1036), so an alias match leaves the flag unset and
  readPlanWarning (Plan.hs#L167) yields Nothing -> no Warning header
  (App.hs#L264-L270). Fixture: project 1 owns tasks 1 "Design w7" and
  2 "Code w7"; only "Code w7" matches like.Code*. The alias form of the same
  request is what QuerySpec asserts for ordering at L1160 and what the
  url-use-legacy-target-names = false spec (QuerySpec#L1709) requires. This
  case deliberately uses a FILTER (`the_tasks.name=like.Code*`); the ORDER
  spelling (`the_tasks.order=name.asc`) is covered cross-area by case 1141.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L1029
