id: 1767
feature: observability/log-level/crit-status-signal
request:
  method: GET
  path: /
  headers: { Accept: application/openapi+json }
schema: observability
config:
  log-level: crit
preconditions: []
expect:
  status: 200
notes: >
  Upstream `test_log_level` (the anchored parametrized test): at log-level=crit,
  `shouldLogResponse` is `const False` (Logger.hs#L63) and NO access-log line is
  emitted for any status — `assert len(output) == 0` (test_io.py#L544-L545).
  The requests themselves still succeed normally.
  WHAT THIS CASE ACTUALLY ASSERTS: only that the request still returns 200 while
  logging is suppressed. It does NOT exercise log-level at all, for two reasons:
  (a) the harness has no stdout capture (see observability.yaml gaps,
  `needed_assertion: log_capture`), so the absence of a log line is
  unobservable, and (b) the `config:` block below is INERT —
  `Bier.ConformanceServer`'s `@variant_case_ids`
  (test/support/conformance_server.ex:58) lists only 1758, 1763 and 1764 from
  the 1750-1799 band, so this case runs against the shared instance's
  `log_level: :error`, not crit. The `config:` block is retained as a record of
  the upstream configuration the log-line assertion would need. The asserted 200
  is independent of log-level, so the case is sound as written — it is simply
  narrower than its feature name suggests.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L523
