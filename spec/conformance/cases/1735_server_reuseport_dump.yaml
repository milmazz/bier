id: 1735
feature: config/server-reuseport/dump
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_SERVER_REUSEPORT: "true"
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'server-reuseport = true'
notes: >
  NEW in v16.0. `server-reuseport` is a boolean (default false, see case 1705)
  that makes the listening socket bind with SO_REUSEPORT (App.hs#L313). The
  binding itself is not HTTP-observable, so the config surface is what this
  case pins: configs/no-defaults-env.yaml sets PGRST_SERVER_REUSEPORT=true and
  configs/expected/no-defaults.config#L42 dumps it back.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/configs/expected/no-defaults.config#L42
