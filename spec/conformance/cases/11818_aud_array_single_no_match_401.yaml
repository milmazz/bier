id: 11818
feature: auth/audience/array-single-no-match
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "exp": 9999999999, "role": "postgrest_test_author", "id": "jdoe", "aud": ["notyouraudience"] }
schema: auth
config:
  jwt-aud: youraudience
preconditions: []
expect:
  status: 401
  body_exact: { "code": "PGRST303", "details": null, "hint": null, "message": "JWT not in audience" }
notes: >-
  A single-element array `aud` whose only element does NOT match jwt-aud ->
  401 PGRST303. The negative counterpart of 11817 and its own upstream
  it-block, separate from the multi-element no-match pinned by case 1472 — a
  one-element array must not be mistaken for the ignored-empty-array branch.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L88
