id: 10222
feature: operators/fts/auto_tsvector/language/text
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search&text_search=fts(french).amusant
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search": "C'est un peu amusant de faire l'impossible" }
notes: >
  The (language) modifier is consumed TWICE on a non-tsvector column: as the
  to_tsquery config AND as the config of the automatic to_tsvector() wrap on
  the column side. The emitted SQL is
  `to_tsvector('french', text_search) @@ to_tsquery('french', 'amusant')` --
  pgFmtFtsLang is called from pgFmtFilter (SqlFragment.hs#L412) and again from
  pgFmtField (SqlFragment.hs#L248). Modelling only the query side would be
  wrong here: with the default english config the row would not match, because
  'amusant' does not stem to the same lexeme. Mirrors the upstream it-block
  literally titled "finds matches with different dictionaries and uses them as
  configuration for to_tsvector()" (text_search assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L404
