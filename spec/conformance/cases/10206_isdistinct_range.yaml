id: 10206
feature: operators/isdistinct/range
request:
  method: GET
  path: /ranges?range=isdistinct.[1,3]&select=id
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 2 }
    - { "id": 3 }
    - { "id": 4 }
    - { "id": 5 }
notes: >
  isdistinct is not restricted to scalars: `range IS DISTINCT FROM '[1,3]'`
  on numrange. Because it is null-safe, row 5 (range IS NULL) is returned too
  -- which a plain `neq` would drop (compare case 1081, which returns only
  2,3,4). Mirrors AndOrParamsSpec.hs 'can handle range operators' (isdistinct
  assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L150
