id: 1264
feature: pagination/range_header/empty_result
request:
  method: GET
  path: /menagerie_empty
  headers:
    Accept: application/json
    Range-Unit: items
    Range: 0-1
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "*/*"
  body_exact: []
notes: >
  Range over an empty table returns [] with Content-Range '*/*', status 200.
  Mirrors RangeSpec.hs:426, which requests '/menagerie'. That upstream name is
  the pagination fixture's single-column EMPTY table; Bier's consolidated
  fixture kept openapi.sql's 7-column type-mapping table as `test.menagerie`
  and renamed the empty one to `test.menagerie_empty` (fixtures.sql:75-79,
  :719-722), so the path targets `/menagerie_empty`.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L426
