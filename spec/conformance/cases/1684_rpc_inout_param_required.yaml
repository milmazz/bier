id: 1684
feature: openapi/rpc/post-body
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  body_jsonpath:
    - { path: "$.paths['/rpc/single_inout_param'].post.parameters[0].schema.properties.num", equals: { format: "int32", type: "integer" } }
    - { path: "$.paths['/rpc/single_inout_param'].post.parameters[0].schema.required", equals: ["num"] }
notes: >
  An INOUT parameter IS a request argument, so — unlike the pure OUT params of
  case 1683 — it appears in the args body schema and, when it has no DEFAULT,
  in that schema's `required` array. Same one-line rule as 1683 read the other
  way: `required .~ fmap ppName (filter ppReq (pdParams pd))`
  (OpenAPI.hs#L158), with the property typed by makeProcProperty
  (OpenAPI.hs#L160-166).
  The upstream it-block for this is OpenApiSpec.hs#L1032-1038 ("includes INOUT
  params(with no DEFAULT) of function as required parameters"), which asserts
  `["num","str"]` for `test.many_inout_params(INOUT num int, INOUT str text,
  INOUT b bool DEFAULT true)` (test/spec/fixtures/schema.sql#L1265). That
  routine is NOT in the consolidated fixtures, so this case exercises the same
  rule over `test.single_inout_param(INOUT num int)`
  (conformance/fixtures.sql#L1356) and the `source:` is pinned to the source
  line that states the rule rather than to an it-block asserting a different
  function. The DEFAULT half of the upstream assertion (`b` present in
  properties but absent from required) has no fixture and is recorded as a gap
  in openapi.yaml.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L158
