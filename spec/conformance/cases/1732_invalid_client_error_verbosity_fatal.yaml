id: 1732
feature: config/validation/invalid-client-error-verbosity
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_CLIENT_ERROR_VERBOSITY: "invalid"
preconditions: []
expect:
  exit_code: nonzero
  stderr_contains: "Invalid client-error-verbosity. Check your configuration."
notes: >
  NEW in v16.0. Any value other than "minimal"/"verbose" aborts startup
  (Config.hs parseErrorVerbosity, #L335-L341). Mirrors
  test_cli.py:test_invalid_client_error_verbosity.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_cli.py#L283
