id: 1820
feature: domain_representations/write/columns_param_unknown_column
request:
  method: POST
  path: /datarep_todos?columns=id,label_color,helicopters&select=id,name,label_color,due_at
  headers:
    Accept: application/json
    Content-Type: application/json
    Prefer: return=representation
  body_json:
    {
      "due_at": "2019-01-03T11:00:00+00",
      "smth": "here",
      "label_color": "invalid",
      "fake_id": 13,
    }
schema: domain_representations
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    {
      "code": "PGRST204",
      "details": null,
      "hint": null,
      "message":
        "Could not find the 'helicopters' column of 'datarep_todos' in the schema cache",
    }
notes: >
  When ?columns lists a column that does not exist, the request fails with PGRST204
  before any value is parsed — note the body carries an invalid label_color
  ("invalid", which the `json AS color` cast would reject) and it never surfaces,
  proving the columns check happens first and no row is written. Mirrors InsertSpec.hs
  'fails without parsing anything if at least one specified column doesn't exist'.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L845
