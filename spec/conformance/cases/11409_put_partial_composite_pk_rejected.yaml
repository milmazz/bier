id: 11409
feature: mutations/upsert/put/error/partial-composite-pk
request:
  method: PUT
  path: /car_models?name=eq.Supra
  headers: { Content-Type: application/json }
  body: [{ "name": "Supra", "year": 2021 }]
schema: mutations
preconditions: []
expect:
  status: 405
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: { "message": "Filters must include all and only primary key columns with 'eq' operators", "code": "PGRST105", "details": null, "hint": null }
notes: >-
  "all and only" is literal: filtering on a strict subset of a composite primary
  key is rejected with the same PGRST105 envelope as filtering on a non-pk
  column (case 1384). Mirrors UpsertSpec.hs#L332-L342 ("fails if not all
  composite key cols are specified as eq filters"), whose target `employees`
  (pk first_name, last_name) does not exist in the consolidated fixture
  database; `car_models` has the same shape (composite pk name, year) and is
  exposed by the mutations area. Case 11408 shows that supplying BOTH pk
  columns on the same relation succeeds, so the 405 here is attributable to the
  missing pk column and not to the relation lacking a detectable pk.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L333
