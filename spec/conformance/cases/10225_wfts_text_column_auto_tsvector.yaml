id: 10225
feature: operators/wfts/auto_tsvector/text
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search&text_search=wfts.The%20Fat%20Rats
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search": "Fat cats ate rats" }
notes: >
  wfts on a text column: `to_tsvector(text_search) @@
  websearch_to_tsquery('The Fat Rats')`. Mirrors QuerySpec.hs context "text and
  json columns" -> it "finds matches with websearch_to_tsquery" (text_search
  assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L368
