id: 1034
feature: url_grammar/path/relation-not-found
request:
  method: OPTIONS
  path: /unknown
  headers: {}
schema: test
preconditions: []
expect:
  status: 404
notes: >-
  Path resolution accepts any single segment as a `ResourceRelation`
  (src/library/PostgREST/ApiRequest.hs#L126), so an unknown table is a *grammar*
  success that only fails when the info response looks the relation up in the
  schema cache: the `HM.lookup qi dbTables` miss returns
  `SchemaCacheErr (TableNotFound ...)`, a 404
  (src/library/PostgREST/Response.hs#L210-L213). This is the OPTIONS dual of
  case 1024 (a GET for a table outside the active schema). Mirrors the upstream
  it-block "fails with 404 for an unknown table" (OptionsSpec.hs#L21 the it,
  L22 the `request methodOptions "/unknown" [] "" \`shouldRespondWith\` 404`).
  Upstream asserts only the status, so no body/header assertion is transcribed
  here.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OptionsSpec.hs#L22
