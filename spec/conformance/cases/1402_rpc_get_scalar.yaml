id: 1402
feature: rpc/return/scalar-get
request:
  method: GET
  path: /rpc/add_them?a=3&b=4
  headers: { Accept: application/json }
schema: rpc
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: 7
notes: >
  Scalar-returning function responds with the bare JSON scalar (not
  array-wrapped); named args from query string.
  Anchor caveat: RpcSpec.hs#L101-L104 is the it-block "includes exact count of 1
  for functions that return a single scalar, domain or composite", whose request
  carries `[("Prefer", "count=exact")]`. It is the only `GET /rpc/add_them` in
  RpcSpec.hs, and its assertion at #L104 proves `?a=3&b=4` -> `7` with status
  200 — but this case sends no Prefer header, so the Prefer-less request shape is
  not itself asserted upstream. The `count=exact` leg of that same it-block IS
  asserted verbatim, by case 1403 (Content-Range 0-0/1).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L102
