id: 1192
feature: filters/embed/inner
request:
  method: GET
  path: /entities?select=id,child_entities!inner(id,grandchild_entities!inner(id))&child_entities.grandchild_entities.id=in.(1,5)
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - id: 1
      child_entities:
        - { "id": 1, "grandchild_entities": [{ "id": 1 }] }
        - { "id": 2, "grandchild_entities": [{ "id": 5 }] }
notes: >
  A filter two levels below the source table propagates all the way up when
  every embedding on the path is `!inner`: grandchild rows are filtered,
  child rows without a surviving grandchild are dropped, and parent rows
  without a surviving child are dropped in turn. Mirrors EmbedInnerJoinSpec
  "filters source tables when a two levels below embedded table is filtered"
  (v16.0 L146-L157, the in.(1,5) branch) verbatim, request and body.

  Fixture check against the consolidated bier_test: grandchild 1 hangs off
  child_entity 1 and grandchild 5 off child_entity 2, and both those children
  belong to entity 1, so entity 1 is the only survivor. Entity 2's children
  (3 and 6) own no grandchild at all, and entities 3/4 own no children.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedInnerJoinSpec.hs#L146
