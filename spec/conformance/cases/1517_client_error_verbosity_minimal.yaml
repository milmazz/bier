id: 1517
feature: errors/verbosity/minimal
request:
  method: GET
  path: /itemsx
  headers: { Accept: application/json }
schema: test
config:
  client-error-verbosity: minimal
preconditions: []
expect:
  status: 404
  body_exact:
    code: "PGRST205"
    message: "Could not find the table 'test.itemsx' in the schema cache"
notes: >
  NEW in v16.0. The `client-error-verbosity` config selects the error envelope
  shape. With the default `verbose` the body is {code, message, details, hint}
  (see cases 1515/1516); with `minimal` only {code, message} are emitted — the
  details and hint keys are OMITTED entirely, not set to null
  (toJsonPgrstError's Minimal branch, Error.hs:75-78). The status is unchanged.
  Mirrors ErrorSpec.hs "hides details and hint when set to 'minimal'", which
  runs GET /itemsx under `configClientErrorVerbosity = Minimal` and expects
  exactly this two-key body with status 404. `test.itemsx` does not exist in
  the conformance database (verified against a freshly loaded bier_test), so
  the request resolves to the PGRST205 TableNotFound error.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ErrorSpec.hs#L230
