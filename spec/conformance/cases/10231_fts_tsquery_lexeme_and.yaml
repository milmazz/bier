id: 10231
feature: operators/fts/tsquery_operators/and
request:
  method: GET
  path: /tsearch?text_search_vector=fts.fun%26possible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'also':2 'fun':3 'possibl':8" }
notes: >
  PostgREST parses no tsquery syntax of its own: the fts operand is emitted as
  a bare `unknownLiteral` and handed to to_tsquery verbatim
  (SqlFragment.hs#L412), so the lexeme AND operator `&` (percent-encoded %26
  so it is not read as a query-parameter separator) reaches Postgres intact:
  `text_search_vector @@ to_tsquery('fun&possible')`. Mirrors QuerySpec.hs
  it "can use lexeme boolean operators(&=%26, |=%7C, !) in to_tsquery"
  (first assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L190
