id: 1033
feature: url_grammar/method/options-root
request:
  method: OPTIONS
  path: /
  headers: {}
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Allow: OPTIONS,GET,HEAD
notes: >-
  OPTIONS on the root path resolves the empty `pathInfo` to `ResourceSchema`
  (src/library/PostgREST/ApiRequest.hs#L124) and then to `ActSchemaInfo`
  (#L149), whose info response carries the fixed `Allow` header
  "OPTIONS,GET,HEAD" — the root serves metadata only, so no mutating method is
  advertised (src/library/PostgREST/Response.hs#L228). Mirrors the upstream
  it-block "includes the GET/HEAD method " (OptionsSpec.hs#L102 the it, L103 the
  `request methodOptions "/"`, L106 the matchHeader "Allow" "OPTIONS,GET,HEAD").
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OptionsSpec.hs#L103
