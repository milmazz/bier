id: 10213
feature: operators/neq/array
request:
  method: GET
  path: /entities?arr=neq.{1,2}&select=id
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1 }
    - { "id": 3 }
notes: >
  `arr <> '{1,2}'` on integer[]. Entity 4 (arr IS NULL) is NOT returned --
  `<>` is null-propagating, which is exactly the difference from isdistinct
  (case 10207 returns 1, 3 and 4). Mirrors AndOrParamsSpec.hs 'can handle
  array operators' (neq assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L156
