id: 1600
feature: content_negotiation/json/default
request:
  method: GET
  path: /items?id=eq.1
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1 }
notes: >-
  application/json is the default producer; the Content-Type carries
  charset=utf-8. The anchored it-block is the one this case's request, body and
  Content-Type are taken from: RawOutputTypesSpec 'responds json to a GET
  request with Firefox Accept headers' asserts exactly
  `GET /items?id=eq.1` -> `[{"id":1}]` with
  `Content-Type: application/json; charset=utf-8`. It reaches that response via
  a browser Accept header (the `*/*` arm, which is case 1601); this case sends
  the explicit `Accept: application/json` instead. Upstream has no it-block that
  sends a bare `Accept: application/json` to an ordinary table -- swept across
  test/spec/ at v16.0, the only three `acceptHdrs "application/json"` uses are
  CustomMediaSpec#L179 (the OVERRIDDEN /ov_json handler, case 1637),
  RpcSpec#L604 (a malformed-payload POST /rpc/sayhello asserting 400) and
  SpecHelper#L121 (the OpenAPI schema-validation helper) -- so the
  explicit-Accept half is cited at the
  source level instead: application/json has a built-in handler
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1019)
  and MTApplicationJSON renders as `application/json` + charset
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L69).
  The previous revision cited only the MediaType.hs line, which establishes the
  Content-Type but says nothing about the asserted path or body.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RawOutputTypesSpec.hs#L15
