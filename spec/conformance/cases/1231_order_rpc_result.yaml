id: 1231
feature: ordering/rpc/result
request:
  method: GET
  path: /rpc/getitemrange?order=id&min=0&max=15
  headers: { Accept: application/json }
schema: ordering
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-14/*"
  body_exact:
    - { "id": 1 }
    - { "id": 2 }
    - { "id": 3 }
    - { "id": 4 }
    - { "id": 5 }
    - { "id": 6 }
    - { "id": 7 }
    - { "id": 8 }
    - { "id": 9 }
    - { "id": 10 }
    - { "id": 11 }
    - { "id": 12 }
    - { "id": 13 }
    - { "id": 14 }
    - { "id": 15 }
notes: >
  `order` applies to a function's result set, not only to a table/view read:
  `/rpc/<fn>?order=<col>` is accepted on the RPC surface and orders the returned
  rows. Mirrors RangeSpec.hs:30 ("returns range Content-Range with range/*")
  byte-for-byte — same path, same expected document, same `Content-Range`
  header. The v16 docs state the same surface: `references/api/functions.rst`
  L290 ("A function that follows the rules for inlining will also inline
  filters, order and limits") and the L283 example
  `/rpc/best_films_2017?rating=gt.8&order=title.desc`.

  Fixture: `ordering.getitemrange(min,max)` is the ordering schema's mirror of
  `test.getitemrange`, `RETURNS SETOF ordering.items`; `items` has ids 1..15 in
  the consolidated fixture DB, so the (0,15) window is the whole table and the
  count-less window is `0-14/*`.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L30
