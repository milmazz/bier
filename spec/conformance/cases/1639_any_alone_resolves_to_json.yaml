id: 1639
feature: content_negotiation/json/any-alone
request:
  method: GET
  path: /simple_pk
  headers: { Accept: "*/*" }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
notes: >-
  A bare Accept of */* on an API endpoint resolves to the default
  application/json handler (200). Mirrors QuerySpec 'should respond correctly to
  */* in accept header'; the documented rule is resource_representation.rst
  "*/*, resolves to application/json for API endpoints and to
  application/openapi+json for the root endpoint". Contrast case 1645, which is
  the same Accept on the root path.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1203
