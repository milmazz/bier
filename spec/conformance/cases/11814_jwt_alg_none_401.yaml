id: 11814
feature: auth/jwt/algorithm-none
request:
  method: GET
  path: /authors_only
  headers:
    Accept: application/json
    Authorization: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0.e30.yOBhlOIqn56T-4NvyEXCjfi3UmyQZ-BzXtePMO2NgRI"
schema: auth
preconditions: []
expect:
  status: 401
  body_exact:
    {
      "code": "PGRST301",
      "details": "JWT is unsecured but expected 'alg' was not 'none'",
      "hint": null,
      "message": "Wrong or unsupported encoding algorithm",
    }
notes: >-
  New in v16.0 as a black-box assertion (v14.12 had it only in
  test/io/test_auth.py::test_jwt_errors). This is the "alg: none" downgrade
  attack: header `{"typ":"JWT","alg":"none"}`, payload `{}`, plus a bogus
  signature. jose rejects it with `BadAlgorithm`, mapped to
  `JwtDecodeErr (BadAlgorithm m)` (Auth/Jwt.hs#L105) -> PGRST301 "Wrong or
  unsupported encoding algorithm", with jose's explanation surfaced verbatim in
  `details` (Error.hs#L678). An unsigned token must never authenticate, so a
  200 here would be a security bug, not a conformance nit.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ErrorSpec.hs#L215
