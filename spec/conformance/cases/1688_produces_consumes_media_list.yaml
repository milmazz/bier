id: 1688
feature: openapi/root/media-list
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  body_jsonpath:
    - { path: "$.produces", equals: ["application/json", "application/vnd.pgrst.object+json;nulls=stripped", "application/vnd.pgrst.object+json", "text/csv"] }
    - { path: "$.consumes", equals: ["application/json", "application/vnd.pgrst.object+json;nulls=stripped", "application/vnd.pgrst.object+json", "text/csv"] }
notes: >
  The document-level `produces` and `consumes` are the same four-element list,
  in this order: `makeMimeList [MTApplicationJSON, MTVndSingularJSON True,
  MTVndSingularJSON False, MTTextCSV]` for both (OpenAPI.hs#L405 and #L406).
  The two singular-JSON entries render as
  "application/vnd.pgrst.object+json;nulls=stripped" (the True/stripped one
  first) and "application/vnd.pgrst.object+json" (MediaType.hs toMime). The
  list is static: it does not vary with the schema, the role, or which media
  handlers the database defines.
  Ordering is load-bearing and is asserted as such — `equals` on the whole
  array rather than four membership checks — because the list is produced by a
  literal Haskell list in source order. No upstream Feature it-block reads
  either key (they are only exercised through the whole-document schema
  validation of SpecHelper.hs#L115-123), which is why openapi.yaml previously
  recorded this as "not individually asserted by a Feature test"; that gap is
  closed by tracing to the generator lines instead of guessing.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L405
