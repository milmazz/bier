id: 1145
feature: select/array/item-arrow
request:
  method: GET
  path: /arrays?select=a:numbers->0,b:numbers->1,c:numbers_mult->0->0,d:numbers_mult->1->2
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"a":1,"b":2,"c":1,"d":6}
    - {"a":11,"b":12,"c":11,"d":16}
notes: >
  "obtains an array item" (JsonOperatorSpec.hs:158, first request). Distinct
  from case 1110 (select.json_array_index), which indexes into a *json* column:
  here `numbers` is int[] and `numbers_mult` is int[][], so PostgREST wraps the
  column as `to_jsonb(numbers)->0` before applying the path
  (SqlFragment.pgFmtField cfToJson branch), and a 2-D array is addressed by
  chaining arrows (`numbers_mult->0->0`). Seed rows are upstream's verbatim
  (fixtures.sql: id 0 = {1,2,3} / {{1,2,3},{4,5,6},{7,8,9}}, id 1 = {11,12,13} /
  {{11,12,13},{14,15,16},{17,18,19}}); verified live against bier_test. Upstream
  sends no `order=` and no case mutates test.arrays, so physical order (0 then
  1) is stable.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L158
