id: 10204
feature: operators/in/empty_set
request:
  method: GET
  path: /items_with_different_col_types?int_data=in.(    )
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: []
notes: >
  A list of only whitespace is still the empty list: pListVal brackets the
  elements with `lexeme (char '(')` / `lexeme (char ')')` and lexeme is
  `ws *> p <* ws`, so the surrounding spaces are consumed and the single
  element parses as "", hitting the same `= ANY('{}')` branch as `in.()`.
  Mirrors QuerySpec.hs "returns an empty result ignoring spaces".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1391
