id: 11811
feature: auth/claims/nbf-future
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "nbf": 9999999999 }
schema: auth
preconditions: []
expect:
  status: 401
  body_exact:
    {
      "code": "PGRST303",
      "details": null,
      "hint": null,
      "message": "JWT not yet valid",
    }
notes: >-
  New in v16.0 as a black-box assertion (v14.12 had it only in
  test/io/test_auth.py::test_jwt_errors). A numeric `nbf` in the future fails
  the `inTheFuture` check -- `now + 30 < nbf` -- and yields PGRST303
  "JWT not yet valid" (Auth/Jwt.hs#L59, #L64, #L69). Upstream uses
  `relativeSeconds 35`, i.e. exactly 5s past the 30s clock-skew allowance; the
  case shape has no relative-time primitive, so a fixed far-future value
  (9999999999, the same sentinel upstream uses for "unexpired") is used
  instead. That pins the error but not the skew boundary -- see the
  `needed_assertion: relative-time claim values` gap in spec/auth.yaml.
  Mirroring upstream, the payload carries no `role`: claim validation runs
  before role extraction (Auth/Jwt.hs#L112), so the anon fallback is never
  reached.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ErrorSpec.hs#L148
