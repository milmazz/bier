id: 1466
feature: auth/jwt/binary-secret-hs256
request:
  method: GET
  path: /authors_only
  headers:
    Accept: application/json
    Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjk5OTk5OTk5OTksInJvbGUiOiJwb3N0Z3Jlc3RfdGVzdF9hdXRob3IiLCJpZCI6Impkb2UifQ.Dpss-QoLYjec5OTsOaAc3FNVsSjA89wACoV-0ra3ClA"
schema: auth
preconditions: []
config:
  jwt-secret: "cmVhbGx5cmVhbGx5cmVhbGx5cmVhbGx5dmVyeXNhZmU="
  jwt-secret-is-base64: true
notes: >-
  Server started with a binary (base64-encoded) HS256 secret verifies the token.
  Upstream sets `configJwtSecret = Just generateSecret` (BinaryJwtSecretSpec.hs#L15)
  where `generateSecret = B64.decodeLenient "cmVhbGx5cmVhbGx5cmVhbGx5cmVhbGx5dmVyeXNhZmU="`
  (SpecHelper.hs#L224) — i.e. the 32 raw bytes `reallyreallyreallyreallyverysafe`,
  which is the HMAC key the pinned token is signed with. Reproducing that through
  the config surface needs BOTH keys: `jwt-secret-is-base64: true` base64-decodes
  whatever `jwt-secret` holds (Config.hs#L526), so the flag alone would decode the
  ambient plain secret into 24 bytes of garbage — under the 32-byte minimum at
  Config.hs#L557 and not the signing key either.
expect:
  status: 200
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/BinaryJwtSecretSpec.hs#L21
