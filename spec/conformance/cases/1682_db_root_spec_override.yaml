id: 1682
feature: openapi/root/db-root-spec
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
config:
  db-root-spec: root
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    swagger: "2.0"
    info:
      title: "Overridden"
      description: "This is a my own API"
notes: >
  With db-root-spec set, GET / no longer emits the generated Swagger document:
  getResource maps the empty path to `ResourceRoutine (qiName qi)` whenever
  configDbRootSpec is `Just qi` (ApiRequest.hs#L119-124), so the root goes
  through the ordinary routine path and returns the function's value verbatim,
  with the ordinary routine content negotiation — hence `application/json;
  charset=utf-8` here rather than the application/openapi+json of case 1651.
  SOURCE SPLIT, corrected this pass. This case asserts two things and they do
  NOT share an anchor:
  * status 200 + `Content-Type: application/json; charset=utf-8` come from
    RootSpec.hs, which runs under `baseCfg { configDbRootSpec = Just $
    QualifiedIdentifier mempty "root" }`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/RootSpec.hs#L16)
    and whose `accepts application/json` it-block asserts
    `Content-Type <:> "application/json; charset=utf-8"`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/RootSpec.hs#L27
    , header matcher at #L34).
  * the `body_exact` comes from the DOCS, and it CONTRADICTS RootSpec: that
    it-block asserts the body
    {"swagger":"2.0","info":{"title":"PostgREST API","description":"This is a
    dynamic API generated by PostgREST"}} (RootSpec.hs#L30-33), because
    upstream's root() returns the default document
    (test/spec/fixtures/schema.sql#L1867-1881). The "Overridden" body asserted
    here is the DOCUMENTED example, which conformance/fixtures.sql#L1621
    transcribes verbatim: `create or replace function root() returns json`
    returning {"swagger":"2.0","info":{"title":"Overridden","description":"This
    is a my own API"}}, with the `curl http://localhost:3000` response printed
    at docs/references/api/openapi.rst#L71-101. `source:` is therefore the
    docs anchor, which supports the assertion the case actually makes; the
    RootSpec anchors above stay as the supporting citation for the status and
    Content-Type half. Previously `source:` was RootSpec.hs#L27 alone, which a
    machine re-audit reads as claiming a body this case does not expect.
  CORRECTED this pass: the request used to send `Accept:
  application/openapi+json`, which is unreachable against this fixture. A
  routine only serves a media type it has a handler for, and the built-in
  handler set is exactly {*/*, application/json, text/csv, application/geo+json}
  (SchemaCache.hs#L1016-1022); application/openapi+json is registered only by a
  routine whose RETURN TYPE is the mime-named domain, which is how upstream's
  root() (`returns "application/openapi+json"`) gets one and how the fixtures.sql
  root() (`RETURNS json`) does not. A faithful implementation would answer 406
  /PGRST107 there. Same failure shape as the unnamed_bytea_param fixture defect
  recorded in content_negotiation.yaml: every mechanical check stayed green.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/openapi.rst#L71
