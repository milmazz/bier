id: 1644
feature: content_negotiation/custom-media-handler/table-aggregate
request:
  method: GET
  path: /projects?id=in.(1,2)
  headers: { Accept: text/tab-separated-values }
schema: test
preconditions:
  - "Requires the DOMAIN \"text/tab-separated-values\" and the aggregate test.tsv_agg(test.projects) (content_negotiation.delta.sql)."
expect:
  status: 200
  headers:
    Content-Type: text/tab-separated-values
    Content-Length: "47"
  body_raw: "id\tname\tclient_id\n1\tWindows 7\t1\n2\tWindows 10\t1\n"
notes: >-
  A custom media type registered for ONE relation: an aggregate over the
  test.projects row type whose stype is the DOMAIN
  "text/tab-separated-values". negotiateContent finds it via
  lookupHandler's (RelId identifier, mt) lookup (Plan/Negotiate.hs#L77) and the
  response body is the aggregate's output verbatim. Because
  text/tab-separated-values is not one of the media types decodeMediaType knows,
  it decodes to MTOther and toContentType appends NO charset
  (MediaType.hs#L62-L64) - contrast the builtin text/csv of case 1606, which is
  "text/csv; charset=utf-8". Mirrors CustomMediaSpec 'will match a custom
  text/tab-separated-values' (upstream regression for issue #1102); the upstream
  fixture aggregate is test/spec/fixtures/schema.sql#L3535-L3553 and the local
  equivalent lives in fixtures/content_negotiation.delta.sql.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L229
