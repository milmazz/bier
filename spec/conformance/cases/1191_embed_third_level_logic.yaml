id: 1191
feature: filters/embed/third_level
request:
  method: GET
  path: /entities?child_entities.grandchild_entities.or=(id.eq.1,id.eq.2)&select=id,child_entities(id,grandchild_entities(id))
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - id: 1
      child_entities:
        - { "id": 1, "grandchild_entities": [{ "id": 1 }, { "id": 2 }] }
        - { "id": 2, "grandchild_entities": [] }
        - { "id": 4, "grandchild_entities": [] }
        - { "id": 5, "grandchild_entities": [] }
    - id: 2
      child_entities:
        - { "id": 3, "grandchild_entities": [] }
        - { "id": 6, "grandchild_entities": [] }
    - { "id": 3, "child_entities": [] }
    - { "id": 4, "child_entities": [] }
notes: >
  An embedded-filter path may be more than one segment deep: `pLogicPath`
  splits the key on `.` and treats every segment but the last as the embed
  path, so `child_entities.grandchild_entities.or=(...)` applies the logic
  tree to the THIRD level of the read plan. All three levels use the default
  left join, so parents and intermediate rows are kept with an empty array
  when nothing below them matches. Mirrors AndOrParamsSpec "can do logic on
  the third level" (v16.0 L34-L50) verbatim, request and body.

  Fixture check against the consolidated bier_test (identical to upstream
  data.sql L362-L375): child_entities parent_ids are 1,1,2,1,1,2 so entity 1
  owns children 1,2,4,5 and entity 2 owns 3,6; grandchild_entities parent_ids
  are 1,1,2,2,2 so only child_entity 1 owns grandchildren 1 and 2, which are
  exactly the two the or-group selects. Every other embed collapses to [].
  A previous revision of spec/filters.yaml recorded this it-block as
  unreconcilable with the fixture data; that was a misreading of the expected
  body (the 1,2,4,5 / 3,6 split is the CHILD distribution, not the
  grandchild one) and the gap is retired by this case.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L34
