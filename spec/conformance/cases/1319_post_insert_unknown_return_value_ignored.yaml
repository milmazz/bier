id: 1319
feature: representations/prefer/unknown-return-value-ignored
request:
  method: POST
  path: /complex_items
  headers:
    Prefer: "return=bogus"
    Content-Type: application/json
  body: { "id": 203, "name": "Doscientos Tres" }
schema: representations
preconditions: []
expect:
  status: 201
  headers:
    Content-Range: "*/*"
    Content-Length: "0"
  headers_absent: [Content-Type, Location, Preference-Applied]
  body_exact: ""
notes: >-
  An unrecognized `return=` value is silently ignored, NOT rejected: the request
  behaves exactly like one with no return token at all (case 1303/1308) — 201,
  empty body, no Content-Type, Content-Length 0, and no Preference-Applied
  header whatsoever. Two independent mechanisms produce that. (1) prefMap is
  keyed by exactly the three canonical tokens
  (Preferences.hs#L169-L170 over #L219-L222), so `parsePrefs [Full, None,
  HeadersOnly]` finds no match and preferRepresentation is Nothing
  (Preferences.hs#L133); the dispatch then takes the Nothing branch
  (Response.hs#L114) and prefAppliedHeader returns Nothing for the empty
  prefsVals list (Preferences.hs#L174-L175) — invalidPrefs are never echoed, the
  collection at #L179-L188 does not include them. (2) The token IS recorded in
  invalidPrefs (`filter isUnacceptable prefs`, Preferences.hs#L140-L163, since
  "return=bogus" is not in acceptedPrefs #L145-L150), but the 400 PGRST122
  "Invalid preferences given with handling=strict" is raised only when
  `preferHandling == Just Strict` (Plan.hs#L207 for the mutate path, #L199 for
  reads, #L231 for RPC) — with no handling token the guard is false and the
  request succeeds. Upstream pins the same lenient-by-default treatment for a
  bare invalid pref at
  test/spec/Feature/Query/Preferences/HandlingSpec.hs#L44-L46
  (handling=lenient + "anything" => 200) against the strict variant at #L15-L19
  of that same file. NOTE the path: at v16.0 HandlingSpec.hs lives under
  test/spec/Feature/Query/Preferences/, NOT beside InsertSpec.hs /
  UpdateSpec.hs in test/spec/Feature/Query/, so the bare basename does not
  resolve the way the other specs cited here do — full URL:
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/HandlingSpec.hs#L44
  Grepping v16.0's test/spec
  finds no it-block sending a malformed `return=` value specifically, so the
  return-token specialization is DERIVED FROM SOURCE.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L207
