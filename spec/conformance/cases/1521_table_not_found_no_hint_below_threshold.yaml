id: 1521
feature: errors/pgrst_code/table_not_found_no_hint
request:
  method: GET
  path: /projxxxx
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 404
  headers:
    Proxy-Status: "PostgREST; error=PGRST205"
    Content-Length: "119"
  body_exact:
    code: "PGRST205"
    message: "Could not find the table 'test.projxxxx' in the schema cache"
    details: null
    hint: null
notes: >
  The negative half of case 1520: when no table in the schema clears the 0.75
  similarity threshold, `getFuzzyHint` returns Nothing and the envelope's `hint`
  is null (Error.hs:398-402). "projxxxx" differs from "projects" in four of
  eight characters (0.5), so no suggestion is made even though the same schema
  produces one for "projectx". Mirrors ErrorSpec.hs "don't show hint when
  similarity score is less than 75%" (L97), which asserts this exact body and
  Content-Length 119 (L100-L103). Upstream exposes the same `test` schema, so
  the body is byte-identical; verified against a freshly loaded bier_test,
  where neither `test.projxxxx` nor any name within the threshold exists.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ErrorSpec.hs#L97
