id: 1028
feature: url_grammar/reserved-params/legacy-embed-target-name
request:
  method: GET
  path: /projects?id=eq.1&select=id,name,the_tasks:tasks(id,name)&tasks.name=like.Code*&tasks.order=name.asc&tasks.limit=1
  headers: { Accept: application/json }
schema: ordering
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_match:
    Warning: '^299 \S+ "Embedded resource was referenced by relation name even though it has an alias\. This is deprecated and will stop working in a future release\. Update `tasks` to `the_tasks` in query string filters, orders or limits\."$'
  body_exact:
    - id: 1
      name: "Windows 7"
      the_tasks:
        - { id: 2, name: "Code w7" }
notes: >
  NEW IN v16.0. A reserved-embeddable / filter query-param key may carry a
  dot-separated embed-path prefix. When the embed is aliased in select
  (the_tasks:tasks(...)), referring to it by the underlying relation name
  (tasks.name / tasks.order / tasks.limit) is deprecated: with the default
  url-use-legacy-target-names = true the request still succeeds AND the
  response carries a Warning header. Mirrors QuerySpec "filters, orders and
  limits aliased embeded entities using the target name" (it at L1183, get at
  L1185, expected body at L1186, Warning matcher at L1187). The header value's
  product token is PostgREST's own version string
  ("PostgRESTv" <> prettyVersion with spaces stripped, App.hs#L268), so the
  assertion is a regex whose token is \S+ — an implementation must emit its own
  product token there; everything after it is byte-exact. The 400 PGRST108
  counterpart (url-use-legacy-target-names = false, QuerySpec.hs#L1709-L1720)
  needs a per-case config override the frozen harness only honors for its
  hardcoded variant-case ids, so it is recorded as a gap instead of a case.
  Body verified against a freshly loaded bier_test: ordering.projects id 1 =
  "Windows 7"; ordering.tasks for project 1 = (1,'Design w7'),(2,'Code w7'), so
  name=like.Code* + order=name.asc + limit=1 selects exactly (2,'Code w7').
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1183
