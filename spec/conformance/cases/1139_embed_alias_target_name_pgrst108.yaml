id: 1139
feature: select/embed/alias/target-name-disallowed-error
request:
  method: GET
  path: "/projects?id=eq.1&select=id,name,the_tasks:tasks(id,name)&tasks.name=like.Code*&tasks.order=name.asc&tasks.limit=1"
  headers: { Accept: application/json }
schema: test
preconditions: []
config:
  url-use-legacy-target-names: false
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: PGRST108
    message: "'tasks' is not an embedded resource in this request"
    details: "Target names are not allowed in filters if they have an alias"
    hint: "Change 'tasks' to 'the_tasks' in filters, orders or limits."
notes: >
  New in v16.0. With `url-use-legacy-target-names = false`, an embed that has an
  alias can ONLY be addressed by that alias in filters/orders/limits; using the
  relation name is a 400 PGRST108 whose `details`/`hint` name the replacement
  (QuerySpec.hs:1709, inside `specLegacyTargetNames`, which runs the suite with
  `configUrlUseLegacyTargetNames = False`). The PGRST108 envelope gained the
  `details` field and the alias-specific `hint` in v16.0 (Error.hs L214/L220);
  the plain "not embedded" form keeps `details: null` and the "Verify that ... is
  included in the 'select' query parameter." hint.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1709
