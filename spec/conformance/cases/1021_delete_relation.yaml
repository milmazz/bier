id: 1021
feature: url_grammar/method/delete-relation
request:
  method: DELETE
  path: /%D9%85%D9%88%D8%A7%D8%B1%D8%AF
  headers:
    Prefer: tx=commit
schema: unicode
preconditions:
  - 'INSERT INTO "تست"."موارد" ("هویت") VALUES (1);'
expect:
  status: 204
  headers_absent:
    - Content-Type
notes: "DELETE on a relation resolves to ActRelationMut MutationDelete; valid (unlike DELETE on /rpc). The exposed schema تست is set inline in v16.0 at UnicodeSpec.hs#L15 (configDbSchemas = fromList [\"تست\"]) and created at fixtures/schema.sql#L10. Mirrors UnicodeSpec delete, percent-encoded unicode path; the cited block asserts 204 and matchHeaderAbsent hContentType (L37-L38)."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UnicodeSpec.hs#L32
