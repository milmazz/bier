id: 1016
feature: url_grammar/reserved-params/put-limit-forbidden
request:
  method: PUT
  path: /tiobe_pls?name=eq.Javascript&limit=1
  headers:
    Content-Type: application/json
    Accept: application/json
  body: [{ "name": "Javascript", "rank": 1 }]
schema: test
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: PGRST114
    details: null
    hint: null
    message: limit/offset querystring parameters are not allowed for PUT
notes: >-
  A `limit` query param on PUT is rejected before any DB work
  (PutLimitNotAllowedError, PGRST114, 400): `getRanges` fails as soon as the
  method is PUT and the folded top-level range is not `allRange`
  (src/library/PostgREST/ApiRequest.hs#L178); status 400 at Error.hs#L111, code
  PGRST114 at Error.hs#L158, message at Error.hs#L185. Transcribed from the
  upstream it-block "fails if limit is specified" (UpsertSpec.hs#L295: the it,
  L296 the `put "/tiobe_pls?name=eq.Javascript&limit=1"`, L297 the body, L299
  the exact error envelope, L300 matchStatus 400 + matchContentTypeJson).
  Correction over the previous v16.0 draft of this case, which asserted against
  /parents and claimed "no dedicated Feature spec line in v16.0" — false: the
  UpsertSpec block exists in both v14.12 and v16.0. Upstream's `put` helper
  sends no Content-Type (PostgREST defaults to application/json,
  ApiRequest.hs#L107); the header is spelled out here for the harness.
  test.tiobe_pls is seeded Java/C/Python in the consolidated fixture, and
  "Javascript" is absent — irrelevant, since the request never reaches the
  database.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L295
