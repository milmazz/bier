id: 1313
feature: representations/patch/return-minimal
request:
  method: PATCH
  path: /items?id=eq.1&select=id
  headers:
    Prefer: "return=minimal"
    Content-Type: application/json
  body: { "id": 1 }
schema: representations
preconditions: []
expect:
  status: 204
  headers:
    Content-Range: "0-0/*"
    Preference-Applied: "return=minimal"
  headers_absent: [Content-Type, Content-Length]
  body_exact: ""
notes: >-
  PATCH with an explicit return=minimal yields 204 with an empty body, no
  Content-Type and no Content-Length, but still carries Content-Range
  (0-0/* for the single matched row) and echoes
  Preference-Applied: return=minimal. The ?select=id is ignored because no body
  is returned. Directly mirrors the upstream it-block
  "ignores ?select= when return not set or return=minimal"
  (UpdateSpec.hs#L208-L219), which issues the same PATCH /items?id=eq.1&select=id
  with Prefer: return=minimal. Mechanically this is the `Just None` arm of the
  MutationUpdate dispatch (Response.hs#L134), whose header list is
  [contentRangeHeader, prefHeader] only (Response.hs#L128).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L208
