id: 1714
feature: config/validation/socket-mode-not-octal
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_SERVER_UNIX_SOCKET_MODE: "800"
preconditions: []
expect:
  exit_code: nonzero
  stderr_contains: "Invalid server-unix-socket-mode: not an octal"
notes: "server-unix-socket-mode '800' is not a valid octal -> fatal. In v16.0 the message is built from the key name (Config.hs#L380), so the text is unchanged for this key. Mirrors cli fixture 'invalid server-unix-socket-mode not octal'."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L29
