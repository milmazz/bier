id: 10203
feature: operators/not/in/empty_set
request:
  method: GET
  path: /items_with_different_col_types?int_data=not.in.()&select=int_data
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "int_data": 1 }
notes: >
  `not.in.()` is `NOT (int_data = ANY('{}'))`, which is TRUE for EVERY row,
  rows with int_data IS NULL included: `= ANY` over a zero-element array is an
  empty OR, i.e. FALSE regardless of the left operand (the "NULL left operand
  yields NULL" rule only applies to non-empty arrays), so the negation is TRUE
  unconditionally. An implementation must NOT add a `col IS NOT NULL` guard.
  The whole table is therefore returned; this fixture happens to hold a single
  row (int_data = 1), so the body alone does not discriminate the two readings.
  The empty-list emission `[""] -> "= ANY('{}') "` is
  SqlFragment.hs#L409. Mirrors QuerySpec.hs "returns all results for not.in
  when no value is present".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1387
