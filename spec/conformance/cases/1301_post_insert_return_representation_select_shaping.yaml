id: 1301
feature: representations/post/return-representation-select-shaping
request:
  method: POST
  path: /projects?select=name,client_id
  headers:
    Prefer: "return=representation"
    Content-Type: application/json
  body: { "id": 10, "name": "New Project", "client_id": 2 }
schema: representations
preconditions: []
expect:
  status: 201
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "*/*"
    Preference-Applied: "return=representation"
  headers_absent: [Location]
  body_exact: [{ "name": "New Project", "client_id": 2 }]
notes: >-
  return=representation honors &select (the body carries only name/client_id)
  and carries no Location header. The Location omission is NOT caused by the
  &select list: the SQL builder emits a location expression only when the
  requested representation is exactly HeadersOnly (Statements.hs#L45-L52), so
  return=representation never produces one regardless of the selected columns.
  Mirrors InsertSpec.hs:116.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L116
