id: 1432
feature: rpc/error/unknown-proc
request:
  method: GET
  path: /rpc/fake
  headers: { Accept: application/json }
schema: rpc
preconditions: []
expect:
  status: 404
notes: >
  Unknown proc name returns 404. The probe name is `fake`, taken verbatim from
  the upstream "should fail with 404 on unknown proc name" test, which asserts a
  bare 404 (`get "/rpc/fake" shouldRespondWith 404`) with NO body — so this case
  asserts status only. The closest-proc hint behavior (a non-null PGRST202 body)
  is a distinct feature exercised by the neighboring `sayhell` test (L211-L221)
  and is covered by its own case, **1443**. It is deliberately NOT asserted here:
  `fake` and `sayhell` are two different probes precisely because the hint is
  emitted only when some proc clears `getFuzzyHint`'s 0.75 minimum similarity
  score (Error.hs#L397-L403), so upstream pins a bare status for the first and a
  full envelope for the second. 1443 also carries `schema: test` (the profile
  qualifies the message text); this case's `schema: rpc` is immaterial because
  no body is asserted.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L209
