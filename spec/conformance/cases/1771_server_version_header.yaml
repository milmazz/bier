id: 1771
feature: observability/server/version-header
request:
  method: HEAD
  path: /
  headers: {}
schema: observability
preconditions: []
expect:
  status: 200
  headers_present: [Server]
  headers_match:
    Server: "^postgrest/.+"
  body_exact: null
notes: >
  PostgREST sets the `Server` response header once, as a Warp server setting:
  `setServerName ("postgrest/" <> prettyVersion)` (App.hs:143). It is therefore
  unconditional — no config key gates it, and it rides on every response
  regardless of method, status or content type — which is what the docs page for
  this area states ("returned on every request",
  docs/references/observability.rst:283-286, §"Server Version Header").

  The request shape mirrors the upstream assertion at test_io.py:1065, which
  issues `HEAD /` and reads `response.headers["Server"]`. Only the
  `postgrest/` PREFIX is asserted: upstream never hard-codes the digits either
  — test_io.py:1065 splits the header on "/" to DERIVE the version, and
  test_io.py:1038/1056 rewrite the same header into the string they compare
  against. The version component is `prettyVersion`, the first two
  dot-separated components of the build's own package version plus an optional
  " (pre-release)" suffix (Version.hs:23-26), so pinning it would assert the
  release number rather than the wire contract.

  Model entry: observability.server.version_header. This is the first case in
  the tree to assert a `Server:` response header — an earlier revision of
  spec/observability.yaml wrongly deferred the header to the headers area,
  which carries no entry for it.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L143
