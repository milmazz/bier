id: 1261
feature: pagination/range_header/overrides_query_params
request:
  method: GET
  path: /items?select=id&order=id.asc&limit=3
  headers:
    Accept: application/json
    Range-Unit: items
    Range: 0-1
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-1/*"
  body_exact: [{"id":1},{"id":2}]
notes: >
  limit=3 combined with 'Range: 0-1' returns 2 rows, Content-Range '0-1/*'.
  Mirrors RangeSpec.hs:194, whose it-block is titled "headers override get
  parameters" — but the mechanism is intersection, not override: getRanges
  computes `headerAndLimitRange = rangeIntersection headerRange limitRange`
  (ApiRequest.hs:185), and 0..2 (limit=3) intersected with 0..1 (the header) is
  0..1, which happens to coincide with the header range. This case therefore
  cannot distinguish the two rules; case 1287 (?limit=2 + 'Range: 0-5') can.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L194
