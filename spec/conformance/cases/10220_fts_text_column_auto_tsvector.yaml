id: 10220
feature: operators/fts/auto_tsvector/text
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search&text_search=fts.impossible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search": "It's kind of fun to do the impossible" }
    - { "text_search": "C'est un peu amusant de faire l'impossible" }
notes: >
  fts does NOT require a tsvector column. When the field's base type is
  anything else, PostgREST wraps the FIELD in to_tsvector(), so this compiles
  to `to_tsvector(text_search) @@ to_tsquery('impossible')` rather than to a
  bare `@@`. The wrap is emitted by pgFmtField's `Just (ToTsVector lang)`
  branch (SqlFragment.hs#L248), whose flag is set only for Fts op exprs
  (Plan.hs#L373). Mirrors QuerySpec.hs context "text and json columns" ->
  it "finds matches with to_tsquery" (text_search assertion). Row 2 matches
  because the default text search config is english and both "impossible" and
  the French row's "l'impossible" stem to 'imposs'.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L317
