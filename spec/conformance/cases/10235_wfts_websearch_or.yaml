id: 10235
feature: operators/wfts/websearch_operators/or
request:
  method: GET
  path: /tsearch?text_search_vector=wfts.impossible%20or%20possible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'fun':5 'imposs':9 'kind':3" }
    - { "text_search_vector": "'also':2 'fun':3 'possibl':8" }
notes: >
  `or` inside a wfts value is websearch_to_tsquery syntax, not the PostgREST
  `or=()` logic tree: `text_search_vector @@
  websearch_to_tsquery('impossible or possible')` (SqlFragment.hs#L412).
  Mirrors QuerySpec.hs it "can use boolean operators(and, or, -) in
  websearch_to_tsquery" (second assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L217
