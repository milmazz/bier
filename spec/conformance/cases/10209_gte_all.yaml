id: 10209
feature: operators/quantifier/gte_all
request:
  method: GET
  path: /projects?id=gte(all).{4,3}
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 4, "name": "OSX", "client_id": 2 }
    - { "id": 5, "name": "Orphan", "client_id": null }
notes: >
  gte(all) -> `id >= ALL('{4,3}')`. gte is a QuantOperator, so it accepts the
  any()/all() modifiers just like gt (case 1084). Mirrors QuerySpec.hs
  any/all quantifiers 'works with the gt/gte operator' (second assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1519
