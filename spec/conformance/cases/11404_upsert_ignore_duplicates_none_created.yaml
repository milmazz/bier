id: 11404
feature: mutations/upsert/post/ignore-duplicates-none-created
request:
  method: POST
  path: /tiobe_pls
  headers:
    Content-Type: application/json
    Prefer: return=representation, resolution=ignore-duplicates
  body:
    - { "name": "Java", "rank": 1 }
    - { "name": "C", "rank": 2 }
schema: mutations
preconditions: []
expect:
  status: 201
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: []
notes: >-
  When EVERY row of an ignore-duplicates upsert conflicts, nothing is inserted
  and the representation is an empty array — but the status stays 201, unlike
  the merge-duplicates all-updated case (1375) which degrades to 200. Mirrors
  UpsertSpec.hs#L280-L291 ("succeeds if not a single resource is created"); the
  seeded `tiobe_pls` rows Java(1) and C(2) make both payload rows conflict.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L287
