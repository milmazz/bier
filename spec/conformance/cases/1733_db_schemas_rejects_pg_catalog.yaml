id: 1733
feature: config/validation/db-schemas-restricted-pg-catalog
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_DB_SCHEMAS: "pg_catalog"
preconditions: []
expect:
  exit_code: nonzero
  stderr_contains: "db-schemas does not allow schema: 'pg_catalog'"
notes: >
  NEW in v16.0. parseDbSchemas rejects pg_catalog outright (Config.hs#L366,
  message at #L371); v14.12 accepted it. Mirrors
  test_cli.py:test_restricted_db_schemas over
  fixtures.yaml `restrictedschemas`, single-schema form.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_cli.py#L293
