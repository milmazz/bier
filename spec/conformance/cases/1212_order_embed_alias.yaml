id: 1212
feature: ordering/embed/alias
request:
  method: GET
  path: /projects?id=eq.1&select=id,name,the_tasks:tasks(id,name)&the_tasks.order=name.asc
  headers: { Accept: application/json }
schema: ordering
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_absent: [Warning]
  body_exact:
    - id: 1
      name: "Windows 7"
      the_tasks:
        - { id: 2, name: "Code w7" }
        - { id: 1, name: "Design w7" }
notes: >
  ordering embedded entities with alias. CHANGED in v16.0: the embed-path key is
  the alias ('the_tasks'), not the relation name. The embed path segment matches
  `fromMaybe relName relAlias`, i.e. the alias shadows the relation name once one
  is given (Plan.hs matchTarget). Referencing the relation name still works under
  the default url-use-legacy-target-names=true but is deprecated and adds a
  Warning header (case 1224) — hence headers_absent here pins that the canonical
  alias form emits no deprecation Warning.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1159
