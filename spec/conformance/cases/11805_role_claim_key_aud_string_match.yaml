id: 11805
feature: auth/role-claim-key/aud-string-match
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "aud": "postgrest_test_author" }
schema: auth
preconditions: []
config:
  jwt-aud: postgrest_test_author
  jwt-role-claim-key: "$.aud"
expect:
  status: 200
notes: >-
  The `aud` claim may double as the role claim: with `jwt-aud` and
  `jwt-role-claim-key = $.aud` both set to `postgrest_test_author`, the audience
  check passes AND the role resolves to the same value -> 200. Audience
  validation (Auth/Jwt.hs#L61) runs before role extraction
  (Auth/Jwt.hs#L114). Upstream asserts the status only.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L171
