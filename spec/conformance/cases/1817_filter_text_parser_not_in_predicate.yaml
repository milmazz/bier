id: 1817
feature: domain_representations/filter/text_parser_not_in_predicate
request:
  method: GET
  path: /datarep_todos?select=id,due_at&label_color=not.in.(000000,01E240)
  headers: { Accept: application/json }
schema: domain_representations
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: [{ "id": 2, "due_at": "2018-01-03T00:00:00Z" }]
notes: >
  The `text AS color` parser is applied to every value of a negated `not.in.(...)`
  predicate too, so 000000/01E240 parse to the integers 0/123456 before the NOT IN
  comparison. Row 1 (#000000) and row 3 (#01E240) are excluded by the predicate and
  row 4 has a NULL label_color (NOT IN over NULL is NULL, so it is excluded as well),
  leaving only row 2. Mirrors QuerySpec.hs "uses text parser for filter with 'NOT IN'
  predicates".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1643
