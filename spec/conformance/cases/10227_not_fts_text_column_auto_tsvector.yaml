id: 10227
feature: operators/not/fts/auto_tsvector/text
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search&text_search=not.fts.impossible%7Cfat%7Cfun
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search": "Es ist eine Art Spaß, das Unmögliche zu machen" }
notes: >
  The `not` prefix and the to_tsvector wrap compose: pgFmtFilter emits the NOT
  token BEFORE the (already wrapped) field reference, giving
  `NOT to_tsvector(text_search) @@ to_tsquery('impossible|fat|fun')`
  (SqlFragment.hs#L383 for the operand ordering, SqlFragment.hs#L248 for the
  wrap). Mirrors QuerySpec.hs context "text and json columns" -> it "can be
  negated with not operator" (first text_search assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L424
