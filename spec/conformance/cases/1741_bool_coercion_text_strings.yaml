id: 1741
feature: config/coercion/bool-from-text-string
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  file:
    db-channel-enabled: "true"
    db-prepared-statements: "FALSE"
    jwt-secret-is-base64: '"true"'
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'db-channel-enabled = true'
    - 'db-prepared-statements = false'
    - 'jwt-secret-is-base64 = true'
notes: >
  coerceBool filters the value down to its alpha characters, title-cases the
  result and `read`s it as a Bool (Config.hs#L493), so "true", "FALSE" and even
  a doubly-quoted "\"true\"" all parse. Mirrors configs/boolean-string.config
  verbatim (line 3 of that file is `jwt-secret-is-base64 = "\"true\""`); the
  expected dump is configs/expected/boolean-string.config.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/configs/boolean-string.config#L2
