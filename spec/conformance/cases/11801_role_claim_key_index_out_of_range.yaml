id: 11801
feature: auth/role-claim-key/index-out-of-range
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload:
      myDomain: ["other", "postgrest_test_author"]
      other: 1.23
schema: auth
preconditions: []
config:
  jwt-role-claim-key: "$.myDomain[3]"
expect:
  status: 401
notes: >-
  The JSON Path selects nothing (index 3 of a 2-element array), so no role is
  extracted and PostgREST falls back to `db-anon-role`
  (Auth/Jwt.hs#L114-L115). The anonymous role cannot read `authors_only`, so
  the request ends in the 42501 -> 401 envelope of case 1450. Upstream asserts
  the status only; the exact envelope is already pinned by case 1450, so this
  case deliberately pins nothing beyond it.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L143
