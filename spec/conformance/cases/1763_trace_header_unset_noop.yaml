id: 1763
feature: observability/trace-header/unset-noop
request:
  method: GET
  path: /items?id=eq.1
  headers: { X-Request-Id: "99", Accept: application/json }
schema: observability
config:
  server-trace-header: ""
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_absent: [X-Request-Id]
  body_exact: [{ "id": 1 }]
notes: >
  When server-trace-header is unset (empty string -> Nothing), the trace
  middleware is a no-op: the incoming X-Request-Id is NOT echoed back. Mirrors
  App.hs:285-289 (Nothing -> app req respond); `optString` drops an empty
  string to Nothing (Config.hs:442), so server-trace-header="" is the unset
  case. Source line is the middleware's Nothing branch.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L286
