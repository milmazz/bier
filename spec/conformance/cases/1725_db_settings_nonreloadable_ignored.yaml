id: 1725
feature: config/sources/db-role-settings-nonreloadable-ignored
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_DB_CONFIG: "true"
    PGUSER: db_config_authenticator
    PGRST_SERVER_PORT: "3000"
  preconditions_sql:
    - "CREATE ROLE db_config_authenticator LOGIN NOINHERIT"
    # Deliberately a *parseable* int, unlike upstream's literal 'ignored'
    # (db_config.sql#L56): coerceInt turns 'ignored' into Nothing
    # (Config.hs#L486) and parseServerPort's `fromMaybe 3000` (Config.hs#L351)
    # then dumps 3000 whether or not the in-database value was consulted, so
    # the 'ignored' spelling cannot distinguish a correct implementation from
    # one that honours every pgrst.* setting. With '3001' a wrong
    # implementation dumps `server-port = 3001` and the case fails.
    - "ALTER ROLE db_config_authenticator SET pgrst.server_port = '3001'"
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'server-port = 3000'
notes: >
  Non-reloadable keys (e.g. server-port) set via ALTER ROLE ... SET pgrst.* are
  ignored; the value comes from env/file. The in-database source only ever
  queries the keys listed in Config/Database.hs `dbSettingsNames`
  (the source anchor) — `server_port` is absent from that list, so the role
  setting never reaches `overrideFromDbOrEnvironment` and PGRST_SERVER_PORT
  stands. Mirrors the db_config.sql non-reloadable block
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/db_config.sql#L56),
  with a parseable value so the assertion can actually fail.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config/Database.hs#L45
