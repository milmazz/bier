id: 1829
feature: domain_representations/write/patch_format_selected
request:
  method: PATCH
  path: /datarep_todos_computed?id=eq.2&select=id,label_color
  headers:
    Accept: application/json
    Content-Type: application/json
    Prefer: return=representation
  body_json: { "label_color": "#221100", "due_at": "2019-01-03T11:00:00Z" }
schema: domain_representations
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "0-0/*"
    Preference-Applied: return=representation
  body_exact: [{ "id": 2, "label_color": "#221100" }]
notes: >
  Upstream UpdateSpec "for a single row" > "parses values in payload and formats
  individually selected values in return=representation". PATCH round-trips a
  domain value: the body is parsed by `json AS color` / `json AS isodate` and the
  ?select-restricted representation re-formats label_color through
  `color AS json`. Content-Range is 0-0/* for the one matched row.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L659
