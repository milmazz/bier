id: 1744
feature: config/sources/db-config-false-ignores-role-settings
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_DB_CONFIG: "false"
    PGUSER: db_config_authenticator
  preconditions_sql:
    - "CREATE ROLE db_config_authenticator LOGIN NOINHERIT"
    - "ALTER ROLE db_config_authenticator SET pgrst.db_max_rows = '500'"
  file:
    db-max-rows: 1000
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'db-max-rows = 1000'
notes: >
  The in-database source is consulted only when db-config is true: the
  --dump-config path runs `when configDbConfig $ AppState.readInDbConfig True
  appState` (CLI.hs#L55). With db-config=false the role's `pgrst.db_max_rows`
  setting is never read, so the config-file value stands. Converse of case 1724,
  which sets PGRST_DB_CONFIG=true over the same role settings and gets 500.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/CLI.hs#L55
