id: 10236
feature: operators/wfts/websearch_operators/negation
request:
  method: GET
  path: /tsearch?text_search_vector=wfts.fun%20and%20-possible
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search_vector": "'fun':5 'imposs':9 'kind':3" }
notes: >
  websearch_to_tsquery's `-` negation prefix survives the round trip:
  `text_search_vector @@ websearch_to_tsquery('fun and -possible')`
  (SqlFragment.hs#L412). The leading `-` is part of the VALUE, so it must not
  be confused with a filter-level negation (that is spelled `not.` before the
  operator token). Mirrors QuerySpec.hs it "can use boolean operators(and, or,
  -) in websearch_to_tsquery" (third assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L224
