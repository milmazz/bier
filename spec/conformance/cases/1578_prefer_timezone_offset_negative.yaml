id: 1578
feature: headers/prefer/timezone-offset-negative
request:
  method: GET
  path: /timestamps
  headers:
    Prefer: "timezone=-4"
schema: headers
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Preference-Applied: "timezone=-4"
  body_exact:
    - { "t": "2023-10-18T08:37:59.611-04:00" }
    - { "t": "2023-10-18T10:37:59.611-04:00" }
    - { "t": "2023-10-18T12:37:59.611-04:00" }
notes: >
  NEW in PostgREST v16.0, negative/short-form counterpart of case 1577: a
  bare `-4` is accepted verbatim as the session TimeZone and echoed
  unmodified in Preference-Applied (the echo is the raw preference token, not
  a normalized zone name). Again POSIX sign convention applies, so `-4`
  renders as `-04:00`. Same removal of the pg_timezone_names membership check
  as 1577 (src/library/PostgREST/ApiRequest/Preferences.hs#L138). Wire bytes
  are upstream's, re-verified against a loaded bier_test. Mirrors the exact
  it-block at Preferences/TimezoneSpec.hs:70-78 ("should change with negative
  offset").
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L70
