id: 11809
feature: auth/jwt/wrong-secret
request:
  method: GET
  path: /authors_only
  headers:
    Accept: application/json
    Authorization: "Bearer eyJhbGciOiJIUzI1NiJ9.e30.zSUQ-4HnMGMXFzA7JjwLhgiTqXQ1lWIHC-wTRnUfoQE"
schema: auth
preconditions: []
expect:
  status: 401
  body_exact:
    {
      "code": "PGRST301",
      "details": "None of the keys was able to decode the JWT",
      "hint": null,
      "message": "No suitable key or wrong key type",
    }
notes: >-
  New in v16.0: the JWT decode-error assertions moved out of the io suite
  (v14.12 test/io/test_auth.py::test_jwt_errors) into the black-box hspec suite
  as Feature/Query/ErrorSpec.hs "JWT Errors". A structurally valid HS256 token
  whose signature does not verify under the configured secret fails inside
  `JWT.decode` with a jose `KeyError`, mapped to `JwtDecodeErr (KeyError m)`
  (Auth/Jwt.hs#L104) -> PGRST301, and the jose message is surfaced verbatim in
  `details` (Error.hs#L677). The token here is upstream's
  `generateJWTWithSecret [json|{}|] "wrong secret"`: header `{"alg":"HS256"}`,
  payload `{}`, HMAC-SHA256 signed with the literal key `wrong secret` instead
  of the harness secret `reallyreallyreallyreallyverysafe`. It is spelled out as
  a literal Authorization header because `request.jwt.sign_with` only names
  secrets the harness knows, and by design none of them is the wrong one.
  Signature verification happens before any claim is read, so the empty claim
  set never reaches role extraction.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ErrorSpec.hs#L107
