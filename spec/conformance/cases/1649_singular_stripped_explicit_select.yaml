id: 1649
feature: content_negotiation/nulls-stripped/singular-explicit-select
request:
  method: GET
  path: /organizations?select=id,referee,auditor&limit=1
  headers: { Accept: application/vnd.pgrst.object+json;nulls=stripped }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/vnd.pgrst.object+json;nulls=stripped; charset=utf-8
  body_exact: { id: 1 }
notes: >-
  The stripped SINGULAR media type composes with an explicit select= the same
  way the stripped array does: organization 1 has referee and auditor null, so
  naming them in select= still yields an object with only {"id":1}. Mirrors
  NullsStripSpec's "strip nulls from response even if explicitly selected"
  context, it block "strips nulls when Accept:
  application/vnd.pgrst.object+json;nulls=stripped". This is the singular
  counterpart of case 1634 (array + explicit select) and the explicit-select
  counterpart of case 1632 (singular, default select).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L105
