id: 1827
feature: domain_representations/write/view_columns_param_uses_defaults
request:
  method: POST
  path: /datarep_todos_computed?columns=id,label_color&select=id,name,label_color,due_at
  headers:
    Accept: application/json
    Content-Type: application/json
    Prefer: return=representation
  body_json:
    {
      "id": 5,
      "name": "party",
      "label_color": "#001100",
      "due_at": "invalid but should be ignored",
    }
schema: domain_representations
preconditions: []
expect:
  status: 201
  headers:
    Content-Type: application/json; charset=utf-8
    Content-Range: "*/*"
  body_exact:
    [
      {
        "id": 5,
        "name": null,
        "label_color": "#001100",
        "due_at": "2018-01-01T00:00:00Z",
      },
    ]
notes: >
  Upstream InsertSpec "on updatable views with ?columns parameter" > "ignores
  json keys not included in ?columns; parses only the ones specified" — the
  view-borne twin of case 1813. Only id and label_color are taken from the body,
  so the deliberately invalid due_at string is never handed to the
  `json AS isodate` parser (it would raise otherwise) and the column falls back
  to the base table's DEFAULT isodate '2018-01-01', formatted "2018-01-01T00:00:00Z";
  name is likewise absent from ?columns and comes back null. Body verified
  against a freshly loaded bier_test through the area's view mirror.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L891
