id: 1142
feature: select/embed/hint-table-bang-fk
request:
  method: GET
  path: /clients?id=eq.1&select=id,projects:projects!client(id,tasks(id))
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: [{"id":1,"projects":[{"id":1,"tasks":[{"id":1},{"id":2}]},{"id":2,"tasks":[{"id":3},{"id":4}]}]}]
notes: >
  can specify a table!fk hint and request children 2 levels: the
  `<relation>!<fk>` hint form names the FK constraint (test.projects'
  clients FK is renamed to "client" in the fixture) to pick the relationship,
  the alias `projects:` sets the embed key, and the hinted embed carries a
  further `tasks(id)` level (EmbedDisambiguationSpec.hs:244). Consolidated
  seed data matches the upstream fixture exactly here: clients 1..2,
  projects 1..5 (client_id 1,1,2,2,NULL), tasks 1..8 (project_id
  1,1,2,2,3,3,4,4), so client 1 owns projects 1 and 2 with tasks 1,2 and 3,4.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L244
