id: 1648
feature: content_negotiation/parsing/case-insensitive
request:
  method: GET
  path: /items?id=eq.5
  headers: { Accept: ApplicatIon/vnd.PgRsT.object+json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/vnd.pgrst.object+json; charset=utf-8
  body_exact: { "id": 5 }
notes: >-
  Media types are matched case-insensitively: decodeMediaType lowercases both
  the main type and the subtype before the dispatch table lookup
  (MediaType.hs#L139), so the mixed-case "ApplicatIon/vnd.PgRsT.object+json"
  decodes to MTVndSingularJSON False exactly like the canonical spelling. The
  RESPONSE Content-Type is regenerated by toMime, so it comes back canonically
  lowercase regardless of how the client spelled it. The upstream assertion is
  the executable doctest added for issue #3478 (MediaType.hs#L127-L129, the
  literal example this case reuses); the wire-level singular behaviour it
  resolves to is the one pinned by case 1610.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L128
