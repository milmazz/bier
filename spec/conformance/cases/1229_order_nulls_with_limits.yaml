id: 1229
feature: ordering/nulls/alongside_limits
request:
  method: GET
  path: /clients?select=id,projects(id,tasks(id))&order=id.asc.nullslast&limit=1&projects.order=id.asc.nullsfirst&projects.limit=2
  headers: { Accept: application/json }
schema: ordering
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-0/*"
  body_exact:
    - id: 1
      projects:
        - id: 1
          tasks: [{ id: 1 }, { id: 2 }]
        - id: 2
          tasks: [{ id: 3 }, { id: 4 }]
notes: >
  A nulls clause on both the top-level and the embedded order must survive being
  combined with `limit` at both levels. Upstream's it-block ("works alongside
  order by with nulls order", RangeSpec.hs:226) is the regression guard for issue
  #4109 ("Fix regression that makes ORDER BY with nulls-order not work alongside
  limits", CHANGELOG 13.0.2); it predates Bier's previous v14.12 pin
  (RangeSpec.hs:227 there) and is unchanged at v16.0 — it had simply never been
  covered here. It is the nulls-carrying twin of pagination case 1276
  (RangeSpec.hs:202), which drives the same clients/projects/tasks graph with a
  plain `order=id.asc` and no nulls clause. As upstream, the embedded `tasks`
  rows are neither ordered nor limited, so they come back in the relation's
  natural order, and the embedded limits leave the top-level Content-Range at
  the top-level window '0-0/*'.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RangeSpec.hs#L226
