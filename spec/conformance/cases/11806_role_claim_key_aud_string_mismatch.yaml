id: 11806
feature: auth/role-claim-key/aud-string-mismatch
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload: { "aud": "postgrest_test_invalid" }
schema: auth
preconditions: []
config:
  jwt-aud: postgrest_test_author
  jwt-role-claim-key: "$.aud"
expect:
  status: 401
notes: >-
  Audience validation runs before role extraction, so an `aud` that does not
  match `jwt-aud` fails with 401 PGRST303 "JWT not in audience"
  (Auth/Jwt.hs#L61, Error.hs#L669) regardless of the fact that
  `jwt-role-claim-key` points at the very same claim. Upstream asserts the
  status only; the PGRST303 envelope itself is pinned by case 1469.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L175
