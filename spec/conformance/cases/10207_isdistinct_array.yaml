id: 10207
feature: operators/isdistinct/array
request:
  method: GET
  path: /entities?arr=isdistinct.{1,2}&select=id
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "id": 1 }
    - { "id": 3 }
    - { "id": 4 }
notes: >
  `arr IS DISTINCT FROM '{1,2}'` on integer[]. Entity 4 (arr IS NULL) is
  included, since IS DISTINCT FROM is null-safe. Note the SQL branch differs
  from the simple operators: IsDistinctFrom emits `unknownLiteral val`
  directly rather than routing the value through
  pgFmtUnknownLiteralForField. Mirrors AndOrParamsSpec.hs 'can handle array
  operators' (isdistinct assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AndOrParamsSpec.hs#L180
