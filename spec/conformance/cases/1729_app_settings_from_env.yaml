id: 1729
feature: config/app-settings/from-env
request:
  kind: cli
  flag: "--dump-config"
schema: config
config:
  env:
    PGRST_APP_SETTINGS_FOO: "bar"
preconditions: []
expect:
  exit_code: 0
  dump_contains:
    - 'app.settings.FOO = "bar"'
notes: "PGRST_APP_SETTINGS_<NAME> env vars are normalized into app.settings.<NAME> GUCs. `normalize` only strips the PGRST_APP_SETTINGS_ prefix and prepends 'app.settings.', so the remainder is kept verbatim with no case folding."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L348
