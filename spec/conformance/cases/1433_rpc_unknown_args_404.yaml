id: 1433
feature: rpc/error/unknown-args
request:
  method: GET
  path: /rpc/add_them?a=1&b=2&smthelse=blabla
  headers: { Accept: application/json }
schema: test
preconditions: []
expect:
  status: 404
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    hint: "Perhaps you meant to call the function test.add_them(a, b)"
    message: "Could not find the function test.add_them(a, b, smthelse) in the schema cache"
    code: "PGRST202"
    details: "Searched for the function test.add_them with parameters a, b, smthelse, but no matches were found in the schema cache."
notes: >
  Unknown extra arg is not ignored; 404 PGRST202 with a hint pointing at the
  real signature. `schema: test` is load-bearing, not incidental: PGRST202
  qualifies every one of the three strings with the REQUESTED schema, not with
  the schema a matching function was eventually found in — `func = schema <>
  "." <> procName` in both the message (Error.hs#L249) and the details
  (Error.hs#L269), and `noRpcHint schema procName …` builds the hint the same
  way ("Perhaps you meant to call the function " <> schema <> "." <>, Error.hs
  #L372,
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L249).
  Under the `rpc` fixture-set label the harness sends `Accept-Profile: rpc`
  (test/support/http_case.ex build_headers), so the wire text would have to
  read `rpc.add_them(…)`; `test` is suppressed as the default schema, which
  makes upstream's text verbatim-correct. `test.add_them(a integer, b integer)`
  exists exactly once in the loaded bier_test (fixtures.sql#L1288), so both the
  404 and the hint's fuzzy match over that single overload's parameter list
  ("(a, b)" vs the supplied "(a, b, smthelse)") reproduce upstream's schema
  cache exactly.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L239
