id: 1285
feature: pagination/range_header/get_only_rpc_post
request:
  method: POST
  path: /rpc/getitemrange?order=id
  headers:
    Accept: application/json
    Content-Type: application/json
    Range-Unit: items
    Range: 0-1
  body_json: { "min": 0, "max": 15 }
schema: pagination
preconditions: []
expect:
  status: 200
  headers:
    Content-Range: "0-14/*"
  body_exact: [{"id":1},{"id":2},{"id":3},{"id":4},{"id":5},{"id":6},{"id":7},{"id":8},{"id":9},{"id":10},{"id":11},{"id":12},{"id":13},{"id":14},{"id":15}]
notes: >
  A Range header on POST /rpc/<fn> is ignored, because getRanges only reads it
  for GET (`headerRange = if method == "GET" then rangeRequested hdrs else
  allRange`, ApiRequest.hs:183). The call therefore returns the function's full
  result set with Content-Range '0-14/*' instead of the 2-row window the header
  asks for. Contrast case 1280, where the same 'Range' header on a GET /rpc/
  read does select the window, and case 1281, where limit/offset query params
  DO apply to a POST /rpc/ call — the method scoping is specific to the header.
  Derived from source (ground-truth priority 2): PostgREST's own suite never
  sends a Range header on a POST. Verified against a freshly loaded bier_test:
  pagination.getitemrange(0,15) is `SELECT * FROM items WHERE id > 0 AND
  id <= 15`, yielding all 15 rows; `?order=id` fixes the row order, and
  pagination.items exposes only the `id` column.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L183
