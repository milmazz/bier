id: 1650
feature: openapi/root/media-type
request:
  method: GET
  path: /
  headers: { Accept: application/openapi+json }
schema: test
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/openapi+json; charset=utf-8
  body_jsonpath:
    - { path: "$.swagger", equals: "2.0" }
notes: >
  GET / with Accept: application/openapi+json serves the GENERATED Swagger
  document with status 200 and Content-Type application/openapi+json;
  charset=utf-8. Source is SpecHelper.validateOpenApiResponse
  (SpecHelper.hs#L104-114: request methodGet "/" headers "", then
  respStatus == 200 and ("Content-Type","application/openapi+json;
  charset=utf-8") `elem` respHeaders), invoked with exactly this Accept header
  at OpenApiSpec.hs#L20 under `withConfig baseCfg` (OpenApiSpec.hs#L18) — i.e.
  with NO db-root-spec, which is what this case (no `config:`) models.
  RE-CITED this pass: the case previously cited RootSpec.hs#L18. At v16.0 that
  spec runs under `baseCfg { configDbRootSpec = Just $ QualifiedIdentifier
  mempty "root" }` (RootSpec.hs#L16), so its it-blocks witness the
  root-spec-FUNCTION path, not the generated document. The assertion happens to
  hold on both paths, but the block does not support it for this case's config.
  `"swagger": "2.0"` is the swagger2 library's fixed top-level version field
  (OpenAPI.hs postgrestSpec builds a `Swagger`); the whole document is
  additionally schema-validated by validateOpenApiResponse against
  test/spec/fixtures/openapi.json (SpecHelper.hs#L115-123).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/SpecHelper.hs#L104
