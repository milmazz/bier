id: 1828
feature: domain_representations/write/patch_headers_only_parses_payload
request:
  method: PATCH
  path: /datarep_todos_computed?id=eq.2
  headers:
    Prefer: "return=headers-only"
    Content-Type: application/json
  body_json: { "label_color": "#221100", "due_at": "2019-01-03T11:00:00Z" }
schema: domain_representations
preconditions: []
expect:
  status: 204
  headers:
    Content-Range: "0-0/*"
  headers_absent: [Content-Type, Content-Length]
  body_exact: ""
notes: >
  Upstream UpdateSpec "Data representations" > "for a single row" > "parses
  values in payload". The `json AS <domain>` parsers run on a PATCH body just as
  they do on a POST body: "#221100" would be rejected as an integer literal
  without the color parser. Nothing is returned, so the response is 204 with no
  Content-Type and no Content-Length, but it still carries the Content-Range of
  the single matched row.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpdateSpec.hs#L648
