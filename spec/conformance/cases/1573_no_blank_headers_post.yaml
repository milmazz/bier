id: 1573
feature: headers/guc/no-blank-headers
request:
  method: POST
  path: /loc_test
  headers:
    Content-Type: application/json
  body: { "id": "1", "c": "c1" }
schema: headers
preconditions: []
expect:
  status: 201
  headers_no_blank: true
  body_exact: null
notes: >
  Regression for issue #1427: no blank ` : ` headers may appear in the response.
  `headers_no_blank: true` asserts that no response header has an empty value
  (the harness does not inspect header names). Mirrors the POST it-block
  "shouldn't add blank headers on POST" at RpcSpec.hs:1103-1107, inside the
  "Blank headers bug" context (L1102); the sibling PATCH (L1109), GET (L1115)
  and DELETE (L1121) it-blocks are not modelled.
  The body is byte-identical to upstream's `[json|{"id": "1", "c": "c1"}|]`
  (RpcSpec.hs#L1104) — `id` is deliberately a JSON *string* against the int PK
  of `headers.loc_test`, so the insert also exercises PostgreSQL's text->int
  coercion (`json_populate_record(null::headers.loc_test, '{"id":"1",...}')`
  yields `id = 1`, verified on a freshly loaded bier_test). The only deviation
  from upstream's request is the explicit `Content-Type: application/json`:
  hspec-wai sends the body with no Content-Type and PostgREST defaults it to
  JSON, which the conformance harness expresses explicitly. Upstream asserts
  only `noBlankHeader`; the 201 and the empty body are the default no-Prefer
  POST outcome (see cases 1561/1563) and are asserted here as well.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1103
