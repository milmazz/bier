id: 1654
feature: openapi/root/swagger-version-info
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: openapi_no_comment
preconditions: []
expect:
  status: 200
  body_jsonpath:
    - { path: "$.swagger", equals: "2.0" }
    - { path: "$.info.title", equals: "PostgREST API" }
    - { path: "$.info.description", equals: "This is a dynamic API generated by PostgREST" }
notes: >
  When the exposed schema carries no COMMENT, info.title falls back to
  "PostgREST API" and info.description to "This is a dynamic API generated by
  PostgREST": `& title .~ fromMaybe "PostgREST API" dTitle` (OpenAPI.hs#L396)
  and `& description ?~ fromMaybe "This is a dynamic API generated by
  PostgREST" dDesc` (OpenAPI.hs#L397), where (dTitle, dDesc) is the breakOn
  "\n" of the schema description (OpenAPI.hs#L413-414) and is Nothing when
  there is no COMMENT. Contrast case 1656, which exercises the commented
  schema.
  CORRECTED this pass: the case used to carry the precondition
  `COMMENT ON SCHEMA test IS NULL`. That statement was never executed (a case's
  `preconditions:` list is parsed by the harness and never run) and, had it
  run, it would have broken case 1656 by stripping the very COMMENT that case
  asserts. The comment-less schema is a FIXTURE object instead —
  `CREATE SCHEMA IF NOT EXISTS openapi_no_comment` (conformance/fixtures.sql
  #L247, granted at #L2002) — which the harness exposes to this case alone by
  booting a variant instance with db_schemas ["openapi_no_comment"].
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/OpenAPI.hs#L396
