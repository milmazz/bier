id: 10200
feature: operators/in/empty_set
request:
  method: GET
  path: /items_with_different_col_types?int_data=in.()
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact: []
notes: >
  An empty `in.()` value list is representable precisely because PostgREST
  compiles `in` to `= ANY(...)` rather than SQL `IN` (SQL has no `IN ()`).
  pListVal yields the singleton list [""] for an empty parenthesised list, and
  pgFmtFilter special-cases it to `= ANY('{}')`, which matches no row. Mirrors
  QuerySpec.hs "IN and NOT IN empty set" / "works for integer".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1362
