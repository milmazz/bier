id: 10224
feature: operators/plfts/auto_tsvector/text
request:
  method: GET
  path: /tsearch_to_tsvector?select=text_search&text_search=plfts.The%20Fat%20Rats
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - { "text_search": "Fat cats ate rats" }
notes: >
  The automatic to_tsvector() wrap is not specific to fts: it is keyed on the
  operator being ANY FtsOperator (Plan.hs#L373 matches `Fts _ lang _`), so
  plfts on a text column compiles to
  `to_tsvector(text_search) @@ plainto_tsquery('The Fat Rats')`. Mirrors
  QuerySpec.hs context "text and json columns" -> it "finds matches with
  plainto_tsquery" (text_search assertion).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L360
