id: 11410
feature: mutations/upsert/post/merge-duplicates-only-pk-table
request:
  method: POST
  path: /only_pk
  headers:
    Content-Type: application/json
    Prefer: return=representation, resolution=merge-duplicates
  body:
    - { "id": 1 }
    - { "id": 2 }
    - { "id": 4 }
schema: mutations
preconditions: []
expect:
  status: 201
  headers:
    Content-Type: application/json; charset=utf-8
    Preference-Applied: resolution=merge-duplicates, return=representation
  body_exact:
    - { "id": 1 }
    - { "id": 2 }
    - { "id": 4 }
notes: >-
  Degenerate upsert target: a table whose ONLY columns are primary-key columns
  leaves ON CONFLICT DO UPDATE with no column to SET, and PostgREST still
  answers 201 with every payload row echoed (ids 1 and 2 conflict, 4 is
  inserted, so the "something was inserted" 201 rule of case 1374 applies).
  Verbatim mirror of UpsertSpec.hs#L146-L153 ("succeeds if the table has only PK
  cols and no other cols"); `only_pk` is seeded with ids 1 and 2 in the
  consolidated fixture, exactly as upstream.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/UpsertSpec.hs#L147
