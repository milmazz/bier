id: 1583
feature: headers/vary/absent-on-errors
request:
  method: GET
  path: /parents
  headers:
    Accept-Profile: unknown
schema: headers
preconditions: []
expect:
  status: 406
  headers_absent: [Vary]
notes: >
  NEW in PostgREST v16.0, the negative half of the default-Vary rule (cases
  1575/1582): error responses do NOT carry `Vary`. Errors never reach App.hs'
  `toWaiResponse` — the outer handler maps a Left straight to a response
  (`handleError = fmap (either (Error.errorResponseFor
  configClientErrorVerbosity) identity)`,
  src/library/PostgREST/App.hs#L154), and `errorResponseFor` builds it with a
  closed header list: Content-Type, Content-Length, Proxy-Status, plus the
  error's own `headers err` (src/library/PostgREST/Error.hs#L88). No Vary
  appears in that list, and no middleware supplies one either — the CORS
  middleware sets `corsVaryOrigin = False` (src/library/PostgREST/Cors.hs#L39)
  and `hVary` occurs nowhere else in src/ than App.hs' toWaiResponse. The
  request reuses case 1560's verified 406/PGRST106 scenario (an Accept-Profile
  naming a non-exposed schema) purely as a cheap, side-effect-free error; the
  body/hint assertions stay in 1560 so this case pins only the header rule.
  Upstream asserts no it-block for it (HttpHeaderSpec.hs covers only the 200
  path), so this is derived from the source funnel above.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L88
