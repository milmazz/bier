id: 1704
feature: config/server-cors-allowed-origins/no-match
request:
  method: GET
  path: /items
  headers:
    Accept: "*/*"
    Origin: http://invalid.com
schema: config
config:
  # Only the CORS key is declared; see case 1702 for why db-schemas/db-anon-role
  # are deliberately absent.
  server-cors-allowed-origins: "http://example.com, http://example2.com"
preconditions: []
expect:
  status: 200
  headers_absent: [Access-Control-Allow-Origin]
notes: "A request from an origin not in the allowlist gets no Access-Control-Allow-Origin header. Mirrors CorsSpec.hs 'GET no preflight request should not return Access-Control-Allow-Origin'."
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/CorsSpec.hs#L100
