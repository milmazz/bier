id: 10205
feature: operators/in/blank_element_error
request:
  method: GET
  path: /items_with_different_col_types?int_data=in.( ,3,4)
  headers: { Accept: application/json }
schema: operators
preconditions: []
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: "22P02"
    message: 'invalid input syntax for type integer: ""'
    details: null
    hint: null
notes: >
  Only a wholly empty list collapses to `= ANY('{}')`. A blank element beside
  real ones is kept: the leading whitespace is eaten by `lexeme (char '(')`,
  so the elements are ["", "3", "4"] and the array literal `{"","3","4"}` is
  cast to integer[], which Postgres rejects with SQLSTATE 22P02 -> HTTP 400.
  Mirrors QuerySpec.hs "only returns an empty result set if the in value is
  empty".
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1395
