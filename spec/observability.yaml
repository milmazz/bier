# PostgREST v16.0 — Observability behavior model
#
# Scope (this area only):
#   - Server-Timing response header (jwt / parse / plan / transaction /
#     response) gated by `server-timing-enabled`.
#   - server-trace-header: echo of an arbitrary request header (e.g.
#     X-Request-Id) back on the response.
#   - log-level filtering of the Apache-style access log, and the access-log
#     line format itself.
#   - log-query: emit the executed SQL at the current log level.
#   - Server diagnostic (stderr) log lines, including the JSON PGRST00x
#     payloads.
#   - Prometheus metrics surface exposed on the admin /metrics endpoint.
#   - `Server: postgrest/<ver>` version header (docs/references/observability.rst
#     §"Server Version Header", L283 — a section of THIS area's docs page).
#
# CORRECTION (this pass): an earlier revision of this note claimed the `Server`
# header was owned by the headers area. It was not: `spec/headers.yaml` carries
# no Server entry and no case under `spec/conformance/cases/` asserted a
# `Server:` response header. It is now owned here — see
# observability.server.version_header + case 1771.
#
# NOT in this area (owned elsewhere, listed so the boundary is explicit):
#   - `Proxy-Status: PostgREST; error=<code>` — errors area (spec/errors.yaml).
#   - `Vary: Accept, Prefer, Range` — headers area (cases 1575/1576/1582/1583).
#   - `Warning: 299 PostgRESTv<ver> "..."` response header for legacy target
#     names — select/embedding area (only its *log line* is modelled here).
#   - `application/vnd.pgrst.plan` execution plans — content_negotiation area.
#   - admin /live, /ready, /schema_cache — config/admin area.
#
# Ground truth (priority order):
#   1. PostgREST test specs (test/spec/Feature/ObservabilitySpec.hs,
#      test/spec/Feature/Query/ServerTimingSpec.hs) and the process-level
#      tests (test/io/test_io.py, test_admin.py, test_settings.py).
#   2. PostgREST source (src/library/PostgREST/{Logger,Logger/Apache,Metrics,
#      Observation,Admin,App,Response/Performance,Config}.hs)
#   3. PostgREST docs (postgrest.org/en/v16/references/observability.html)
#
# v16.0 NOTE — module layout moved. In v14.12 the modules lived at
#   src/PostgREST/<Module>.hs
# In v16.0 the source tree was split into src/executable/ and src/library/, so
# the same modules are now at
#   src/library/PostgREST/<Module>.hs
# Every anchor below is re-pinned accordingly.
#
# Every entry carries a `source` URL with a line anchor. Behaviors that could
# not be traced to a concrete source line are recorded in `gaps`.
#
# Conformance case band for this area: 1750..1799 (overflow 13000..13199).

area: observability
version: PostgREST v16.0
previous_version: PostgREST v14.12

# ---------------------------------------------------------------------------
# What changed between v14.12 and v16.0 (observability area)
# ---------------------------------------------------------------------------
changes_since_v14_12:
  - change: >
      The access log is no longer produced by the wai-extra RequestLogger
      middleware. `PostgREST.Logger.middleware` was deleted; the app now emits a
      `ResponseObs` observation per response and the logger formats it with a
      vendored Apache formatter (PostgREST.Logger.Apache.apacheFormat).
    effect: >
      No wire change and no change to the log line format — the combined-format
      line, its "-" placeholders, and the log-level status filter are
      byte-identical to v14.12. The role shown in the user field now comes from
      a Writer that records `authRole` before the ExceptT short-circuits, so it
      survives error paths.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L95
  - change: >
      `log-level` is now read per observation (`getLogLevel loggerState`)
      instead of being captured once at startup, so it is reloadable at runtime
      (SIGUSR2 / in-db config reload).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L72
  - change: >
      Pool-acquisition-timeout diagnostics are debounced by a hand-rolled
      debouncer (PostgREST.Debounce.makeDebouncer + a 5 s cooldown) instead of
      Control.Debounce's leadingEdge mkDebounce.
    effect: >
      Observable count is the same shape: one line immediately, at most one more
      after the cooldown for a burst (6 timing-out requests produce 2 timeout
      lines but 6 access-log lines).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L57
  - change: >
      An observation may now render as MULTIPLE stderr lines: v14.12's
      `observationMessage :: Observation -> Text` (Logger.hs:159 in v14.12)
      became `observationMessages :: Observation -> [Text]` (the anchored line).
      Consequently `SchemaCacheSummaryObs` was folded into
      `SchemaCacheLoadedObs`, whose single case now emits BOTH the "Schema cache
      loaded <summary>" and the "Schema cache loaded in <ms> milliseconds" lines
      (Logger.hs:168-172).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L132
  - change: >
      NEW: `SchemaCacheQueriedObs` carries per-query timings; at log-level=debug
      a second line "tables: <n> ms, keydeps: <n> ms, rels: <n> ms, funcs:
      <n> ms, comprels: <n> ms, dreps: <n> ms, mhandlers: <n> ms" is emitted.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L164
  - change: >
      NEW observations: `LegacyTargetNameWarningObs` (two WARNING lines when
      `url-use-legacy-target-names` is on and an embed alias is referenced by
      relation name) and `AdminServerCrashedObs`.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L196
  - change: >
      NEW: GHC RTS metrics (`ghc_*`) are registered on the admin /metrics
      endpoint, but only when the process is started with RTS statistics
      enabled (`postgrest +RTS -T -RTS`). Absent by default — asserted by the
      new test/io/test_admin.py pair
      `test_admin_metrics_include_ghc_runtime_metrics` (L147) and
      `test_admin_metrics_exclude_ghc_runtime_metrics_by_default` (L161).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Metrics.hs#L48
  - change: >
      `client-error-verbosity` (NEW in v16.0, errors area) does NOT affect
      server diagnostics: Logger.hs pins `Error.errorPayload Verbose` for every
      stderr JSON payload, so PGRST00x diagnostic lines keep all four keys.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L249
  - change: >
      The Server-Timing header, its five metrics, their fixed order, the
      one-decimal millisecond rendering, its OPTIONS behavior (all five metrics
      — there is no OPTIONS subset; see
      observability.server_timing.options_subset), and the
      server-trace-header echo are UNCHANGED on the wire from v14.12. The whole
      Performance.hs module is byte-identical apart from an added `-- $setup`
      doctest preamble (+3 lines), so only line anchors and module paths moved.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/Performance.hs#L30
  - change: >
      Internal only, no wire change: the `jwt` metric is no longer measured by a
      dedicated Auth middleware and read back off the Wai vault
      (v14.12 App.hs: `jwtTime = if configServerTimingEnabled then
      Auth.getJwtDur req else Nothing`). v16.0 deleted `Auth.middleware` and
      measures JWT verification inline with the same `withTiming` combinator
      used by the other four stages (the anchored line), so the metric is still
      present exactly when `server-timing-enabled` is true.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L159

entries:
  # -------------------------------------------------------------------------
  # Server-Timing header
  # -------------------------------------------------------------------------
  - id: observability.server_timing.metrics_present
    claim: >
      When `server-timing-enabled` is true, a successful response carries a
      `Server-Timing` header whose value lists the metrics
      `jwt`, `parse`, `plan`, `transaction`, `response` (in that order),
      each rendered as `<name>;dur=<ms>` with millisecond precision (one
      decimal place). Present on GET (200), POST (201), PATCH (204), PUT (200),
      DELETE (204), and RPC (200) responses.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ServerTimingSpec.hs#L25
    source_line: 25
    case_ids: [1750, 1751, 1752, 1753, 1754, 1755]

  - id: observability.server_timing.render_format
    claim: >
      serverTimingHeader renders the header by `BS.intercalate ", "` over the
      five metrics in the fixed order jwt, parse, plan, transaction, response
      (the anchored line, Performance.hs:35-41). Each present metric becomes
      "<name>;dur=<value>" where <value> uses one decimal of precision
      (showFFloat (Just 1), Performance.hs:34). The module doctest pins the
      exact output: "jwt;dur=0.4, parse;dur=0.5, plan;dur=0.1,
      transaction;dur=0.2, response;dur=0.3" (Performance.hs:28-29). The
      durations are MILLISECONDS, not seconds: `withTiming` uses
      PostgREST.TimeIt.timeItT, which multiplies the monotonic-clock delta by
      1000 (TimeIt.hs:18) — so `showFFloat (Just 1)` yields exactly one
      fractional digit of a millisecond value.
      ON THE WIRE THE HEADER ALWAYS CARRIES EXACTLY THE FIVE METRICS. All five
      stages are unconditionally timed when server-timing-enabled is true —
      jwt (App.hs:159), parse (App.hs:209), plan (App.hs:210), transaction
      (App.hs:225) and response (App.hs:238) — so every field of the
      ServerTiming record is `Just`; and error responses carry no Server-Timing
      header at all (see observability.server_timing.success_path_only). There
      is therefore no reachable wire state in which fewer than five metrics
      appear, including OPTIONS (see
      observability.server_timing.options_subset). Case 1770 pins that exact
      string.
      Consequently `renderMetric`'s `maybe ""` branch (Performance.hs:34) — "a
      metric whose duration is Nothing renders as the empty string" — is
      code-accurate but UNREACHABLE on the wire. Do NOT read it as licence to
      emit a three-metric header. And note that if a metric ever were `Nothing`,
      `BS.intercalate ", "` still emits that element's separators, so the value
      would degrade to `jwt;dur=X, parse;dur=Y, , , response;dur=Z` — the
      separators are never dropped along with the metric.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response/Performance.hs#L35
    source_line: 35
    case_ids: [1750, 1770]

  - id: observability.server_timing.root_spec
    claim: >
      The root spec (HEAD /) also emits the full set of Server-Timing metrics
      (jwt, parse, plan, transaction, response) when server-timing is enabled.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ServerTimingSpec.hs#L77
    source_line: 77
    case_ids: [1756]

  # NOTE: the entry id is historical ("options_subset"). There is NO subset —
  # see the claim. The id is kept stable so earlier references still resolve.
  - id: observability.server_timing.options_subset
    claim: >
      On OPTIONS requests upstream asserts only that the `jwt`, `parse` and
      `response` metrics are PRESENT; `plan` and `transaction` are ALSO emitted
      (with near-zero durations) because no stage is skipped. `withTiming`
      branches solely on `configServerTimingEnabled` (the anchored line,
      App.hs:272-279) — it has no per-action branch — and BOTH the plan stage
      (App.hs:210) and the transaction stage (App.hs:225) are wrapped in it for
      every action, OPTIONS included. For OPTIONS, `Plan.actionPlan` returns
      `NoDb (RelInfoPlan | RoutineInfoPlan | SchemaInfoPlan)` (Plan.hs:173 /
      174 / 177) and `MainTx.mainTx` returns `NoDbTx` (MainTx.hs:87), so no
      read plan is built and no database transaction is opened — but both
      stages are still timed, so `planTime` and `txTime` are `Just t` and
      `serverTimingHeader` renders all five metrics. A real v16.0
      `OPTIONS /organizations` response therefore contains `plan;dur=` and
      `transaction;dur=`. Upstream's ServerTimingSpec.hs:87-111 asserts only
      presence of jwt/parse/response, and its matcher
      `matchServerTimingHasTiming` (SpecHelper.hs:76-82) is a presence-only
      regex over the header value — it never asserts that a metric is absent.
      CORRECTION (v16.0 re-sync): an earlier pass of this file claimed `plan`
      and `transaction` were ABSENT on OPTIONS. That claim is FALSE. v14.12 had
      the identical control flow, so the error is inherited from the v14.12
      pass, not a v16.0 behavior change. `lib/bier/plugs/observability.ex:159`
      currently implements the wrong (three-metric) behavior.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L272
    source_line: 272
    upstream_assertion_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ServerTimingSpec.hs#L87
    matcher_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/SpecHelper.hs#L76
    case_ids: [1757, 1768, 1769]

  - id: observability.server_timing.disabled_default
    claim: >
      `server-timing-enabled` defaults to false; when false the `Server-Timing`
      header is omitted entirely — App.hs only appends it when
      configServerTimingEnabled is true, and `withTiming` returns Nothing for
      every stage in that case so no timing is computed either.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L256
    source_line: 256
    case_ids: [1758]

  - id: observability.server_timing.transaction_accuracy
    claim: >
      The `transaction` duration in Server-Timing reflects the wall-clock time
      spent in the database transaction: an RPC that sleeps for 2 seconds
      reports a transaction duration in the range [2000ms, 3000ms). (In v16.0
      this io test moved to test_settings.py and runs under a role with a 3 s
      statement timeout.)
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_settings.py#L462
    source_line: 462
    case_ids: [1759]

  - id: observability.server_timing.success_path_only
    claim: >
      The Server-Timing header is appended by `toWaiResponse`, which is only
      reached on the success path of `postgrestResponse`. An error
      short-circuits the ExceptT and its response is built by
      `Error.errorResponseFor` (App.hs:154), which never adds Server-Timing —
      so error responses (e.g. 400/404/500) carry no Server-Timing header even
      when server-timing-enabled is true.
    response_header: Server-Timing
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L253
    source_line: 253
    case_ids: []   # source-derived, not asserted upstream — see gaps

  # -------------------------------------------------------------------------
  # Server version header
  # -------------------------------------------------------------------------
  - id: observability.server.version_header
    claim: >
      Every response carries a `Server` header whose value is the literal
      prefix "postgrest/" concatenated with the running version. It is set once
      as a Warp server setting (`setServerName ("postgrest/" <> prettyVersion)`,
      App.hs:143), NOT per-response, so it is unconditional: it does not depend
      on method, status, content type, or any config key, and it is present on
      error responses and on the admin server's responses alike. The version
      component is `prettyVersion` = the first TWO dot-separated components of
      the build's package version, plus " (pre-release)" for pre-release builds
      (Version.hs:23-26) — e.g. `Server: postgrest/16.0`. Upstream never
      hard-codes the digits: test_io.py reads the header back and derives the
      expected version FROM it (test_io.py:1065 splits on "/", :1038 and :1056
      rewrite "postgrest/" to "PostgREST "), so only the prefix is a fixed
      contract.
    response_header: Server
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L143
    source_line: 143
    source_test: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1065
    source_docs: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/observability.rst#L283
    case_ids: [1771]

  # -------------------------------------------------------------------------
  # server-trace-header (request-id echo)
  # -------------------------------------------------------------------------
  - id: observability.trace_header.echo
    claim: >
      When `server-trace-header` names a request header (e.g. X-Request-Id),
      the value of that incoming request header is copied verbatim onto the
      response under the same header name. Asserted for the root spec
      (ObservabilitySpec.hs:18), a table read (ObservabilitySpec.hs:25) and an
      RPC call (ObservabilitySpec.hs:32).
    request_header: X-Request-Id
    response_header: X-Request-Id
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/ObservabilitySpec.hs#L17
    source_line: 17
    case_ids: [1760, 1761, 1762]

  - id: observability.trace_header.middleware_gate
    claim: >
      traceHeaderMiddleware is a no-op when `server-trace-header` is unset
      (Nothing -> app req respond, App.hs:286); no such header is added to the
      response. It is the OUTERMOST middleware (it wraps Cors.middleware), so
      it also stamps responses that never reach the request pipeline.
    response_header: X-Request-Id
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L286
    source_line: 286
    case_ids: [1763]

  - id: observability.trace_header.missing_value
    claim: >
      When `server-trace-header` IS set but the request did not supply that
      header, the middleware still adds it to the response with an EMPTY value
      (`fromMaybe mempty hdrVal`).
    response_header: X-Request-Id
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L289
    source_line: 289
    case_ids: []   # needs a dedicated variant instance — see gaps

  # -------------------------------------------------------------------------
  # log-level (access log filtering) and the access-log line
  # -------------------------------------------------------------------------
  - id: observability.log_level.filter
    claim: >
      `log-level` filters which responses get an access-log line, by status:
      crit logs nothing (const False); error logs only >= 500; warn logs only
      >= 400; info and debug log everything. The same predicate
      (shouldLogResponse) gates the QueryObs SQL log.
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L62
    source_line: 62
    case_ids: [1764, 1765, 1766, 1767]

  - id: observability.log.access_log_format
    claim: >
      Access-log lines go to STDOUT in the Apache "combined" format, vendored
      from wai-logger: `<remote-host> - <user> [<dd/Mon/yyyy:HH:MM:SS ±zzzz>]
      "<METHOD> <path+query> <HTTP/x.y>" <status> <bytes> "<referer>"
      "<user-agent>"`. The user field is the authenticated role, rendered as
      "-" when no role was resolved (e.g. a request that fails before auth);
      the byte count is the response Content-Length, rendered as "-" when
      absent. Referer/User-Agent render as empty strings when absent. The io
      test pins e.g.
      `- - postgrest_test_anonymous [..] "GET /unknown HTTP/1.1" 404 <n> "" "python-requests/.."`.
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger/Apache.hs#L20
    source_line: 20
    case_ids: [1764, 1765, 1766]

  - id: observability.log.access_log_from_response_observation
    claim: >
      The access-log line is emitted from the `ResponseObs` observation, which
      carries (maybe authenticated role, the Wai request, the status, the
      response Content-Length). It is written with `putStr` — i.e. to stdout,
      unlike every other observation, which goes to stderr with a
      "dd/Mon/yyyy:HH:MM:SS ±zzzz: " prefix.
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L95
    source_line: 95
    case_ids: []   # stdout-only; see gaps

  - id: observability.log.cors_preflight_not_logged
    claim: >
      A plain OPTIONS request produces an access-log line, but a CORS preflight
      (OPTIONS carrying Origin + Access-Control-Request-Method) does NOT — the
      Cors middleware answers it before the app runs, so no ResponseObs is
      emitted. At log-level=info, one plain OPTIONS plus one preflight yields
      exactly ONE log line.
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L836
    source_line: 836
    case_ids: []   # stdout-only; see gaps

  - id: observability.log_level.values
    claim: >
      Valid `log-level` values are crit, error, warn, info, debug (parsed
      case-sensitively from the config string). Only an ABSENT value (Nothing)
      falls back to the default LogError (Config.hs:405); an UNRECOGNIZED value
      does NOT fall back — parseLogLevel's `Just _` branch calls
      `fail "Invalid logging level. Check your configuration."`
      (Config.hs:411), aborting startup. The same five values are rendered back
      by dumpLogLevel (Config.hs:132-138).
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L411
    source_line: 411
    case_ids: [1712, 1723]   # covered by the config area's CLI dump cases

  - id: observability.log_level.reloadable
    claim: >
      NEW in v16.0: observationLogger reads the log level per observation
      (`logLevel <- getLogLevel loggerState`) rather than closing over a
      startup value, so a `log-level` change picked up by a config reload
      (SIGUSR2 / in-db config) takes effect on the very next request with no
      restart — e.g. switching error -> debug starts emitting
      "Trying to borrow a connection from pool".
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L72
    source_line: 72
    case_ids: []   # process-signal + stdout scraping; see gaps

  - id: observability.log_query.emits_sql
    claim: >
      `log-query` (default false) causes the executed SQL statements to be
      logged: the tx-vars snippet, the optional pre-request, the main query,
      the three OpenAPI queries and the optional EXPLAIN, each flattened onto a
      single line, skipping empty snippets. The gate is
      `when configLogQuery $ observer $ QueryObs mainQ s` (App.hs:223), and
      whether a given request's query is logged still obeys log-level: QueryObs
      uses the same shouldLogResponse status filter as the access log
      (Logger.hs:86-88). The anchored line is the QueryObs rendering itself:
      the seven snippets (mqTxVars, mqPreReq, mqMain, the three mqOpenAPI
      queries, mqExplain) are rendered, the empty ones dropped, and each
      remaining one flattened with showOnSingleLine (Logger.hs:192-195).
    config_key: log-query
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L192
    source_line: 192
    case_ids: []   # stderr-only; see gaps

  - id: observability.log.pool_debug_observations
    claim: >
      Pool and cache lifecycle observations are only logged when log-level is
      debug (>= LogDebug): PoolRequest "Trying to borrow a connection from
      pool", PoolRequestFullfilled "Borrowed a connection from the pool",
      HasqlPoolObs ("Connection <uuid> is being established / is available due
      to <reason> / is used / is terminated due to <reason>"), PoolFlushed
      "Database connection pool flushed", JwtCacheLookup "Looked up a JWT in
      JWT cache", JwtCacheEviction "Evicted entry from JWT cache" and
      WarpServerObs "Warp server: <txt>".
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L89
    source_line: 89
    case_ids: []   # stderr-only debug observations; see gaps

  - id: observability.log.pool_acq_timeout_debounced
    claim: >
      PoolAcqTimeoutObs is logged at log-level >= error, through a debouncer:
      the first timeout logs immediately and, if more timeouts arrive during
      the 5-second cooldown, exactly one more line is logged afterwards. Six
      concurrent timing-out requests therefore produce 6 access-log lines
      (504s) but only 2 "Timed out acquiring connection from connection pool."
      diagnostic lines.
    config_key: db-pool-acquisition-timeout
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L57
    source_line: 57
    case_ids: []   # stderr-only; see gaps

  - id: observability.log.json_error_to_stderr
    claim: >
      Database-client / schema-cache errors are logged to stderr as a JSON
      object with keys code, details, hint, message (that key order). Examples:
      a dropped connection logs
      {"code":"PGRST001","details":"no connection to the server\n","hint":null,
      "message":"Database client error. Retrying the connection."}
      (test_pgrst_log_503_client_error_to_stderr, test_io.py:1224; literal at
      :1238) and an empty schema cache on startup logs
      {"code":"PGRST002","details":null,"hint":null,"message":"Could not query
      the database for the schema cache. Retrying."}
      (test_log_error_when_schema_cache_load_error_on_startup_to_stderr,
      test_io.py:1243; literal at :1266).
    # Two distinct upstream tests back the two examples; both are anchored.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1238
    source_line: 1238
    source_pgrst002: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1266
    source_pgrst002_line: 1266
    case_ids: []

  - id: observability.log.stderr_diagnostics_always_verbose
    claim: >
      Server diagnostics are rendered with `Error.errorPayload Verbose`
      unconditionally — the v16.0 `client-error-verbosity` config only affects
      the HTTP error body sent to clients, never the stderr log payload. So a
      PGRST00x diagnostic line always carries all four keys (code, message,
      details, hint) even when client-error-verbosity is minimal.
    config_key: client-error-verbosity
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L249
    source_line: 249
    case_ids: []

  - id: observability.log.schema_cache_load_lines
    claim: >
      A successful schema-cache load emits TWO stderr lines from a single
      SchemaCacheLoadedObs: "Schema cache loaded <summary>" followed by
      "Schema cache loaded in <ms> milliseconds" (one decimal). In v14.12 the
      first line came from a separate SchemaCacheSummaryObs observation.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L168
    source_line: 168
    case_ids: []

  - id: observability.log.schema_cache_query_timings
    claim: >
      SchemaCacheQueriedObs logs "Schema cache queried in <ms> milliseconds "
      and, when per-query timings are present (log-level=debug only), a second
      line of labelled timings joined with ", " in the form
      "tables: <n> ms, keydeps: <n> ms, rels: <n> ms, funcs: <n> ms,
      comprels: <n> ms, dreps: <n> ms, mhandlers: <n> ms". Exactly one such
      line is emitted per startup at debug, and none at any other level.
    config_key: log-level
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L164
    source_line: 164
    case_ids: []

  - id: observability.log.legacy_target_name_warning
    claim: >
      NEW in v16.0: when `url-use-legacy-target-names` is true and a request
      filters/orders/limits an embedded resource by its relation name although
      an alias was given, two stderr lines are logged —
      "WARNING: Embedded resource was referenced by relation name even though
      it has an alias. This is deprecated and will stop working in a future
      release." and "Update filters, orders or limits that use `<rel>` to
      `<alias>`[, ...] in `<METHOD> <path+query>`". With the config off the
      request is a 400 and neither line is logged.
    config_key: url-use-legacy-target-names
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L196
    source_line: 196
    case_ids: []   # log-only half; the Warning response header is select-area

  # -------------------------------------------------------------------------
  # Prometheus metrics (admin /metrics endpoint)
  # -------------------------------------------------------------------------
  - id: observability.metrics.admin_endpoint
    claim: >
      The admin server exposes GET /metrics returning HTTP 200 with
      Content-Type "text/plain; charset=utf-8" (required for Prometheus
      compliance) and a Prometheus text-format body. The body includes at
      least: pgrst_db_pool_max, pgrst_db_pool_waiting, pgrst_db_pool_available,
      pgrst_db_pool_timeouts_total, pgrst_schema_cache_query_time_seconds and
      pgrst_schema_cache_loads_total{status="SUCCESS"} (test_admin.py:132-144).
      Any other path on the admin server is 404 — `Admin.hs`'s path dispatch
      falls through to `respond $ Wai.responseLBS HTTP.status404 [] mempty`
      (Admin.hs:67-68), asserted by test_admin.py:84-89
      (`test_admin_not_found`).
    config_key: admin-server-port
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_admin.py#L138
    source_line: 138
    case_ids: []

  - id: observability.metrics.names
    claim: >
      The registered PostgREST metrics and their types are:
      pgrst_db_pool_timeouts_total (counter), pgrst_db_pool_available (gauge,
      derived as connected - inUse), pgrst_db_pool_waiting (gauge),
      pgrst_db_pool_max (gauge, set from db-pool at init),
      pgrst_schema_cache_loads_total{status} (labelled counter; status is
      SUCCESS or FAIL), pgrst_schema_cache_query_time_seconds (gauge),
      pgrst_jwt_cache_requests_total (counter), pgrst_jwt_cache_hits_total
      (counter), pgrst_jwt_cache_evictions_total (counter).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Metrics.hs#L50
    source_line: 50
    case_ids: []

  - id: observability.metrics.schema_cache_loads_counts_once
    claim: >
      pgrst_schema_cache_loads_total{status="SUCCESS"} increments once per
      successful schema-cache load. Booting against an EMPTY schema cache
      (INTERNAL_SCHEMA_CACHE_QUERY_SLEEP=300, so the first request is refused
      at the socket and raises ConnectionError, test_io.py:1282-1283) still
      loads the cache exactly once: after the retry window the read returns 200
      and /metrics reports exactly `1.0`. A schema-cache load failure increments
      the status="FAIL" label instead (SchemaCacheErrorObs).
    # NOTE: the enclosing test is test_no_double_schema_cache_reload_on_empty_schema
    # (test_io.py:1271). An earlier revision of this entry said "even after a 503
    # empty-cache response" — that is a DIFFERENT test
    # (test_log_error_when_schema_cache_load_error_on_startup_to_stderr,
    # test_io.py:1243, 503 asserted at :1262), which makes no metrics assertion.
    # The claim above is scoped to what test_io.py:1271-1293 actually exercises.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1271
    source_line: 1271
    source_assertion: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1293
    case_ids: []

  - id: observability.metrics.pool_available_non_negative
    claim: >
      pgrst_db_pool_available is computed as connected - inUse from tracked
      pool connection observations (not statelessly), and stays >= 0 even when
      the database connection keeps failing at the network level.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1430
    source_line: 1430
    case_ids: []

  - id: observability.metrics.ghc_runtime_optional
    claim: >
      NEW in v16.0: GHC runtime metrics (ghc_gcs_total, ghc_major_gcs_total,
      ghc_allocated_bytes_total, ghc_max_live_bytes, ghc_max_mem_in_use_bytes,
      ghc_mutator_cpu_seconds_total, ghc_gc_cpu_seconds_total,
      ghc_elapsed_seconds_total — the full list is enumerated only in the docs,
      docs/references/observability.rst:271-278) are registered on /metrics
      only when the process is started with RTS statistics enabled
      (`whenM getRTSStatsEnabled $ void $ register PMG.ghcMetrics`,
      Metrics.hs:48, i.e. `postgrest +RTS -T -RTS`). The io tests assert two of
      them present under `+RTS -T -RTS` with their HELP/TYPE preamble
      (test_admin.py:147-158) and both absent by default
      (test_admin.py:161-168).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_admin.py#L147
    source_line: 147
    docs_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/observability.rst#L271
    case_ids: []

# Behaviors observed in PostgREST but NOT turned into black-box conformance
# cases here, because the conformance runner (per AGENT_PLAN.md §5.1) is an
# in-process HTTP harness with no admin server, no stdout/stderr capture, no
# process signals, and a frozen list of per-case config variant instances.
# These are tracked so the Tester / Developer can decide where they belong
# (io-level tests, not request/response cases).
gaps:
  - >
    observability.metrics.* (admin /metrics endpoint, metric names, schema
    cache load count, pool-available non-negativity, GHC RTS metrics): served
    by the separate admin server (admin-server-port), not the main API. The
    conformance harness only knows the main API base URL, so no case can reach
    /metrics; these need io-level tests with a Prometheus text parser. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_admin.py#L132
  - >
    observability.log_level access-log assertions (line format, user field,
    byte count, per-level counts) depend on scraping the process's stdout
    line-by-line (test_io.py read_stdout/drain_stdout). Cases 1764-1767 assert
    only the request/response contract (the status codes the filter keys on);
    the actual log-line emission must be verified at the io level. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L523
  - >
    HARNESS LIMITATION — cases 1765, 1766 and 1767 declare
    `config: {log-level: warn|info|crit}` but that block is INERT: the frozen
    harness boots a dedicated instance only for the ids in
    `Bier.ConformanceServer.@variant_case_ids`
    (test/support/conformance_server.ex:58), which carries only 1758, 1763 and
    1764 from the 1750-1799 band. All three therefore run against the shared
    instance's `log_level: :error` and assert only a status that is independent
    of log-level. They are sound but narrower than their names suggest; each
    case's `notes` now says so explicitly. Making them actually exercise
    log-level needs BOTH the `needed_assertion: log_capture` support below and
    their ids added to `@variant_case_ids` — the latter is frozen harness code
    the spec pass may not touch. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L523
  - >
    observability.log.cors_preflight_not_logged: distinguishing "one plain
    OPTIONS logged" from "preflight not logged" requires counting stdout lines;
    both requests return 200 on the wire, so there is no request/response
    signal. No conformance case. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L812
  - >
    observability.log_query.emits_sql: log-query=true emits the executed SQL to
    stderr (gated by log-level via shouldLogResponse). No request/response
    signal; verified by scraping the process output. No conformance case.
    Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L586
  - >
    observability.log.pool_debug_observations and
    observability.log.pool_acq_timeout_debounced: PoolRequest /
    PoolRequestFullfilled / HasqlPoolObs / PoolFlushed / JWT-cache observations
    are logged only at log-level=debug, and the acquisition-timeout debounce is
    a line-count assertion over a 5 s cooldown. Both are process-output only.
    Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L450
  - >
    observability.log_level.reloadable: needs SIGUSR2 (or an in-db config
    NOTIFY) plus stdout scraping to observe that debug lines start appearing.
    The harness boots instances via Bier.start_link/1 and has no reload signal
    path. io-level. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1463
  - >
    observability.log.json_error_to_stderr,
    observability.log.stderr_diagnostics_always_verbose,
    observability.log.schema_cache_load_lines and
    observability.log.schema_cache_query_timings: require capturing the process
    stderr and inducing PGRST001/PGRST002 (dropped DB connection / empty schema
    cache on startup) or a debug-level startup. Not expressible as a
    request->response conformance case. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1224
  - >
    observability.log.legacy_target_name_warning: only the two WARNING stderr
    lines belong to this area and they are process-output only. The matching
    `Warning: 299 PostgRESTv<ver> "..."` RESPONSE header IS black-box
    observable but is owned by the select/embedding area (asserted at
    test/spec/Feature/Query/QuerySpec.hs#L1187, config
    url-use-legacy-target-names). Recorded here so it is not lost. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_io.py#L1434
  - >
    observability.trace_header.missing_value: PostgREST echoes the configured
    trace header with an EMPTY value when the request omits it. A case for this
    cannot be added under the current frozen harness: the shared conformance
    instances set server_trace_header, and case 1573 (headers area) asserts
    `headers_no_blank: true` on that same instance, so the two assertions would
    contradict each other. It needs its own variant instance, and
    Bier.ConformanceServer's `@variant_case_ids` list is frozen harness code.
    Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L289
  - >
    observability.server_timing.success_path_only: derived from the App.hs
    control flow (errors are rendered by Error.errorResponseFor at App.hs#L154
    and never reach toWaiResponse at App.hs#L253), but NOT asserted by any
    upstream PostgREST test. Left without a conformance case so the suite does
    not pin a behavior upstream never checks; promote to a case if the operator
    wants it enforced. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L154
  - >
    needed_assertion: log_capture — the whole "log format / log-level /
    log-query" half of this area is unassertable today. A case would need an
    expectation style like `expect.stdout_matches` / `expect.stderr_matches`
    (regex list, plus a line-count bound) evaluated against the instance's
    captured log output for the duration of the request. Every entry above
    whose case_ids is empty for a "stdout-only"/"stderr-only" reason becomes
    expressible the moment that exists. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Logger.hs#L95
  - >
    needed_assertion: admin_endpoint_request — the metrics entries need a
    request shape that targets the ADMIN server rather than the API server
    (e.g. `request.kind: admin` + path /metrics), plus a body assertion able to
    match Prometheus text-format samples (`body_matches` regex list would
    suffice). Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Admin.hs#L64
  - >
    server-timing transaction-duration accuracy (>=2000ms for a 2 s sleep) is
    captured as case 1759, but its duration-range assertion is timing-sensitive
    and is best validated at the io level; upstream runs it under a role with a
    3 s statement timeout, which the harness cannot configure per case. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_settings.py#L437
  - >
    v16.0 re-sync note (not a gap in coverage, a gap in what upstream asserts):
    the exact Server-Timing rendering — ", " between metrics and EXACTLY one
    fractional digit per duration — is pinned only by the Performance.hs module
    doctest, never by a Feature spec (matchServerTimingHasTiming's regex
    `<name>;dur=[[:digit:]]+.[[:digit:]]+` at SpecHelper.hs:79 accepts any
    number of decimals and any separator). Case 1770 asserts the doctest form
    directly with an anchored regex; if it is ever found to over-constrain a
    real PostgREST response, the doctest is the line to re-read. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/SpecHelper.hs#L79
  - >
    CORRECTED CLAIM (carried here so implementers see it): earlier passes of
    this area asserted that OPTIONS responses omit the `plan` and `transaction`
    Server-Timing metrics. That is FALSE at v16.0 and was equally false at
    v14.12 — `withTiming` has no per-action branch (App.hs#L272-L279), so all
    five metrics are emitted on OPTIONS. Cases 1757/1768/1769 no longer carry
    `headers_absent_in_value`. `lib/bier/plugs/observability.ex:159` still
    implements the three-metric OPTIONS behavior and must be fixed by the
    conformance pass; no case pins the five-metric OPTIONS shape because
    upstream asserts only presence of jwt/parse/response
    (ServerTimingSpec.hs#L87-L111) and this area does not pin behavior upstream
    never checks. Source:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L272
