# ===========================================================================
# Gaps: behaviors in scope but not traceable to a concrete v16.0 source line,
# plus behavior that existed at the previous pin and no longer exists.
# ===========================================================================
gaps:
  - "DROPPED (v16.0): the JSPath DSL form of `jwt-role-claim-key` no longer
     parses. Values without a leading `$` (e.g. `.role`, `.postgrest.a_role`)
     are now startup errors — `.role.other` is listed among
     `invalidroleclaimkeys` (test/io/fixtures/fixtures.yaml#L189). The
     v14.12 entry `role_claim_key_default: \".role\"` was therefore replaced by
     `$.role`, not merely re-anchored."
  - "DROPPED (v16.0): the JSPath string-comparison operators `^==`, `==^` and
     `*==` were removed with the DSL (CHANGELOG.md#L91). Their v14.12 io
     fixtures are gone. The RFC 9535 replacement is
     `$.roles[?search(@, \"^postgrest_test_\")]`, but v16.0 ships NO fixture or
     test exercising `search()` end-to-end, so no case was authored for it."
  - "NOTE: `src/library/PostgREST/Config.hs#L753` still prints
     `jwt-role-claim-key = \".role\"` in the `--example` config template — an
     upstream staleness bug, contradicted by the real default at
     Config/JSPath.hs#L33 and by every expected --dump-config fixture
     (test/io/configs/expected/defaults.config#L29 = `$$.role`). The v14.12
     spec cited that example line for the default; this re-sync cites the
     implementation instead."
  - "ES256 verification: jose/JWKS supports it (Config.hs#L538 accepts a JWKS),
     but v16.0 still has no ES256 conformance test in test/spec/Feature/Auth.
     Only HS256 (AuthSpec/BinaryJwtSecretSpec) and RS256 (AsymmetricJwtSpec,
     now both JWK and JWKS forms) are test-anchored. No black-box case authored
     for ES256."
  - "EdDSA (Ed25519) verification: same as ES256 — library-supported via the
     JWKS path but no upstream conformance test in v16.0. Omitted, not guessed."
  - "JWKS multi-key rotation / kid selection: KeyError 'No suitable key' is
     defined (Error.hs#L659) but no v16.0 Feature/Auth test exercises kid
     matching against a multi-key JWKS — the new JWKSet context uses a
     single-key set. Omitted."
  - "JWTNotYetValid / JWTIssuedAtFuture (nbf/iat numerically in the future):
     error variants exist (Error.hs#L667-L668) and the 30s skew window is in
     source (Auth/Jwt.hs#L64), but no v16.0 test asserts the live behavior for a
     future nbf/iat value. Only the 'not a number' validation and (new in
     v16.0) the valid-iat happy path are test-anchored."
  - "needed_assertion: repeat-request. Feature/Auth/JwtCacheSpec.hs asserts
     properties across TWO identical requests (second JWT parse duration <= the
     first; both succeed). case.schema.json has no way to express 'issue this
     request N times and compare responses', so case 1497 pins only the
     single-shot 200. An assertion style like `repeat: 2` plus per-response
     assertions (or a `header_monotonic` comparator on Server-Timing) would be
     needed to cover the cache-hit behavior."
  - "harness: the new cases 1495-1499 and 11800-11808 all carry a per-case
     `config:` block (jwt-role-claim-key / jwt-aud / jwt-secret /
     jwt-cache-max-entries / server-timing-enabled). test/support/
     conformance_server.ex spins a dedicated instance only for ids listed in its
     hard-coded `@variant_case_ids`, so these ids must be added there (harness
     owner) before they can run. Case 1495 additionally needs the symbolic
     jwt-secret value `asymmetric_jwks_public_key` registered next to the
     existing `asymmetric_jwk_public_key` (the same RS256 public JWK wrapped as
     `{\"keys\": [ ... ]}`)."
  - "Upstream AuthSpec pins exact `Content-Length` values on three responses
     (96 on the anon 42501 401, 97 on the authenticated 42501 403, 100 on the
     empty-JWT PGRST301 401 — AuthSpec.hs#L24, #L37, #L102). These matchers
     already existed at the v14.12 pin and were not carried into cases
     1450/1451/1455, so this re-sync left them alone rather than widening scope;
     they remain an available strengthening of those three cases."
  - "loader_exposure: none required. Every new case reuses objects the loader
     already builds for the `auth` label (auth.authors_only); no new fixture
     object and no new fixture-set label were needed, so no
     spec/conformance/fixtures/auth.delta.sql was written."
