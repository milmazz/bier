# Behavior model: auth (JWT verification, role switching, GUCs)
# PostgREST version pinned: v16.0  (re-synced from v14.12)
#
# Every entry carries a `source` URL with a line anchor into PostgREST's own
# test suite or source. Behaviors that could not be traced to a real source
# line are recorded under `gaps` at the bottom, NOT invented.
#
# Ground-truth priority: PostgREST tests > PostgREST source > docs.
#
# NOTE on source paths: v16.0 moved the library sources from `src/PostgREST/**`
# to `src/library/PostgREST/**`, and split the error ADTs out into
# `src/library/PostgREST/Error/Types.hs`. Every `src/` anchor below was
# re-verified against the v16.0 tree, not mechanically rewritten.

area: auth
version: v16.0

# ===========================================================================
# JWT signature verification & supported algorithms
# ===========================================================================
jwt_verification:
  # The Authorization header carries `Bearer <token>`; both "Bearer" and
  # "bearer" scheme spellings are accepted.
  bearer_scheme_case_insensitive:
    accepted: ["Bearer", "bearer"]
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L234
  algorithms:
    # jwt-secret is parsed as a JWKS, a single JWK, or (fallback) a symmetric
    # HS* secret. A plain text secret yields an HS256 SymmetricJwk.
    symmetric_text_secret_is_hs256: true
    symmetric_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L555
    # A symmetric (HS*) secret must be at least 32 characters long.
    symmetric_min_length: 32
    symmetric_min_length_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L557
    # HS256 verification of a token signed with the configured text secret.
    hs256_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L82
    # A binary (base64) symmetric secret also verifies an HS256 token.
    binary_secret_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/BinaryJwtSecretSpec.hs#L21
    # Asymmetric verification: a token signed with RS256 verifies against the
    # configured public JWK (server started with an asymmetric JWK).
    rs256_asymmetric_jwk_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AsymmetricJwtSpec.hs#L28
    # NEW in v16.0: the same RS256 token also verifies when jwt-secret is a JWK
    # *Set* (`{"keys":[ ... ]}`) rather than a bare JWK. v14.12 only exercised
    # the bare-JWK form.
    rs256_asymmetric_jwks_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AsymmetricJwtSpec.hs#L37
    # jwt-secret accepts a JWK or a JWKS (JSON Web Key Set) document; the JWKS
    # form is used as-is so ES256 / EdDSA / multi-key sets are supported by the
    # underlying jose library. Only RS256/HS256 are exercised by upstream tests;
    # ES256/EdDSA are library-supported but not test-anchored (see gaps).
    jwks_accepted: true
    jwks_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L538
  cache:
    # jwt-cache-max-entries (default 1000) caches verified claim sets. Its only
    # black-box observable is that requests keep working with the cache on;
    # v16.0 added Feature/Auth/JwtCacheSpec.hs, which asserts (a) the `jwt`
    # Server-Timing metric is emitted for cached tokens with and without `exp`
    # and (b) requests still succeed when server-timing is disabled.
    config_key: jwt-cache-max-entries
    default: 1000
    default_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L310
    works_with_server_timing_disabled:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/JwtCacheSpec.hs#L55
    server_timing_metric_with_exp:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/JwtCacheSpec.hs#L20
    server_timing_metric_without_exp:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/JwtCacheSpec.hs#L35
  errors:
    # No JWT secret configured but a token is presented -> 500 PGRST300.
    secret_missing: {status: 500, code: PGRST300, message: "Server lacks JWT secret"}
    secret_missing_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/NoJwtSecretSpec.hs#L21
    # Empty token in Authorization header -> 401 PGRST301.
    empty_token: {status: 401, code: PGRST301, message: "Empty JWT is sent in Authorization header"}
    empty_token_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L94
    # Token without exactly 3 dot-separated parts -> 401 PGRST301, message
    # "Expected 3 parts in JWT; got N".
    wrong_parts: {status: 401, code: PGRST301, message: "Expected 3 parts in JWT; got 2"}
    wrong_parts_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L117
    # All PGRST301 / PGRST303 decode/claims errors carry a WWW-Authenticate
    # header: Bearer error="invalid_token", error_description="<message>".
    invalid_token_header_format: 'Bearer error="invalid_token", error_description="<message>"'
    invalid_token_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L684
  error_codes:
    # Canonical JWT error code -> message map (source of truth). Unchanged
    # between v14.12 and v16.0; only the file location moved.
    PGRST300: "Server lacks JWT secret"
    PGRST301: "Empty JWT is sent in Authorization header | Expected 3 parts in JWT; got N | No suitable key or wrong key type | Wrong or unsupported encoding algorithm | JWT cryptographic operation failed | Unsupported token type | JWT couldn't be decoded"
    PGRST302: "Anonymous access is disabled"
    PGRST303: "JWT expired | JWT not yet valid | JWT issued at future | JWT not in audience | Parsing claims failed | The JWT 'exp' claim must be a number | The JWT 'nbf' claim must be a number | The JWT 'iat' claim must be a number | The JWT 'aud' claim must be a string or an array of strings"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L649
    # The error ADTs themselves moved to their own module in v16.0.
    types_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error/Types.hs#L91

# ===========================================================================
# Standard-claim validation (exp / nbf / iat / aud) -> all PGRST303
# ===========================================================================
claim_validation:
  # All time claims are compared against `now` with a fixed 30-second clock-skew
  # allowance: `exp` fails only when now - 30s > exp; `nbf`/`iat` fail only when
  # now + 30s < claim.
  clock_skew_seconds: 30
  clock_skew_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Auth/Jwt.hs#L64
  # Expired token (exp in the past) -> 401 PGRST303 "JWT expired".
  expired: {status: 401, code: PGRST303, message: "JWT expired"}
  expired_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L106
  # A far-future exp verifies.
  unexpired_ok:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L82
  # NEW in v16.0: a numeric iat that is not in the future verifies.
  iat_valid_ok:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L87
  # exp claim present but not a number -> 401 PGRST303.
  exp_not_number: {status: 401, code: PGRST303, message: "The JWT 'exp' claim must be a number"}
  exp_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L145
  # nbf claim present but not a number -> 401 PGRST303.
  nbf_not_number: {status: 401, code: PGRST303, message: "The JWT 'nbf' claim must be a number"}
  nbf_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L157
  # iat claim present but not a number -> 401 PGRST303.
  iat_not_number: {status: 401, code: PGRST303, message: "The JWT 'iat' claim must be a number"}
  iat_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L169
  # aud as a single non-string value -> 401 PGRST303.
  aud_not_string: {status: 401, code: PGRST303, message: "The JWT 'aud' claim must be a string or an array of strings"}
  aud_not_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L181
  # aud as an array with a non-string element -> 401 PGRST303.
  aud_array_non_string: {status: 401, code: PGRST303, message: "The JWT 'aud' claim must be a string or an array of strings"}
  aud_array_non_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L193
  # A token with no claims at all -> 401 (no role claim to switch to).
  no_claims_unauthorized: {status: 401}
  no_claims_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L128
  # A token whose claims contain no `role` -> 401.
  no_role_claim_unauthorized: {status: 401}
  no_role_claim_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L133
  # Claim checks run in this order, all before role extraction.
  order: [exp, nbf, iat, aud]
  order_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Auth/Jwt.hs#L56

# ===========================================================================
# Audience (aud) handling, gated by the jwt-aud config option
# ===========================================================================
audience:
  config_key: jwt-aud
  config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L304
  # With jwt-aud unset, `audMatchesCfg` degenerates to `const True`, so every
  # aud value matches.
  unset_matches_everything_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L71
  # jwt-aud must parse as a string or a valid URI, else startup fails.
  invalid_value_message: "jwt-aud should be a string or a valid URI"
  invalid_value_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L459
  when_jwt_aud_set:
    # String aud matching the configured value -> 200.
    string_match_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L23
    # String aud not matching -> 401 PGRST303 "JWT not in audience".
    string_mismatch: {status: 401, code: PGRST303, message: "JWT not in audience"}
    string_mismatch_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L35
    # Empty string aud -> treated as a non-matching value -> 401.
    empty_string_mismatch: {status: 401, code: PGRST303, message: "JWT not in audience"}
    empty_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L49
    # Single-element array aud containing the configured value -> 200.
    array_single_match_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L64
    # Array aud containing the configured value (any position) -> 200.
    array_contains_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L76
    # Array aud not containing the configured value -> 401.
    array_no_match: {status: 401, code: PGRST303, message: "JWT not in audience"}
    array_no_match_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L103
    # Empty array aud -> audience ignored -> 200 (`null auds || any ...`).
    empty_array_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L117
    empty_array_impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Auth/Jwt.hs#L76
    # null aud -> audience ignored -> 200.
    null_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L129
    # Absent aud claim -> 200.
    absent_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L142
    # No JWT at all -> the audience check never runs -> 200.
    no_jwt_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L153
  when_jwt_aud_unset:
    # With no jwt-aud configured, any aud value is ignored -> 200.
    any_aud_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L160

# ===========================================================================
# Role switching & anonymous access
# ===========================================================================
role_switching:
  # BREAKING CHANGE in v16.0: `jwt-role-claim-key` no longer uses PostgREST's
  # own JSPath DSL; it is now standard RFC 9535 JSON Path. Every value must
  # start with `$`, keys with characters other than `_` must use the bracket
  # selector, and the DSL's string-comparison operators (`^==`, `==^`, `*==`)
  # are gone, replaced by `search(@, "<regex>")`.
  role_claim_key_default: "$.role"
  role_claim_key_default_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config/JSPath.hs#L33
  role_claim_key_default_applied_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L427
  role_claim_key_config: jwt-role-claim-key
  role_claim_key_config_alias: role-claim-key
  role_claim_key_config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L305
  role_claim_key_migration_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/CHANGELOG.md#L88
  # When the path matches several nodes, the FIRST is used.
  role_claim_key_first_match_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config/JSPath.hs#L51
  # An unparseable value aborts startup with a non-zero exit code and
  # "failed to parse role-claim-key value (<value>)" on stderr. Examples of
  # values that are invalid under v16.0: ".role.other" (missing `$`),
  # "$.my_role;;domain".
  role_claim_key_invalid_message: "failed to parse role-claim-key value (<value>)"
  role_claim_key_invalid_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_cli.py#L216
  role_claim_key_invalid_values_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L188
  # Role extraction: evaluate the JSON Path against the claims; if it selects
  # nothing, fall back to db-anon-role; if that is unset too -> PGRST302.
  extraction_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Auth/Jwt.hs#L114
  # Working JSON Path shapes, each exercised end-to-end by the io suite.
  role_claim_key_examples:
    driver_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_auth.py#L80
    nested_member:
      key: "$.postgrest.a_role"
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L123
    array_index:
      key: "$.customObject.manyRoles[1]"
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L129
    quoted_key:
      key: '$["https://www.example.com/roles"][0].value'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L137
    index_out_of_range:
      key: "$.myDomain[3]"
      status: 401
      note: "Selects nothing -> falls back to db-anon-role -> 42501 -> 401."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L143
    missing_key:
      key: "$.myRole"
      status: 401
      note: "A configured key fully replaces `$.role`; the token's `role` claim is not consulted."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L150
    filter_equals:
      key: '$.realm_access.roles[?(@ == "postgrest_test_author")]'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L155
    filter_not_equals:
      key: '$.realm_access.roles[?(@ != "other")]'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L162
  # The aud claim can double as the role claim.
  aud_as_role_claim:
    driver_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_auth.py#L99
    string_match: {key: "$.aud", status: 200, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L171"}
    string_mismatch: {key: "$.aud", status: 401, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L175"}
    array_index: {key: "$.aud[0]", status: 200, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L179"}
    # Passes the audience check (any element matches) but selects a role that
    # does not exist -> SQLSTATE 22023 -> 401 (special-cased).
    nonexistent_role: {key: "$.aud[1]", status: 401, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/fixtures/fixtures.yaml#L183"}
    nonexistent_role_status_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L563
  # With no JWT, requests run as the configured db-anon-role
  # (postgrest_test_anonymous in the fixtures).
  anon_role_when_no_jwt:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L890
  # A valid token with role=postgrest_test_author can read authors_only (200).
  valid_role_grants_access:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L71
  # Extra unknown claims in the token are ignored (still 200).
  extra_claims_ignored:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L76
  anonymous:
    # Anonymous (no token) hitting a table it cannot read -> 401 with the
    # Postgres 42501 permission-denied envelope and WWW-Authenticate: Bearer.
    no_token_permission_denied:
      status: 401
      code: "42501"
      www_authenticate: "Bearer"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L15
    # 401 (any unauthenticated/JWT error) gets WWW-Authenticate: Bearer.
    www_authenticate_on_401_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L469
    # An *authenticated* role lacking a privilege gets 403 (NOT 401), and no
    # WWW-Authenticate header.
    authenticated_no_privilege:
      status: 403
      code: "42501"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L27
    authenticated_flag_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L589
    # Anonymous calling an RPC it cannot execute -> 401.
    rpc_no_execute_denied: {status: 401}
    rpc_no_execute_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L40
  no_anon_role_configured:
    # If db-anon-role is unset, an anonymous request -> 401 PGRST302
    # "Anonymous access is disabled" with WWW-Authenticate: Bearer.
    anonymous_disabled: {status: 401, code: PGRST302, message: "Anonymous access is disabled", www_authenticate: "Bearer"}
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/NoAnonSpec.hs#L24
    required_token_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L689
    # A valid token still authenticates normally even when anon is disabled.
    valid_token_still_works:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/NoAnonSpec.hs#L15

# ===========================================================================
# db-pre-request: a stored proc run before the main query, inside the tx,
# after role switching, that can further SET LOCAL ROLE / raise.
# ===========================================================================
pre_request:
  config_key: db-pre-request
  config_alias: pre-request
  config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L179
  # In v16.0 the pre-request call moved into its own module; it is still a bare
  # `select <proc>()` issued after the transaction variables (role included)
  # are set.
  query_shape: "select <schema>.<proc>()"
  query_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/PreQuery.hs#L65
  # The pre-request proc can read request.jwt.claims and switch role based on a
  # custom claim (here: id). id=1 -> postgrest_test_author.
  switch_on_claim_author:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L207
  # id=2 -> postgrest_test_default_role.
  switch_on_claim_default:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L216
  # A RAISE EXCEPTION in the pre-request proc surfaces as the proc's error;
  # P0001 with the raised message/hint -> 400.
  raise_propagates: {status: 400, code: P0001, message: "Disabled ID --> 3", hint: "Please contact administrator"}
  raise_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Auth/AuthSpec.hs#L225

# ===========================================================================
# GUCs exposed to SQL via current_setting()
# ===========================================================================
gucs:
  # All request GUCs are emitted by one `select set_config(...), ...` statement
  # built in Query/PreQuery.hs; the role is set in the same statement, before
  # the pre-request proc runs.
  emitter_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/PreQuery.hs#L41
  role_guc_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/PreQuery.hs#L52
  # request.jwt.claims: the full verified claims object as JSON text.
  request_jwt_claims:
    description: "JSON text of the verified JWT claims; current role is exposed as the .role member even when anonymous."
    anon_role_value: "postgrest_test_anonymous"
