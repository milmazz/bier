# Behavior model for the "select" feature area of PostgREST v16.0.
#
# Scope: columns, alias, ::cast, JSON paths ->/->>, embeds (one-to-many,
# many-to-one, one-to-one, many-to-many via junction), !inner/!left,
# disambiguation hints, spread ...embed, computed columns, computed
# relationships (SETOF functions), aggregate functions.
#
# Every entry carries a `source` URL with a line anchor into PostgREST v16.0.
# Behaviors that could not be traced to a real source line are recorded under
# spec/select.yaml `gaps` (see end of file) and NOT modeled as claims.
#
# Re-synced from the previous v14.12 pin by diffing
# `git diff v14.12..v16.0 -- test/spec/ src/`. The select grammar itself did not
# change (ApiRequest/QueryParams.hs is import-shuffle only); the upstream select
# specs changed almost entirely for test hygiene (explicit `order=` added so
# results stop depending on physical row order) and for a PG19-conditional
# 42883 error `details`/`hint` split that belongs to PostgreSQL, not PostgREST.
# The one real behavior change in this area is the embed-alias target-name
# deprecation (`url-use-legacy-target-names`, entries select.embed_alias_*).
#
# Convention for `source_url`: raw.githubusercontent.com line anchors, pinned to
# the v16.0 tag, matching the form mandated by spec/case.schema.json (the lint
# gate for conformance cases). Each #Lnn lands on the `it`/`spec` line of the
# upstream HSpec test that demonstrates the behavior; line numbers were
# re-derived directly from the raw v16.0 files (not GitHub blob HTML). To view
# in a browser, replace `raw.githubusercontent.com/PostgREST/postgrest/v16.0/`
# with `github.com/PostgREST/postgrest/blob/v16.0/`; the same #Lnn highlights
# the cited test. Note that v16.0 moved the Haskell sources from `src/` to
# `src/library/`, so `src/...` anchors from the v14.12 pin do not survive a
# naive tag swap.

area: select
version: v16.0
fixture: spec/conformance/fixtures/select.sql
schema: test

entries:
  # --- plain columns -------------------------------------------------------
  - entry_id: select.absent
    claim: >
      When the `select` query parameter is absent, all columns of the resource
      are returned (SELECT *).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L581
    source_line: 581
    cases: [1100]

  - entry_id: select.single_column
    claim: >
      `select=<col>` returns only that column for every row.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L589
    source_line: 589
    cases: [1101]

  - entry_id: select.dash_in_name
