# Behaviors observed in PostgREST v16.0 within this area but NOT modeled as
# black-box conformance cases (recorded per the HARD RULE rather than guessed).
gaps:
  - >
    spread one-to-many producing JSON arrays (entry select.spread_one_to_many_arrays)
    is modeled but lacks a case: it needs the factories/processes fixture, which
    bier_test does not have.
    Source: test/spec/Feature/Query/SpreadQueriesSpec.hs#L93.
  - >
    db-aggregates-enabled=false PGRST123 (entry select.agg_disallowed) is
    modeled but not cased: the conformance runner must drive PostgREST/Bier
    with aggregates disabled, a config concern outside select.sql.
  - >
    JSON path negative array indexes (data->>-1::int) are traced at
    JsonOperatorSpec.hs#L283 but not given a separate case; covered indirectly
    by the array-index entry.
  - >
    "obtains a json subfield one level with casting" using ->>foo::json
    (JsonOperatorSpec.hs#L17) returns the still-text value parsed as json; this
    nuance is traced but not cased to avoid coupling to PG json formatting.
  - >
    v16.0 makes the 42883 "operator does not exist" body PG-version dependent
    (details/hint split on PostgreSQL 19+, JsonOperatorSpec.hs#L69-L92 and
    QuerySpec.hs#L1655-L1667). No select case asserts that body, so nothing
    here needed changing, but any future case that does must branch on the
    server's PG version — an assertion style the case schema cannot express.
  - >
    needed_assertion: none required for this area's v16.0 diff. `headers_match`
    (regex) covers the product-version token in the new deprecation `Warning`
    header (case 1138) and `headers_absent` covers its absence (case 1141).
  - >
    harness_exposure: cases 1139 and 1140 carry a `config:` block
    (`url-use-legacy-target-names: false`). The frozen runner only honours a
    per-case `config:` for ids listed in `@variant_case_ids`
    (test/support/conformance_server.ex); ids outside that list silently run on
    the shared instance with default config. The harness owner must add 1139
    and 1140 to that list (and map `url_use_legacy_target_names` in
    `Bier.Config`) before those two cases mean anything.
  - >
    cross-area: spec/conformance/cases/1212_order_embed_alias.yaml (ordering
    area) sends `the_tasks:tasks(...)&tasks.order=name.asc` — the form v16.0
    deprecated. Its 200 + body assertion still holds, but v16.0 also attaches
    the deprecation `Warning` header to that response, and upstream rewrote the
    corresponding it-block to `the_tasks.order` (QuerySpec.hs#L1159). Flagged
    for the ordering area's owner, not edited here.
