      Distinct from casting the aggregate's *result* (entry
      select.agg_alias_and_cast): a cast placed on the field **before** the
      `.agg()` suffix casts the aggregate's INPUT argument —
      `trash_details?select=jsonb_col->>key::integer.sum()` sums the text
      extracted by `->>` after coercing it to integer, yielding
      `[{"sum":24}]`. Alias, input cast and result cast combine:
      `s:jsonb_col->>key::integer.sum()::text` -> `[{"s":"24"}]` (L86).
      Documented as "Casting the Aggregated Column"
      (docs/references/api/aggregate_functions.rst:106).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L83
    source_line: 83
    cases: [1147, 1148]

  - entry_id: select.agg_group_by_embed
    claim: >
      A JSON-embedded relationship may participate in the implicit GROUP BY:
      `project_invoices?select=project_id,total:invoice_total.sum(),projects(name)&order=project_id`
      returns one row per group with the many-to-one embed rendered as a JSON
      object alongside the aggregate. Distinct from
      select.agg_group_by_plain_fields (plain columns only) and from
      select.agg_in_embed (the aggregate living *inside* the embed).
      Documented as "Grouping by an Embedded Resource"
      (docs/references/api/aggregate_functions.rst:147).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L92
    source_line: 92
    cases: [1149]

  - entry_id: select.agg_in_embed
    claim: >
      Aggregates apply within an embedded resource:
      `projects?select=name,project_invoices(invoice_total.sum())`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L100
    source_line: 100
    cases: [1133]

  - entry_id: select.agg_disallowed
    claim: >
      When db-aggregates-enabled is false (PostgREST default), use of an
      aggregate function returns HTTP 400 with code PGRST123 ("Use of aggregate
      functions is not allowed").
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L312
    source_line: 312
    cases: []

# Behaviors observed in PostgREST v16.0 within this area but NOT modeled as
# black-box conformance cases (recorded per the HARD RULE rather than guessed).
gaps:
  - >
    spread one-to-many producing JSON arrays (entry select.spread_one_to_many_arrays)
    is modeled but lacks a case: it needs the factories/processes fixture, which
    bier_test does not have.
    Source: test/spec/Feature/Query/SpreadQueriesSpec.hs#L93.
  - >
    db-aggregates-enabled=false PGRST123 (entry select.agg_disallowed) is
    modeled but not cased: the conformance runner must drive PostgREST/Bier
    with aggregates disabled, a config concern outside select.sql.
  - >
    JSON path negative array indexes (data->>-1::int) are traced at
    JsonOperatorSpec.hs#L283 but not given a separate case; covered indirectly
    by the array-index entry.
  - >
    "obtains a json subfield one level with casting" using ->>foo::json
    (JsonOperatorSpec.hs#L17) returns the still-text value parsed as json; this
    nuance is traced but not cased to avoid coupling to PG json formatting.
  - >
    v16.0 makes the 42883 "operator does not exist" body PG-version dependent
    (details/hint split on PostgreSQL 19+, JsonOperatorSpec.hs#L69-L92 and
    QuerySpec.hs#L1655-L1667). No select case asserts that body, so nothing
    here needed changing, but any future case that does must branch on the
    server's PG version — an assertion style the case schema cannot express.
  - >
    needed_assertion: none required for this area's v16.0 diff. `headers_match`
    (regex) covers the product-version token in the new deprecation `Warning`
    header (case 1138) and `headers_absent` covers its absence (case 1141).
  - >
    loader_exposure: four upstream fixture tables this area's cases would
    otherwise mirror byte-for-byte are absent from the consolidated bier_test
    `test` schema — `places`/`visits` (v16.0's new same-table-twice test,
    QuerySpec.hs#L1699-L1707), `factories`/`processes`/`process_costs`
    (spread-as-json-array, SpreadQueriesSpec.hs#L93), `oid_test`
    (underscore/digit cast targets, QuerySpec.hs#L621) and `message`/`person`
    (the unknown-FK-hint 400, EmbedDisambiguationSpec.hs#L216). Cases 1140 and
    1124 therefore reproduce the upstream *shape* on projects/tasks and
    projects/clients respectively (see their notes); the other two behaviors are
    modeled without a case. Deliberately NOT added via
    spec/conformance/fixtures/select.delta.sql: new relations in the `test`
    schema are visible to the OpenAPI area's document assertions and to every
    other area mirroring `test`, so the fixture owner should decide whether to
    take them, not this area.
  - >
    harness_exposure: ten cases in this area carry a `config:` block that the
    frozen runner currently ignores. `@variant_case_ids`
    (test/support/conformance_server.ex:58-59) lists only
    [1467..1473, 1491, 1493, 1654, 1677, 1678, 1680, 1682, 1703, 1758, 1763,
    1764]; every id outside that list silently runs on the shared instance with
    default config. Two groups need wiring:
    (a) `db-aggregates-enabled: true` — cases 1129, 1130, 1131, 1132, 1133,
    1147, 1148, 1149. PostgREST's default for this key is False
    (`fromMaybe False <$> optBool "db-aggregates-enabled"`,
    src/library/PostgREST/Config.hs#L276) and the upstream suite runs these
    specs under a dedicated `baseCfg { configDbAggregates = True }` config
    (AggregateFunctionsSpec.hs#L13), so on a default instance all eight cases
    would get the PGRST123 400 of entry select.agg_disallowed instead of the
    asserted 200 body.
    (b) `url-use-legacy-target-names: false` — cases 1139 and 1140, which also
    need `url_use_legacy_target_names` mapped in `Bier.Config`.
    Until the harness owner adds all ten ids to `@variant_case_ids`, their
    `config:` blocks are inert.
    Source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L276
  - >
    cast targets containing underscores/digits (entry
    select.cast_underscore_numbers, QuerySpec.hs#L621) is modeled but lacks a
    case: upstream asserts it on `oid_test` (`oid_col::int`,
    `oid_array_col::_int4`), and `oid_test` does not exist in the consolidated
    bier_test database. The plain cast path is covered by cases 1104/1105/1108.
  - >
    multi-node deprecation warnings: App.hs#L214 joins one `<relName> to
    <alias>` clause per offending node with ", " (T.intercalate). Upstream has
    no test for the two-or-more-node form, and the clause order is not stable by
    inspection — `updateNode` moves each matched node to the front of the read
    plan forest as filters are applied (Plan.hs#L1021-L1022), so the traversal
    order that `readPlanWarnings` folds over depends on the query-string order.
    The single-node form is cased (1138); the multi-node join order is claimed
    in entry select.embed_alias_legacy_target_name_warning but deliberately not
    cased, because pinning an order would be a guess.
  - >
    cross-area (resolved, kept as a pointer): the v16.0 embed-alias deprecation
    also lands outside this area. The ordering area re-anchored
    1212_order_embed_alias.yaml to the alias form (`the_tasks.order`, matching
    upstream's rewritten QuerySpec.hs#L1159) plus `headers_absent: [Warning]`,
    and added 1224 for the deprecated form; the filters area added 1189/1190 and
    url_grammar added 1028. Cases 1138/1141 here are the select-area statements
    of the same boundary — the four areas must stay in agreement if the
    upstream message text ever changes.
