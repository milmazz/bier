    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L96
    source_line: 96
    cases: [1110]

  - entry_id: select.json_bad_syntax
    claim: >
      Malformed JSON path syntax in select yields HTTP 400 with code PGRST100
