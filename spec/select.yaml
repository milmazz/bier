    source_line: 674
    cases: [1115]

  - entry_id: select.embed_alias
    claim: >
      An embedded resource can be aliased with `<alias>:<relation>(...)`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L656
    source_line: 656
    cases: [1116]

  # --- embed alias vs. target name in filters/orders/limits (NEW in v16.0) --
  #
  # v16.0 adds the `url-use-legacy-target-names` config key (default `true`,
  # PostgREST/Config.hs `<*> (fromMaybe True <$> optBool
  # "url-use-legacy-target-names")`). It decides how the `<name>.` prefix of a
  # filter/order/limit resolves to a node of the read plan:
  #   legacy (true):  relName == name || relAlias == Just name   (v14.12 rule)
  #   strict (false): fromMaybe relName relAlias == name
  # See Plan.hs `matchTarget` (v16.0 src/library/PostgREST/Plan.hs#L1027-L1030).
  - entry_id: select.embed_alias_legacy_target_name_warning
    claim: >
      NEW in v16.0. Under the default `url-use-legacy-target-names = true`, a
      filter/order/limit may still address an aliased embed by its relation
      name (`the_tasks:tasks(...)` + `tasks.order=...`), but the response now
      carries a deprecation header
      `Warning: 299 <product-version> "Embedded resource was referenced by
      relation name even though it has an alias. This is deprecated and will
      stop working in a future release. Update `<relName>` to `<alias>` in
      query string filters, orders or limits."`. Multiple offending nodes are
      joined with ", " in the "Update ..." clause (App.hs legacyWarnHint,
      v16.0 src/library/PostgREST/App.hs#L214).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1183
    source_line: 1183
    cases: [1138]

  - entry_id: select.embed_alias_reference_no_warning
    claim: >
      Addressing an aliased embed by its ALIAS is the supported form and emits
      no `Warning` header: `readPlanWarning` only fires for a node whose
      `relIsLegacyTargetNameMatch` flag is set, and `updateLegacyAttrs` sets it
      only when the addressed name equals the relation name AND differs from
      the alias (Plan.hs#L1032-L1036).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L167
    source_line: 167
    note: >-
      Implementation anchor (this claim is about the mechanism). The black-box
      demonstration — the same request/response as case 1141 — is the it-block
      `it "ordering embeded entities with alias"` at
      test/spec/Feature/Query/QuerySpec.hs#L1159, which is what case 1141
      cites as its `source`.
    cases: [1141]

  - entry_id: select.embed_alias_target_name_disallowed
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names = false`, addressing an
      aliased embed by its relation name is HTTP 400 PGRST108 with
      message "'<relName>' is not an embedded resource in this request",
      details "Target names are not allowed in filters if they have an alias"
      and hint "Change '<relName>' to '<alias>' in filters, orders or limits."
      (Error.hs#L214/#L220). The pre-existing not-embedded-at-all form of
      PGRST108 is unchanged: details null, hint "Verify that '<name>' is
      included in the 'select' query parameter."
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1709
    source_line: 1709
    cases: [1139]

  - entry_id: select.embed_same_table_twice_independent_filters
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names = false`, the same
      relation may be embedded more than once (once plain, once aliased) and
      each `<name>.` filter/order/limit resolves to exactly one node, so the
      two embeds can be filtered independently. Under the legacy rule both
      filters collapse onto whichever node `find` matched first.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1699
    source_line: 1699
    cases: [1140]

