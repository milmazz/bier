    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L308
    source_line: 308
    cases: [1111]

  # --- composite / array columns via the arrow operators -------------------
  # Distinct from the json/jsonb entries above: the target column is NOT of a
  # json type, so PostgREST wraps it as `to_jsonb(<col>)` before applying the
  # path (SqlFragment.pgFmtField, cfToJson branch — same wrapping the ordering
  # area notes on cases 1219/1225). Documented as "Composite / Array Columns"
  # (docs/references/api/tables_views.rst:347, published at
  # https://postgrest.org/en/v16/references/api/tables_views.html#composite-array-columns).
  - entry_id: select.composite_array_arrow
    claim: >
      `->` / `->>` also address a *field of a composite-type column*:
      `fav_numbers?select=num->i` yields `{"i":0.5}` (json value) and
      `num->>i` yields `{"i":"0.5"}` (text). The last path segment becomes the
      JSON key unless aliased. The column is not json/jsonb, so it is wrapped
      in `to_jsonb(...)` first.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L150
    source_line: 150
    cases: [1143, 1144]

  - entry_id: select.composite_array_arrow_item
    claim: >
      The array half of the same feature, modeled separately from
      select.json_array_index (which addresses an index inside a *json* column):
      a numeric arrow segment addresses an element of an `int[]`/`int[][]`
      column. `arrays?select=a:numbers->0,b:numbers->1,c:numbers_mult->0->0,d:numbers_mult->1->2`
      yields json numbers; the `->>` variants yield the same elements as text.
      Multi-dimensional arrays are chained (`numbers_mult->0->0`), because
      `to_jsonb(int[][])` produces nested JSON arrays.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L158
    source_line: 158
    cases: [1145, 1146]

  # --- embeds: many-to-one -------------------------------------------------
  - entry_id: select.embed_many_to_one
    claim: >
      Embedding a parent (many-to-one) returns the related row as a JSON
      object (or null when the FK is null). `projects?select=id,name,clients(*)`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L628
    source_line: 628
    cases: [1112]

