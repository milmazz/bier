# PostgREST v16.0 — Horizontal-filter operators behavior model
#
# Scope: the operators usable in `?<column>=<op>.<value>` horizontal filters
# (and inside and=()/or=() logic trees), plus the `not` prefix and the
# any()/all() quantifiers.
#
# Ground truth (priority order):
#   1. PostgREST test specs (test/spec/Feature/Query/*.hs + fixtures/*.sql)
#   2. PostgREST source (src/library/PostgREST/...)
#   3. PostgREST docs (postgrest.org/en/v16)
#
# NOTE ON THE v14.12 -> v16.0 RE-SYNC: no operator behavior changed. This was
# re-proved by byte-diffing the operator regions of both tags rather than by
# reading the change notes: `simpleOperator`/`quantOperator`/`ftsOperator` and
# `pgFmtFilter` (SqlFragment.hs) and `simpleOperator`/`quantOperator`/`pOpExpr`
# (QueryParams.hs) are byte-identical across the two tags, and
# AndOrParamsSpec.hs differs only in its module header (the `Application`
# import and the `spec ::` signature). Only import blocks were reflowed
# (shifting line numbers: SqlFragment.hs -7, QueryParams.hs +8,
# QuerySpec.hs +5, AndOrParamsSpec.hs -2) and the source tree moved from
# `src/PostgREST/` to `src/library/PostgREST/`. Every citation below was
# re-anchored accordingly and the anchored line's content re-verified against
# the v16.0 tag; nothing was dropped, because no operator behavior was
# removed. Nothing in this area is new in v16.0 either — the cases added
# across this re-sync (10200-10236) cover behavior that existed at BOTH pins
# and had simply never been modeled.
#
# CORRECTION (this pass): the previous revision of that note claimed
# 10200-10219 had closed everything in the "existed at both pins, never
# modeled" bucket. That was wrong. The whole upstream `context "text and json
# columns"` block — fts/plfts/phfts/wfts against NON-tsvector columns, which
# PostgREST silently wraps in `to_tsvector()` — exists at both pins
# (v14.12 QuerySpec.hs#L311, v16.0 QuerySpec.hs#L316) and had zero coverage:
# every fts case on disk targeted an actual tsvector column. So did the
# tsvector-domain, recursive-tsvector-domain and tsvector-computed-field
# variants, and the tsquery/websearch boolean-operator assertions. The
# coercion rule (and the tsvector exemption that keeps the pre-existing cases
# emitting a bare `@@`) is now modeled under `grammar.fts_auto_tsvector` and
# covered by cases 10220-10236.
#
# CITATION FORM: every `*source*` value is a single fetchable URL whose `#L…`
# fragment anchors the exact line that evidences the claim next to it (the
# same form used by filters.yaml / ordering.yaml / select.yaml).
#
# Operator -> SQL mapping is taken verbatim from
#   src/library/PostgREST/Query/SqlFragment.hs  (simpleOperator / quantOperator / ftsOperator)
# Operator token parsing is taken from
#   src/library/PostgREST/ApiRequest/QueryParams.hs (simpleOperator / quantOperator / pOpExpr)
# Operator enums are in
#   src/library/PostgREST/ApiRequest/Types.hs (QuantOperator / SimpleOperator / FtsOperator)

version: PostgREST v16.0
area: operators

# ---------------------------------------------------------------------------
# Grammar notes shared by all operators
# ---------------------------------------------------------------------------
grammar:
  filter_syntax: "<column>=<op>.<value>"  # e.g. id=eq.5
  not_prefix:
    # `not` is a boolean prefix on the whole operation, parsed by pOpExpr:
    #   boolExpr <- try (string "not" *> pDelimiter $> True) <|> pure False
    # pgFmtFilter emits that flag as a `NOT` token placed BEFORE the field
    # reference:
    #   pgFmtFilter table (CoercibleFilter fld (OpExpr hasNot oper)) =
    #     notOp <> " " <> pgFmtField table fld <> case oper of …
    syntax: "<column>=not.<op>.<value>"
    sql: "NOT <field> <op> <value>"
    # operand ordering (NOT before the field reference):
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L383
    # the NOT token itself: notOp = if hasNot then "NOT" else mempty
    not_token_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L414
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L645
  quantifiers:
    # any()/all() modifiers are only valid on QuantOperator operators
    # (eq, gte, gt, lte, lt, like, ilike, match, imatch); pQuantOp parses the
    # optional `(any)`/`(all)` between the operator token and the delimiter.
    syntax: "<column>=<op>(any|all).<value>"   # value is a pg array literal {…}
    # shape of a quantified filter: <field> <quantOperator op> <fmtQuant …>
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L386
    sql_any: "<field> <op> ANY(<arr>)"
    # Just QuantAny -> "ANY(" <> val <> ")"
    sql_any_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L417
    sql_all: "<field> <op> ALL(<arr>)"
    # Just QuantAll -> "ALL(" <> val <> ")"
    sql_all_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L418
    # Nothing -> val (an unquantified operator emits no ANY(/ALL( wrapper)
    sql_unquantified_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L419
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L662
  value_lists:
    # in.() parenthesised lists: pListVal parses ( e1 , e2 , … ) — a
    # comma-separated sepBy1 of pListElement between literal parens.
    syntax: "<column>=in.(v1,v2,…)"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L691
    # each element: a quoted value, else bare chars up to `,` or `)`
    element_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L694
    # quoted elements: "…" with backslash escapes (pQuotedValue/pCharsOrSlashed)
    quoted_value_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L697
    # Both parens are parsed through `lexeme p = ws *> p <* ws`, so whitespace
    # around the list is consumed before the elements are split on `,`. This is
    # why `in.()` and `in.(    )` both yield the singleton list [""] (the
    # `= ANY('{}')` branch, cases 10200/10204), while `in.( ,3,4)` yields
    # ["", "3", "4"] and reaches Postgres as the array literal {"","3","4"}
    # (a 22P02 cast failure -> 400, case 10205).
    whitespace_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L283
  fts_language_modifier:
    # every fts operator accepts an optional parenthesised text-search config
    # between the operator token and the delimiter, e.g. fts(french).amusant
    syntax: "<column>=<fts-op>(<language>).<value>"
    # The SAME language is consumed TWICE, not once:
    #   1. as the tsquery config argument (pgFmtFilter -> pgFmtFtsLang), and
    #   2. on a NON-tsvector column, as the config of the automatic
    #      to_tsvector() wrap on the COLUMN side (pgFmtField -> pgFmtFtsLang).
    # Modelling only (1) is wrong for text/json/jsonb columns: upstream's
    # it-block is literally titled "finds matches with different dictionaries
    # and uses them as configuration for to_tsvector()". See
    # grammar.fts_auto_tsvector for the coercion rule itself.
    sql_tsvector_column: "<field> @@ <fts_fn>(<language>, <value>)"
    sql_other_column: "to_tsvector(<language>, <field>) @@ <fts_fn>(<language>, <value>)"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L678
    # Fts op lang val -> " " <> ftsOperator op <> "(" <> pgFmtFtsLang lang <> …
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L412
    # pgFmtFtsLang = maybe mempty (\l -> unknownLiteral l <> ", ")
    lang_sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L422
    # the column-side use of the same lang: pgFmtField's ToTsVector branch
    #   Just (ToTsVector lang) -> "to_tsvector(" <> pgFmtFtsLang lang <> fmtFld <> ")"
    column_side_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
    # it "finds matches with different dictionaries and uses them as
    #    configuration for to_tsvector()"  (cases 10222/10223)
    behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L403

  fts_auto_tsvector:
    # An fts/plfts/phfts/wfts filter does NOT require a tsvector column. When
    # the target field's base type is anything else (text, json, jsonb, …),
    # PostgREST wraps the FIELD in to_tsvector() so that `@@` type-checks.
    # This automatic coercion is the ONLY reason the `text` half of every fts
    # operator's `type_constraints` below is true.
    summary: >
      resolveQueryInputField tags the resolved field with `ToTsVector lang`
      whenever the operator is an Fts op; pgFmtField then emits
      `to_tsvector(<lang>, <field>)` in place of the bare field reference.
      Plan.hs clears the tag again when the field's BASE type is already
      tsvector, so tsvector (and tsvector-domain) columns keep a bare `@@`.
    sql_non_tsvector_column: "to_tsvector([<lang>, ]<field>) @@ <fts_fn>([<lang>, ]<value>)"
    sql_tsvector_column: "<field> @@ <fts_fn>([<lang>, ]<value>)"
    # the tag: OpExpr _ (Fts _ lang _) -> Just $ ToTsVector lang  (Fts only)
    flag_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L373
    # the emission: pgFmtField's `Just (ToTsVector lang)` branch
    emit_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
    # THE EXEMPTION (load-bearing for the pre-existing tsvector cases 1067-1071,
    # 1090 and 10217-10219): resolveTypeOrUnknown clears cfToTsVector when the
    # column's base type is tsvector —
    #   cf@CoercibleField{cfBaseType="tsvector"} -> cf{… cfToTsVector=Nothing}
    # Without it those cases would compile to to_tsvector(<tsvector col>),
    # which does not type-check in Postgres at all.
    tsvector_exemption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L335
    # DOMAINS: the exemption keys off cfBaseType, which is the introspected
    # `data_type` column — and for a domain that projection substitutes the
    # BASE type (format_type(bt.base_type)) whenever the base type lives in
    # pg_catalog. So a domain over tsvector is exempt too.
    domain_base_type_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L608
    # `base_type` is itself resolved TRANSITIVELY (WITH RECURSIVE pre-PG17,
    # pg_basetype() on PG17+), which is what makes a domain-over-a-domain
    # (`tsvector_not_empty` -> `tsvector_not_null` -> `tsvector`) work.
    recursive_domain_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L383
    # observed behavior — whole `context "text and json columns"` block
    # (cases 10220-10227)
    behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L316
    # it "works when the column type is a tsvector domain"        (case 10229)
    domain_behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L302
    # it "works when the column type is a recursive tsvector domain" (10230)
    recursive_domain_behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L309
    # it "works with tsvector computed fields" — the coercion is skipped for a
    # computed field returning tsvector as well                    (case 10228)
    computed_field_behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L295

  fts_value_passthrough:
    # The fts operand is emitted as a bare `unknownLiteral`, i.e. handed to
    # to_tsquery/plainto_tsquery/phraseto_tsquery/websearch_to_tsquery
    # VERBATIM. PostgREST parses no tsquery syntax of its own: whatever the
    # client percent-decodes to is the tsquery/websearch string.
    sql: "<fts_fn>([<lang>, ]'<value>')"
    # Fts op lang val -> … <> pgFmtFtsLang lang <> unknownLiteral val <> ") "
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L412
    tsquery_operators: "& (%26), | (%7C), ! — to_tsquery lexeme booleans"
    # it "can use lexeme boolean operators(&=%26, |=%7C, !) in to_tsquery"
    tsquery_operators_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L189
    websearch_operators: "and / or / - — websearch_to_tsquery booleans"
    # it "can use boolean operators(and, or, -) in websearch_to_tsquery"
    websearch_operators_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L212

# ---------------------------------------------------------------------------
# Quantifiable operators (QuantOperator) — accept any()/all()
# ---------------------------------------------------------------------------
operators:
  - name: eq
    pg_op: "="
    quantifiable: true
    type_constraints: "any equality-comparable type; also ranges, arrays"
    examples:
      - "id=eq.1"
      - "id=eq(any).{3,4,5}"
      - "range=eq.[1,3]"      # whole-range equality
      - "arr=eq.{1,2,3}"      # whole-array equality (order + length), not membership
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L207
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L119

  - name: gt
    pg_op: ">"
    quantifiable: true
    type_constraints: "ordered types; ranges, arrays"
    examples:
      - "id=gt.2"
      - "id=gt(all).{4,3}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L209
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L121

  - name: gte
    pg_op: ">="
    quantifiable: true
    type_constraints: "ordered types; ranges, arrays"
    examples:
      - "id=gte.2"
      - "id=gte(all).{4,3}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L208
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L120

  - name: lt
    pg_op: "<"
    quantifiable: true
    type_constraints: "ordered types; ranges, arrays"
    examples:
      - "id=lt.14"
      - "id=lt(all).{4,3}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L211
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L123

  - name: lte
    pg_op: "<="
    quantifiable: true
    type_constraints: "ordered types; ranges, arrays"
    examples:
      - "id=lte.3"
      - "id=lte(all).{4,3}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L210
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L122

  - name: neq
    pg_op: "<>"
    quantifiable: false    # SimpleOperator: not quantifiable
    type_constraints: "any equality-comparable type; ranges, arrays"
    examples:
      - "id=neq.5"
      - "range=neq.[1,3]"
      - "arr=neq.{1,2}"       # null-propagating: a NULL arr is NOT returned
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L194
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L107

  # -------------------------------------------------------------------------
  # Pattern matching
  # -------------------------------------------------------------------------
  - name: like
    pg_op: "like"
    quantifiable: true
    type_constraints: "text/varchar; `*` in the value is rewritten to SQL `%`"
    star_rewrite: true
    examples:
      - "k=like.*yx"     # -> like '%yx'
      - "k=like.xy*"     # -> like 'xy%'
      - "body=like(any).{%plan%,%brain%}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L212
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L124
    # OpLike -> fmtQuant quant $ unknownLiteral (T.map star val)
    star_rewrite_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L387
    # star c = if c == '*' then '%' else c
    star_fn_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L415

  - name: ilike
    pg_op: "ilike"
    quantifiable: true
    type_constraints: "text/varchar; case-insensitive; `*` rewritten to `%`"
    star_rewrite: true
    examples:
      - "k=ilike.xy*"
      - "body=ilike(all).{%plan%,%greatness%}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L213
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L125
    # OpILike -> fmtQuant quant $ unknownLiteral (T.map star val)
    star_rewrite_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L388
    # star c = if c == '*' then '%' else c
    star_fn_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L415

  - name: match
    pg_op: "~"
    quantifiable: true
    type_constraints: "text; POSIX regular expression (case-sensitive)"
    examples:
      - "k=match.^xy"
      - "body=match(any).{stop,thing}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L214
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L126

  - name: imatch
    pg_op: "~*"
    quantifiable: true
    type_constraints: "text; POSIX regular expression (case-insensitive)"
    examples:
      - "k=imatch.^xy"
      - "body=imatch(any).{stop,thing}"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L215
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L127

  # -------------------------------------------------------------------------
  # in / is / isdistinct  (special parse forms, not quantifiable)
  # -------------------------------------------------------------------------
  - name: in
    pg_op: "= ANY(...)"      # PostgREST never emits SQL IN; uses = ANY('{...}')
    quantifiable: false
    type_constraints: >
      value is a parenthesised list: in.(v1,v2,...). A wholly empty (or
      whitespace-only) list => `= ANY('{}')`, which matches nothing; `not.in.()`
      is therefore `NOT (col = ANY('{}'))` and matches every row, including rows
      whose column IS NULL. `= ANY` over a zero-element array is an empty OR,
      i.e. FALSE, whatever the left operand is — the "NULL left operand yields
      NULL" rule only applies to non-empty arrays — so its negation is TRUE
      unconditionally and needs no `col IS NOT NULL` guard.
      A blank element ALONGSIDE real ones is NOT collapsed and is passed
      through as an empty-string array element.
    examples:
      - "id=in.(1,3,5)"
      - "id=not.in.(2,4,6)"
      - "int_data=in.()"        # -> = ANY('{}'), empty result
      - "int_data=in.(    )"    # -> same, whitespace is consumed by lexeme
      - "int_data=not.in.()"    # -> NOT (= ANY('{}')), every row, NULLs included
    # pIn = In <$> (try (string "in" *> pDelimiter) *> pListVal)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L651
    # In vals -> " " <> case vals of [""] -> "= ANY('{}') " ; _ -> "= ANY (…) "
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L408
    # [""] -> "= ANY('{}') "  (empty list)
    empty_list_sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L409

  - name: is
    pg_op: "IS"
    quantifiable: false
    type_constraints: >
      value MUST be one of: null, not_null, true, false, unknown
      (case-insensitive). Any other value is a 400 error. Whitelisted at
      parse time because IS cannot be parameterised.
    examples:
      - "a=is.null"
      - "a=is.not_null"
      - "done=is.true"
      - "done=is.unknown"
      - "done=is.NoT_NuLl"   # case-insensitive
    # pIsVal whitelist: null / not_null / true / false / unknown
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L665
    # Is isVal -> " IS " <> NULL/NOT NULL/TRUE/FALSE/UNKNOWN
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L395
    # the whitelist is matched with ciString = traverse ciChar
    case_insensitive_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L685
    # ciChar c = char c <|> char (toUpper c) — the case-insensitivity itself
    ci_char_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L683
    # any other value is a 400: "fails if 'is' used and there's no null or trilean value"
    invalid_value_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L132

  - name: isdistinct
    pg_op: "IS DISTINCT FROM"
    quantifiable: false
    type_constraints: >
      any type (scalar, range or array); null-safe inequality, so a NULL
      column value MATCHES a non-null operand — this is what separates it from
      neq, which is null-propagating (compare cases 10207 and 10213 on the
      same integer[] column).
    examples:
      - "a=isdistinct.2"
      - "a=not.isdistinct.2"
      - "range=isdistinct.[1,3]"
      - "arr=isdistinct.{1,2}"
    # pIsDist = IsDistinctFrom <$> (try (string "isdistinct" *> pDelimiter) *> pSVal)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L654
    # IsDistinctFrom val -> " IS DISTINCT FROM " <> unknownLiteral val
    # NOTE the value goes through bare `unknownLiteral`, NOT through
    # `pgFmtUnknownLiteralForField … fld` the way the SimpleOperator branch
    # (Op op val, SqlFragment.hs#L384) does — isdistinct never applies a data
    # representation / field transform to its operand.
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L403
    # the contrasting field-coerced branch used by the simple operators:
    contrast_simple_op_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L384

  # -------------------------------------------------------------------------
  # Full text search operators (FtsOperator) — optional (language) modifier
  # -------------------------------------------------------------------------
  - name: fts
    pg_op: "@@ to_tsquery"
    quantifiable: false
    type_constraints: "tsvector / text; optional (config) language: fts(french).x"
    lang_modifier: true
    examples:
      - "text_search_vector=fts.impossible"
      - "text_search_vector=fts(french).amusant"
      - "text_search_vector=not.fts.impossible|fat|fun"
      - "text_search=fts.impossible"          # text column -> to_tsvector wrap
      - "jsonb_search=fts.impossible"         # jsonb column -> to_tsvector wrap
      - "text_search_vector=fts.fun&!possible"  # value reaches to_tsquery verbatim
    # try (string "fts" $> FilterFts)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L673
    # FilterFts -> "@@ to_tsquery"
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L131
    # The `text` half of type_constraints above is NOT a bare `@@` against a
    # text column: it is only true because PostgREST wraps a non-tsvector
    # field in to_tsvector(). Full rule: grammar.fts_auto_tsvector.
    to_tsvector_coercion:
      applies_when: "the field's BASE type is not tsvector (text, json, jsonb, …)"
      sql: "to_tsvector([<lang>, ]<field>) @@ to_tsquery([<lang>, ]<value>)"
      # pgFmtField: Just (ToTsVector lang) -> "to_tsvector(" <> pgFmtFtsLang lang <> fmtFld <> ")"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
      # cleared for tsvector (and tsvector-domain) columns
      exemption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L335
      # it "finds matches with to_tsquery" under context "text and json columns"
      behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L317

  - name: plfts
    pg_op: "@@ plainto_tsquery"
    quantifiable: false
    type_constraints: "tsvector / text; optional language modifier"
    lang_modifier: true
    examples:
      - "text_search_vector=plfts.The Fat Rats"
      - "text_search_vector=plfts(french).amusant impossible"
      - "text_search=plfts.The Fat Rats"      # text column -> to_tsvector wrap
    # try (string "plfts" $> FilterFtsPlain)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L674
    # FilterFtsPlain -> "@@ plainto_tsquery"
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L132
    # see grammar.fts_auto_tsvector — the `text` half of type_constraints is
    # only true because of this wrap
    to_tsvector_coercion:
      applies_when: "the field's BASE type is not tsvector (text, json, jsonb, …)"
      sql: "to_tsvector([<lang>, ]<field>) @@ plainto_tsquery([<lang>, ]<value>)"
      # pgFmtField: Just (ToTsVector lang) -> "to_tsvector(" <> pgFmtFtsLang lang <> fmtFld <> ")"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
      exemption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L335
      # it "finds matches with plainto_tsquery" under context "text and json columns"
      behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L359

  - name: phfts
    pg_op: "@@ phraseto_tsquery"
    quantifiable: false
    type_constraints: "tsvector / text; optional language modifier"
    lang_modifier: true
    examples:
      - "text_search_vector=phfts.The Fat Cats"
      - "text_search_vector=phfts(german).Art Spass"
      - "text_search=phfts.The Fat Cats"      # text column -> to_tsvector wrap
    # try (string "phfts" $> FilterFtsPhrase)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L675
    # FilterFtsPhrase -> "@@ phraseto_tsquery"
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L133
    # see grammar.fts_auto_tsvector — the `text` half of type_constraints is
    # only true because of this wrap
    to_tsvector_coercion:
      applies_when: "the field's BASE type is not tsvector (text, json, jsonb, …)"
      sql: "to_tsvector([<lang>, ]<field>) @@ phraseto_tsquery([<lang>, ]<value>)"
      # pgFmtField: Just (ToTsVector lang) -> "to_tsvector(" <> pgFmtFtsLang lang <> fmtFld <> ")"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
      exemption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L335
      # context "Use of the phraseto_tsquery function" nested under
      # context "text and json columns" -> it "finds matches"
      behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L460

  - name: wfts
    pg_op: "@@ websearch_to_tsquery"
    quantifiable: false
    type_constraints: "tsvector / text; optional language modifier"
    lang_modifier: true
    examples:
      - "text_search_vector=wfts.The Fat Rats"
      - "text_search_vector=wfts(french).amusant impossible"
      - "text_search_vector=wfts.fun and -possible"  # websearch booleans, verbatim
      - "text_search=wfts.The Fat Rats"       # text column -> to_tsvector wrap
    # try (string "wfts" $> FilterFtsWebsearch)
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L676
    # FilterFtsWebsearch -> "@@ websearch_to_tsquery"
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L134
    # see grammar.fts_auto_tsvector — the `text` half of type_constraints is
    # only true because of this wrap
    to_tsvector_coercion:
      applies_when: "the field's BASE type is not tsvector (text, json, jsonb, …)"
      sql: "to_tsvector([<lang>, ]<field>) @@ websearch_to_tsquery([<lang>, ]<value>)"
      # pgFmtField: Just (ToTsVector lang) -> "to_tsvector(" <> pgFmtFtsLang lang <> fmtFld <> ")"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L248
      exemption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L335
      # it "finds matches with websearch_to_tsquery" under context "text and
      # json columns"
      behavior_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L367

  # -------------------------------------------------------------------------
  # Array / range operators (SimpleOperator) — not quantifiable
  # -------------------------------------------------------------------------
  - name: cs
    pg_op: "@>"
    quantifiable: false
    type_constraints: "array / range / jsonb 'contains'"
    examples:
      - "arr_data=cs.{2}"
      - "range=cs.[1,2]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L195
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L108

  - name: cd
    pg_op: "<@"
    quantifiable: false
    type_constraints: "array / range / jsonb 'contained in'"
    examples:
      - "arr_data=cd.{1,2,4}"
      - "range=cd.[1,6]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L196
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L109

  - name: ov
    pg_op: "&&"
    quantifiable: false
    type_constraints: "array / range overlap"
    examples:
      - "arr=ov.{2,3}"
      - "range=ov.[0,4]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L197
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L110

  - name: sl
    pg_op: "<<"
    quantifiable: false
    type_constraints: "range strictly left of"
    examples:
      - "range=sl.[9,10]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L198
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L111

  - name: sr
    pg_op: ">>"
    quantifiable: false
    type_constraints: "range strictly right of"
    examples:
      - "range=sr.[3,4]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L199
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L112

  - name: nxr
    pg_op: "&<"
    quantifiable: false
    type_constraints: "range does not extend to the right of"
    examples:
      - "range=nxr.[4,7]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L200
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L113

  - name: nxl
    pg_op: "&>"
    quantifiable: false
    type_constraints: "range does not extend to the left of"
    examples:
      - "range=nxl.[4,7]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L201
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L114

  - name: adj
    pg_op: "-|-"
    quantifiable: false
    type_constraints: "range adjacent to"
    examples:
      - "range=adj.(3,10]"
    parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/QueryParams.hs#L202
    sql_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/SqlFragment.hs#L115
