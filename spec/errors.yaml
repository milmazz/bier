# PostgREST v16.0 — Errors behavior model
#
# Scope: how PostgREST turns a failed request into an HTTP error response.
# Four sub-areas:
#   1. The PostgreSQL SQLSTATE -> HTTP status map (pgErrorStatus/mapSQLtoHTTP).
#   2. The JSON error envelope shape ({code, message, details, hint}) and its
#      `client-error-verbosity` variants (NEW in v16.0).
#   3. RAISE-based custom errors: `RAISE SQLSTATE 'PTnnn'` and the full
#      response-control `RAISE SQLSTATE 'PGRST'` protocol.
#   4. The Proxy-Status error header.
#
# Ground truth (priority order):
#   1. PostgREST test specs (test/spec/Feature/Query/ErrorSpec.hs, RpcSpec.hs,
#      InsertSpec.hs + fixtures/schema.sql)
#   2. PostgREST source (src/library/PostgREST/Error.hs)
#   3. PostgREST docs (postgrest.org/en/v16)
#
# v16.0 NOTE — module layout moved. In v14.12 the module lived at
#   src/PostgREST/Error.hs
# In v16.0 the source tree was split into src/executable/ and src/library/, so
# the same module is now at
#   src/library/PostgREST/Error.hs
# and the error *data types* were extracted into
#   src/library/PostgREST/Error/Types.hs
# Every anchor below is re-pinned accordingly.

version: PostgREST v16.0
previous_version: PostgREST v14.12
area: errors

# ---------------------------------------------------------------------------
# What changed between v14.12 and v16.0 (errors area)
# ---------------------------------------------------------------------------
changes_since_v14_12:
  - change: "NEW: `client-error-verbosity` config selects the error envelope shape (verbose | minimal)."
    effect: "With `minimal`, the body carries ONLY {code, message}; details/hint keys are omitted entirely (not nulled)."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L75
  - change: "The Proxy-Status header is now emitted by errorResponseFor for every error, instead of by a per-error-class `headers` clause."
    effect: "No observable change — v14.12 already covered all five error classes; only the source location moved."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L86
  - change: "PGRST000 message changed from 'Database connection error. Retrying the connection.' to 'Database connection error.'"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L484
  - change: "Hasql pipeline errors (`SessionUsageError (PipelineError ...)`) are now mapped alongside query errors."
    effect: "Same statuses: a pipeline ClientError is 503, a pipeline ResultError goes through the same SQLSTATE map."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L540
  - change: "PGRST107 (MediaTypeError) is documented as HTTP 406 for an invalid `Accept`, no longer 415 for an invalid `Content-Type`."
    note: "Owned by the content_negotiation area; recorded here only because it appears in the shared PGRSTxxx code table."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/errors.rst#L202
  - change: "The SQLSTATE -> HTTP status table itself is byte-identical to v14.12; only line anchors moved."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L545

# ---------------------------------------------------------------------------
# Error envelope (JSON body)
# ---------------------------------------------------------------------------
envelope:
  # Under the default `verbose` verbosity every PostgREST error body is a JSON
  # object with EXACTLY these four keys, always present, emitted in this key
  # order. `details` and `hint` are JSON null when absent (they are not
  # omitted). errorPayload/toJsonPgrstError, Error.hs:65-78.
  keys: [code, message, details, hint]
  content_type: "application/json; charset=utf-8"
  # A Content-Length header is always set (response is fully buffered).
  # errorResponseFor, Error.hs:85 (cLHeader) / :88 (assembly).
  always_sets_content_length: true
  field_semantics:
    code:    "string. PostgREST PGRSTxxx code, or the raw 5-char PG SQLSTATE for DB errors, or the custom code from a RAISE 'PGRST' message."
    message: "string. Human-readable summary."
    details: "JSON value or null."
    hint:    "JSON value or null."
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L69

# ---------------------------------------------------------------------------
# client-error-verbosity  (NEW in v16.0)
# ---------------------------------------------------------------------------
client_error_verbosity:
  # A single config key selects between the two envelope shapes. It is applied
  # once, in App.hs, to every error the request pipeline produces, so it
  # applies uniformly to ApiRequest, SchemaCache, JWT and PG errors (including
  # RAISE 'PTnnn' and RAISE 'PGRST' errors).
  config_key: "client-error-verbosity"
  env: "PGRST_CLIENT_ERROR_VERBOSITY"
  in_database: "pgrst.client_error_verbosity"
  type: string
  default: verbose
  reloadable: true
  values:
    verbose: "body is {code, message, details, hint} (all four keys always present)."
    minimal: "body is {code, message} only — the details and hint keys are OMITTED, not set to null."
  invalid_value: "Any other value fails config parsing with 'Invalid client-error-verbosity. Check your configuration.'"
  unaffected:
    # Verbosity changes the BODY only. Status, Content-Type, Content-Length
    # (recomputed over the shorter body) and Proxy-Status are unchanged; the
    # Proxy-Status value is built from `code err` independently of verbosity.
    - "HTTP status"
    - "Proxy-Status header"
    - "Content-Type header"
    - "server-side logs (always verbose)"
  applied_at_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L154
  parse_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Config.hs#L335
  docs_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/configuration.rst#L240
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L75

# ---------------------------------------------------------------------------
# Proxy-Status header
# ---------------------------------------------------------------------------
proxy_status_header:
  # Every PostgREST-originated error response carries a Proxy-Status header with
  # the error code. Value format: "PostgREST; error=<code>".
  # In v16.0 the header is built and prepended inside `errorResponseFor`
  # (Error.hs:86 pSHeader, :88 assembly), for every error without exception.
  # (In v14.12 the same header was added by five per-error-class clauses of the
  # `PgrstError Error` headers method; the v16.0 refactor makes it
  # unconditional but does not change the wire behavior.)
  name: "Proxy-Status"
  value_format: "PostgREST; error=<code>"
  header_order: "Content-Type, Content-Length, Proxy-Status, then the per-error headers (e.g. WWW-Authenticate, or RAISE 'PGRST' custom headers)."
  examples:
    - { code: "PGRST125", value: "PostgREST; error=PGRST125" }
    - { code: "PGRST205", value: "PostgREST; error=PGRST205" }
    - { code: "PT402",    value: "PostgREST; error=PT402" }
    - { code: "123",      value: "PostgREST; error=123" }   # custom RAISE 'PGRST' code
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L86
  attached_at_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L88

# ---------------------------------------------------------------------------
# SQLSTATE -> HTTP status map (pgErrorStatus -> mapSQLtoHTTP)
# ---------------------------------------------------------------------------
# For database (Hasql) errors, PostgREST inspects the 5-char SQLSTATE on the
# PG ServerError. `authed` is whether the request reached an authenticated
# role (affects only 42501). Matching is prefix-based for whole classes and
# exact for specific codes; the first matching rule wins (order matters).
# v16.0 splits the dispatch: pgErrorStatus (Error.hs:537) peels the Hasql
# UsageError wrapper and mapSQLtoHTTP (Error.hs:545) holds the SQLSTATE table.
sqlstate_to_http:
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L545
  # Non-ServerError usage errors (connection/timeout) handled first:
  connection_usage_error:  { http: 503 }          # Error.hs:538
  acquisition_timeout:     { http: 504 }          # Error.hs:539
  pipeline_client_error:   { http: 503 }          # Error.hs:540 (new in v16.0)
  client_error:            { http: 503 }          # Error.hs:541
  # Both PipelineError and QueryError ResultErrors go through the same table:
  # Error.hs:542 / :543 -> mapSQLtoHTTP.
  # ServerError SQLSTATE rules, in source order:
  rules:
    - { match: "08*",  http: 503, note: "connection exception" }            # Error.hs:550
    - { match: "09*",  http: 500, note: "triggered action exception" }      # Error.hs:551
    - { match: "0L*",  http: 403, note: "invalid grantor" }                 # Error.hs:552
    - { match: "0P*",  http: 403, note: "invalid role specification" }      # Error.hs:553
    - { match: "23503", http: 409, note: "foreign_key_violation" }          # Error.hs:554
    - { match: "23505", http: 409, note: "unique_violation" }               # Error.hs:555
    - { match: "25006", http: 405, note: "read_only_sql_transaction" }      # Error.hs:556
    - { match: "21000", http: 400, when: "message ends with 'requires a WHERE clause'", note: "pg-safeupdate, treated as client error" }  # Error.hs:557-559
    - { match: "21000", http: 500, when: "otherwise", note: "cardinality_violation, e.g. subquery returned >1 row" }  # Error.hs:560
    - { match: "22023", http: 401, when: "message starts 'role' and ends 'does not exist'", note: "nonexistent JWT role" }  # Error.hs:561-563
    - { match: "22023", http: 400, when: "otherwise", note: "invalid_parameter_value" }  # Error.hs:564
    - { match: "25*",  http: 500, note: "invalid tx state" }                # Error.hs:565
    - { match: "28*",  http: 403, note: "invalid auth specification" }      # Error.hs:566
    - { match: "2D*",  http: 500, note: "invalid tx termination" }          # Error.hs:567
    - { match: "38*",  http: 500, note: "external routine exception" }      # Error.hs:568
    - { match: "39*",  http: 500, note: "external routine invocation" }     # Error.hs:569
    - { match: "3B*",  http: 500, note: "savepoint exception" }             # Error.hs:570
    - { match: "40*",  http: 500, note: "tx rollback" }                     # Error.hs:571
    - { match: "53400", http: 500, note: "config limit exceeded" }          # Error.hs:572
    - { match: "53*",  http: 503, note: "insufficient resources" }          # Error.hs:573
    - { match: "54*",  http: 500, note: "program limit exceeded / too complex (e.g. 54001 stack depth)" }  # Error.hs:574
    - { match: "55*",  http: 500, note: "object not in prerequisite state" }  # Error.hs:575
    - { match: "57P01", http: 503, note: "admin shutdown" }                 # Error.hs:576
    - { match: "57*",  http: 500, note: "operator intervention (e.g. 57014 statement_timeout)" }  # Error.hs:577
    - { match: "58*",  http: 500, note: "system error" }                    # Error.hs:578
    - { match: "F0*",  http: 500, note: "config file error" }               # Error.hs:579
    - { match: "HV*",  http: 500, note: "foreign data wrapper error" }      # Error.hs:580
    - { match: "P0001", http: 400, note: "default code for plpgsql RAISE" } # Error.hs:581
    - { match: "P0*",  http: 500, note: "PL/pgSQL error (e.g. P0004 assert_failure)" }  # Error.hs:582
    - { match: "XX*",  http: 500, note: "internal error" }                  # Error.hs:583
    - { match: "42883", http: 406, when: "message starts 'function xmlagg('", note: "undefined function special-case" }  # Error.hs:584-585
    - { match: "42883", http: 404, when: "otherwise", note: "undefined function" }  # Error.hs:586
    - { match: "42P01", http: 404, note: "undefined_table" }                # Error.hs:587
    - { match: "42P17", http: 500, note: "infinite recursion (invalid object definition)" }  # Error.hs:588
    - { match: "42501", http: 403, when: "authed == true", note: "insufficient_privilege (authenticated)" }  # Error.hs:589
    - { match: "42501", http: 401, when: "authed == false", note: "insufficient_privilege (anonymous)" }      # Error.hs:589
    - { match: "PT<n>", http: "<n>", note: "RAISE SQLSTATE 'PTnnn' -> HTTP nnn; non-numeric suffix -> 500" }  # Error.hs:590
    - { match: "PGRST", http: "from RAISE 'PGRST' detail.status", note: "full response control" }  # Error.hs:591-594
    - { match: "*",    http: 400, note: "any other SQLSTATE -> client error 400" }  # Error.hs:595
  # A non-ServerError ResultError (e.g. a row-decoding failure) -> 500.
  non_server_result_error: { http: 500, source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L597 }
  # The `code` field in the body for a raw DB error is the 5-char SQLSTATE
  # itself (e.g. "23505"), and `message`/`details`/`hint` are taken from the
  # PG ServerError's message/detail/hint fields verbatim.
  # CommandError ErrorBody instance, Error.hs:505 (code), 515 (message),
  # 523 (details), 532 (hint).
  db_error_body:
    code:    "the 5-char SQLSTATE (decoded UTF-8)"
    message: "PG ServerError message"
    details: "PG ServerError detail (string) or null"
    hint:    "PG ServerError hint (string) or null"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L505

# ---------------------------------------------------------------------------
# Non-SQLSTATE database/pool errors (PGRST0xx)
# ---------------------------------------------------------------------------
pool_and_connection_errors:
  # These never carry a PG SQLSTATE; the envelope code is a PGRST0xx code.
  entries:
    - code: "PGRST000"
      http: 503
      message: "Database connection error."
      note: "v16.0 dropped the trailing ' Retrying the connection.' present in v14.12."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L484
    - code: "PGRST001"
      http: 503
      message: "Database client error. Retrying the connection."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L517
    - code: "PGRST003"
      http: 504
      message: "Timed out acquiring connection from connection pool."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L487
    - code: "PGRSTX00"
      http: 500
      note: "Internal Hasql error — a ResultError that is not a ServerError."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L507
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L479

# ---------------------------------------------------------------------------
# PTxxx custom errors
# ---------------------------------------------------------------------------
pt_custom_error:
  # `RAISE SQLSTATE 'PTnnn'` lets a function set an arbitrary HTTP status: the
  # three chars after "PT" are parsed as the numeric status code. If they do
  # not parse as a number, the status defaults to 500. The reason phrase is the
  # PG message. The body is the standard envelope built from the PG
  # message/detail/hint.
  # Error.hs:590  (PT branch of mapSQLtoHTTP)
  status_from_code: "PT<nnn> -> HTTP nnn"
  non_numeric_suffix: "PT40A and similar -> HTTP 500"
  body: "standard {code,message,details,hint}; code is the literal SQLSTATE (e.g. 'PT402')"
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L590

# ---------------------------------------------------------------------------
# RAISE SQLSTATE 'PGRST' — full response control
# ---------------------------------------------------------------------------
pgrst_custom_error:
  # A function may `RAISE SQLSTATE 'PGRST'` to fully control the response.
  # MESSAGE must be a JSON object; DETAIL must be a JSON object.
  # Error.hs:591-594 (status), 501-534 (body), 460-465 (headers),
  # 693-710 (the two FromJSON instances), 712 (parseRaisePGRST).
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L712
  message_json:
    required: [code, message]
    optional: [details, hint]
    note: "Becomes the response body envelope verbatim; missing details/hint serialize as null (verbose) or are omitted (minimal)."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L693
  detail_json:
    required: [status, headers]
    optional: [status_text]
    behavior:
      status:      "HTTP status code of the response."
      status_text: "If present, becomes the HTTP reason phrase; if absent, the standard reason phrase for `status` is used."
      headers:     "Map of extra response headers added verbatim (e.g. X-Header: str)."
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L703
  custom_headers_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L460
  parse_failures:
    # If MESSAGE/DETAIL cannot be parsed as the required JSON objects,
    # PostgREST returns a PGRST121 error (HTTP 500) describing the problem.
    code: "PGRST121"
    http: 500
    cases:
      - { when: "MESSAGE is not valid JSON object",
          details: "Invalid JSON value for MESSAGE: '<raw>'",
          hint: "MESSAGE must be a JSON object with obligatory keys: 'code', 'message' and optional keys: 'details', 'hint'." }
      - { when: "DETAIL is not valid JSON object",
          details: "Invalid JSON value for DETAIL: '<raw>'",
          hint: "DETAIL must be a JSON object with obligatory keys: 'status', 'headers' and optional key: 'status_text'." }
      - { when: "DETAIL is missing",
          details: "DETAIL is missing in the RAISE statement",
          hint: "DETAIL must be a JSON object with obligatory keys: 'status', 'headers' and optional key: 'status_text'." }
    message: 'Could not parse JSON in the "RAISE SQLSTATE ''PGRST''" error'
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L446

# ---------------------------------------------------------------------------
# PGRSTxxx code namespace (selected, errors-area relevant)
# ---------------------------------------------------------------------------
# PGRST0xx connection, 1xx ApiRequest, 2xx SchemaCache, 3xx JWT, Xxx internal.
# Error.hs:136-140
pgrst_codes:
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L136
  notable:
    - { code: "PGRST121", meaning: "Could not parse JSON in RAISE 'PGRST' error", http: 500,
        source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L165" }
    - { code: "PGRST125", meaning: "Invalid path specified in request URL (InvalidResourcePath)", http: 404,
        source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L169" }
    - { code: "PGRST205", meaning: "Could not find the table in the schema cache (TableNotFound)", http: 404,
        source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L242" }
    - { code: "PGRST301", meaning: "JWT decode error", http: 401,
        source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L651" }
  # Error data constructors moved to their own module in v16.0.
  types_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error/Types.hs#L29
