# Conformance case index (this area's band is 1500..1549)
# ---------------------------------------------------------------------------
coverage:
  sqlstate_map:
    - { rule: "23505 unique_violation -> 409",            case_ids: [1500] }
    - { rule: "23503 foreign_key_violation -> 409",       case_ids: [1501] }
    - { rule: "P0001 plpgsql RAISE -> 400",               case_ids: [1502] }
    - { rule: "P0* (P0004 assert_failure) -> 500",        case_ids: [1503] }
    - { rule: "21000 cardinality_violation -> 500",       case_ids: [1504] }
    - { rule: "54* program limit (54001) -> 500",         case_ids: [1523] }
    - { rule: "42P17 infinite recursion -> 500",          case_ids: [1524] }
    - { rule: "PTnnn -> HTTP nnn / non-numeric -> 500",   case_ids: [1505, 1507] }
    - { rule: "PGRST full response control",              case_ids: [1508, 1509, 1510, 1511] }
    - { rule: "PGRST parse failures -> PGRST121/500",     case_ids: [1512, 1513, 1514] }
