# ---------------------------------------------------------------------------
# Harness gate (NOT a spec defect — recorded so it is not mistaken for one)
# ---------------------------------------------------------------------------
# 1517/1518/1522 are the only errors-area cases carrying a per-case `config:`
# block (client-error-verbosity: minimal). The frozen harness routes a case to a
# dedicated instance ONLY when its id appears in the hard-coded
# `@variant_case_ids` list (test/support/conformance_server.ex:58-66); none of
# the three is in that list, so `url_for/1` falls through to the shared bulk
# instance, which runs the default `verbose`. The config block is therefore
# silently ignored and the three cases cannot pass as authored. Flipping a
# shared instance to `minimal` is not an option either: ~500 other cases assert
# four-key bodies. The fix is a one-line harness change that only the human
# harness gate may make; spec/ is correct as written.
harness_gate:
  cases: [1517, 1518, 1522]
  needs: "add 1517, 1518, 1522 to @variant_case_ids in test/support/conformance_server.ex"
  harness_ref: "test/support/conformance_server.ex#L58"
  note: "Bier-side harness wiring; no PostgREST source applies, so no `source:` URL is given."
