      `computed_clients` gap for the one loader_exposure item.
  - >
      Dropped nothing between v14.12 and v16.0: every previously-modelled
      filters behavior still exists at v16.0 with identical wire output, and
      no filters case or entry was removed at this re-sync. For the
      filters-area code paths the only moves were path
      (`src/` -> `src/library/`) and line numbers; SqlFragment.hs DID change
