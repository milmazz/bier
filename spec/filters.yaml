  - >
      needed_assertion: the runner must honour `config` on HTTP cases. The
      v16.0 `url-use-legacy-target-names = false` behavior
      (filters.embed.legacy_target_names_disabled) IS expressible in the case
      shape - spec/case.schema.json already has a `config` key - but the frozen
      harness only honours it for `kind: cli` cases: HTTP cases run against one
      shared instance booted with fixed options
      (test/support/conformance_server.ex) and
      test/conformance/conformance_test.exs never applies `case.config` before
      `perform/1`, so such a case would fail for the wrong reason. Needed: a
      runner that can boot/reconfigure an instance per `config` block (or a
      second shared instance pinned to url-use-legacy-target-names = false).
      NOT duplicated in the filters band because the concrete request is
      already claimed cross-area by the select area as case 1139
      (`select/embed/alias/target-name-disallowed-error`, same path as case
      1189 with `config: {url-use-legacy-target-names: false}` and the PGRST108
      body from QuerySpec#L1709-L1720). filters.embed.legacy_target_names_disabled
      therefore carries `cases: []` on purpose; if 1139 is dropped in review,
      re-home it here from this area's closed overflow range [10600..10799] —
      the primary band [1150..1199] is now fully allocated (1150-1199, 50
      cases).
  - >
      QuerySpec#L1699-L1707 ("works when embedding the same table more than
      once", upstream #4075) uses `places` / `visits`, which do not exist in
