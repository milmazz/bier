      ANYWHERE at this pin: the entities-based `cd` sub-assertion
      `/entities?arr=cd.{1,2,6}&select=id` -> ids 1 and 2
      (AndOrParamsSpec#L174), which IS reproducible on the consolidated seed
      (test.entities arr = {1},{1,2},{1,2,3},NULL) and would be the exact
      sibling of case 1164; omitting it is discretionary, not blocked.
  - >
      PGRST120 ("Bad operator on the '<target>' embedded resource", details
      "Only is null or not is null filters are allowed on embedded resources",
      Error.hs#L164/#L190/#L209) is modelled by NO entry and NO case: at
      v16.0 the `UnacceptableFilter` constructor has no raise site anywhere
      under `src/` (it is declared in Error/Types.hs#L51 and mapped in
      Error.hs, nothing constructs it) and no spec file asserts the code. It
