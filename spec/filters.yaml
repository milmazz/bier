      by diffing the two pins over `src/library/PostgREST/ApiRequest/*`,
      `src/library/PostgREST/Query/SqlFragment.hs` and the five
      filters-relevant spec files.
  - >
      Out-of-area v16.0 changes touched while diffing, recorded so they are not
      lost: (a) every response now carries `Vary: Accept, Prefer, Range`
      (App.hs#L259, upstream #4609) - headers-area scope, so no filters case
