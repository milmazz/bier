# Behavior model: HTTP headers (request + response) for PostgREST v16.0.
#
# Scope: request + response headers, Prefer echo (Preference-Applied),
# Content-Profile / Accept-Profile schema switching, Location on insert,
# Content-Location, the default Vary header, and GUC-driven response.headers /
# response.status.
#
# Every entry carries a `source` URL with a line anchor (raw.githubusercontent
# so the asserting it-block is machine-fetchable). Behaviors that could not be
# traced to a concrete source line are recorded in `gaps`.
#
# Version: PostgREST v16.0 (re-synced from v14.12)
# Conformance case band for this area: 1550..1599
#
# v14.12 -> v16.0 diff summary for this area:
#   * test/spec/Feature/Query/PreferencesSpec.hs was split into
#     Feature/Query/Preferences/{HandlingSpec,TimezoneSpec,MaxAffectedSpec}.hs;
#     handling and max-affected behavior is byte-identical, only the file and
#     line anchors moved.
#   * `Prefer: timezone` CHANGED: the pg_timezone_names membership check is
#     gone, so numeric offsets are now applied and invalid zones now raise a
#     database error (400 / 22023) regardless of `handling`.
#   * NEW: a default `Vary: Accept, Prefer, Range` response header. It is
#     appended in App.hs' `toWaiResponse`, the funnel every NON-error response
#     passes through (so reads, writes, RPC and OPTIONS alike), and is
#     suppressed when the response already carries a Vary (e.g. from the
#     `response.headers` GUC). Error responses bypass that funnel entirely and
#     therefore carry no Vary.
#   * src/ moved to src/library/; Response.hs/Error.hs refactors did not change
#     any header wire bytes in this area (Location, Content-Location,
#     Content-Profile and Preference-Applied assertions are identical between
#     the two tags).

area: headers
version: v16.0

entries:
  # -------------------------------------------------------------------------
  # Prefer / Preference-Applied
  # -------------------------------------------------------------------------
  - id: headers.prefer.preference_applied.return
    claim: >
      A successfully-applied `Prefer: return=representation` is echoed verbatim
      in the `Preference-Applied` response header. This entry models only the
      single-preference path exercised by the cited it-block ("should not throw
      and return location header when selecting without PK",
      InsertSpec.hs#L116-L125): one `Prefer: return=representation` and no count
      preference, so the echo is exactly `return=representation` and
      `Content-Range` is `*/*`. The two-preference echo is a distinct it-block
      and a distinct entry (headers.prefer.preference_applied.multiple).
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L116
    case_ids: [1550]

  - id: headers.prefer.preference_applied.multiple
    claim: >
      Several applied preferences are comma-joined in a single
      `Preference-Applied` value. Upstream's witness ("includes related data
      after insert", InsertSpec.hs#L93-L102) sends `Prefer: return=representation`
      and `Prefer: count=exact` as two separate request headers on a POST and
      asserts `Preference-Applied: return=representation, count=exact` (#L101)
      together with `Content-Range: */1` (#L100) — the count preference is what
      turns the range total from `*` into a number.
      Coverage note: this it-block is already mirrored byte-for-byte by
      conformance case 1300 in the representations band, so no headers-band case
      duplicates it; case 1550 above deliberately covers the complementary
      single-preference path.
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L101
    case_ids: [1300]

  - id: headers.prefer.handling.strict.error
    claim: >
      With `Prefer: handling=strict`, any unrecognized/invalid preference makes
      the request fail with HTTP 400 and error code PGRST122
      ("Invalid preferences given with handling=strict"), with `details`
      listing the offending preferences. Strict applies across GET, POST and RPC,
      and combines preferences supplied in multiple `Prefer` headers.
      Unchanged at v16.0 except that `timezone=` tokens are no longer among the
      preferences strict can reject (see headers.prefer.timezone.invalid).
    request_header: Prefer
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/HandlingSpec.hs#L15
    case_ids: [1551]

  - id: headers.prefer.handling.lenient.ignored
    claim: >
      With `Prefer: handling=lenient` (the default), invalid preferences are
      silently ignored: the request succeeds (200) and no error is raised.
      The cited it-block asserts the status and nothing else — HandlingSpec.hs
      makes no `Preference-Applied` assertion anywhere in the file, so no claim
      about the echo is made here (see
      headers.prefer.handling.lenient.echo for the echo, which is witnessed in
      MaxAffectedSpec.hs instead).
    request_header: Prefer
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/HandlingSpec.hs#L44
    case_ids: [1552]

  - id: headers.prefer.handling.lenient.echo
    claim: >
      `Preference-Applied` lists only the preferences that were actually
      applied, so under `handling=lenient` a preference lenient declines to
      enforce is dropped from the echo. The single v16.0 it-block that asserts
      this ("should not fail", MaxAffectedSpec.hs#L49-L56) sends
      `Prefer: handling=lenient, max-affected=10` on a DELETE that affects 14
      rows: the cap is not enforced (204) and the echo is `handling=lenient`
      alone, with no `max-affected` token.
      Coverage note: mirrored by conformance case 1392 in the mutations band; no
      headers-band case duplicates it.
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L56
    case_ids: [1392]

  - id: headers.prefer.timezone.applied
    claim: >
      `Prefer: timezone=<tz>` changes the PostgreSQL session timezone used to
      render timestamptz values, and is echoed verbatim in `Preference-Applied`.
      A valid timezone is applied with or without `handling=strict`, and the
      rendered body is identical either way; only the echo differs. The two
      it-blocks of the cited context assert both halves against the same
      `/timestamps` rows: without `handling` the echo is the single token
      `timezone=America/Los_Angeles` (#L24-L32), and with it the echo is two
      tokens in preference order, `handling=strict,
      timezone=America/Los_Angeles` (#L14-L22).
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L13
    case_ids: [1553, 1584]

  - id: headers.prefer.timezone.offsets
    claim: >
      NEW at v16.0: a numeric UTC offset (e.g. `timezone=+05:30`, `timezone=-4`)
      is a valid `timezone` preference. v14.12 accepted only names present in
      `pg_timezone_names` and silently dropped everything else; v16.0 removed
      that membership check, so the raw token is set as the session TimeZone and
      echoed unmodified in `Preference-Applied`. PostgreSQL reads bare offsets in
      POSIX style, so `+05:30` renders as `-05:30` and `-4` as `-04:00`.
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L60
    case_ids: [1577, 1578]

  - id: headers.prefer.timezone.invalid
    claim: >
      CHANGED at v16.0: an invalid `timezone` preference is no longer a
      "preference" error and is no longer affected by `handling`. Because the
      value is passed straight to PostgreSQL, an unknown zone raises SQLSTATE
      22023 ("invalid value for parameter \"TimeZone\": \"<v>\"") which maps to
      HTTP 400, identically with no handling token, with `handling=strict` and
      with `handling=lenient`. A seconds-precision offset (`timezone=05:30:15`)
      likewise fails 400 / 22023 with details "PostgreSQL does not support leap
      seconds.". Under v14.12 the same requests produced, respectively, 200 with
      the default zone, 400 PGRST122, and 200 with `Preference-Applied:
      handling=lenient`.
    request_header: Prefer
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/TimezoneSpec.hs#L35
    case_ids: [1554, 1579, 1580, 1581]

  - id: headers.prefer.max_affected.strict
    claim: >
      `Prefer: handling=strict, max-affected=N` makes a mutation fail with
      400 / PGRST124 ("Query result exceeds max-affected preference constraint",
      details "The query affects K rows") when it would affect more than N rows;
      within the limit it succeeds (204) and echoes the full preference in
      `Preference-Applied`.
    request_header: Prefer
    response_header: Preference-Applied
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/Preferences/MaxAffectedSpec.hs#L14
    case_ids: [1555, 1556]

  # -------------------------------------------------------------------------
  # Vary (default cache-key header, new in v16.0)
  # -------------------------------------------------------------------------
  - id: headers.vary.default
    claim: >
      NEW at v16.0: every successful response carries
      `Vary: Accept, Prefer, Range`. It is appended in App.hs' `toWaiResponse`
      to whatever headers the action produced. Upstream's own it-block ("Test
      default Vary header value matches default one") asserts it on a plain
      `GET /projects` under the base config (`withConfig baseCfg` at #L26).
    response_header: Vary
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/HttpHeaderSpec.hs#L27
    case_ids: [1575]

  - id: headers.vary.non_read_responses
    claim: >
      The default Vary is not read-specific: `toWaiResponse` is the single
      funnel every non-error response passes through, so writes, RPC and
      OPTIONS carry `Vary: Accept, Prefer, Range` too. OPTIONS is the clean
      witness — `respondInfo` produces exactly
      `[Content-Length, Access-Control-Allow-Origin, Allow]`
      (Response.hs#L230-L233), so the `varyHeaderPresent` guard cannot fire.
      A plain OPTIONS (no `Origin`) is passed through by the CORS middleware
      rather than answered as a preflight (Cors.hs#L27, #L43).
    response_header: Vary
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L253
    case_ids: [1582]

  - id: headers.vary.absent_on_errors
    claim: >
      Error responses carry NO `Vary`. They never reach `toWaiResponse`: the
      outer handler maps a Left straight through `Error.errorResponseFor`
      (App.hs#L154), which builds a closed header list — Content-Type,
      Content-Length, Proxy-Status, plus the error's own `headers err`
      (Error.hs#L88). No middleware adds one either: the CORS middleware sets
      `corsVaryOrigin = False` (Cors.hs#L39) and `hVary` appears nowhere else
      in src/.
    response_header: Vary
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L88
    case_ids: [1583]

  - id: headers.vary.guc_override
    claim: >
      The default Vary is emitted only when the response does not already carry
      one — `[varyHeader | not $ varyHeaderPresent hdrs]`. Since `response.headers`
      GUC entries are merged into those headers first, setting `Vary` from SQL
      (a pre-request function upstream, an RPC in the conformance case) replaces
      the default verbatim rather than adding a second Vary header.
    response_header: Vary
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L253
    case_ids: [1576]

  # -------------------------------------------------------------------------
  # Accept-Profile / Content-Profile schema switching
  # -------------------------------------------------------------------------
  - id: headers.profile.default_schema
    claim: >
      With no `Accept-Profile` header a read uses the first exposed schema (the
      default). Echoing it back is CONDITIONAL, not unconditional: `getSchema`
      returns `Right (defaultSchema, length configDbSchemas /= 1)` — the second
      component is `iNegotiatedByProfile` — and `profileHeader`
      (Response.hs#L257-L262) returns Nothing when that flag is False. So an
      instance exposing more than one schema echoes the resolved default in
      `Content-Profile`, while an instance exposing exactly ONE schema emits no
      `Content-Profile` header at all. Upstream's witness
      (MultipleSchemaSpec.hs#L24-L33, asserting `Content-Profile: v1`) runs under
      `configDbSchemas = fromList ["v1", "v2", "SPECIAL \"@/\\#~_-"]`
      (MultipleSchemaSpec.hs#L21) and therefore only establishes the
      many-schemas branch. Same statement as spec/url_grammar.md §5.
    request_header: Accept-Profile
    response_header: Content-Profile
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L161
    case_ids: [1557]

  - id: headers.profile.accept_profile_read
    claim: >
      `Accept-Profile: <schema>` on a GET/HEAD selects which exposed schema to
      read from; the chosen schema is echoed in `Content-Profile`.
    request_header: Accept-Profile
    response_header: Content-Profile
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/MultipleSchemaSpec.hs#L46
    case_ids: [1558]

  - id: headers.profile.content_profile_write
    claim: >
      `Content-Profile: <schema>` on a write (POST/PATCH/PUT/DELETE) selects the
      target schema; the chosen schema is echoed in `Content-Profile` on the
      response.
    request_header: Content-Profile
    response_header: Content-Profile
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/MultipleSchemaSpec.hs#L141
    case_ids: [1559]

  - id: headers.profile.unknown_schema
    claim: >
      A profile header naming a non-exposed schema fails with HTTP 406 and error
      code PGRST106 ("Invalid schema: <name>"), whose hint lists the exposed
      schemas in exposure order. Identical for `Accept-Profile` on a read and
      `Content-Profile` on a write (MultipleSchemaSpec.hs#L152).
    request_header: Accept-Profile
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/MultipleSchemaSpec.hs#L77
    case_ids: [1560]

  - id: headers.profile.special_chars
    claim: >
      Schema names with uppercase/special characters (e.g. `SPECIAL "@/\#~_-`)
      are valid `Accept-Profile`/`Content-Profile` values and are echoed verbatim
      in `Content-Profile`.
    request_header: Accept-Profile
    response_header: Content-Profile
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/MultipleSchemaSpec.hs#L84
    case_ids: [1574]

  # -------------------------------------------------------------------------
  # Location on insert
  # -------------------------------------------------------------------------
  - id: headers.location.headers_only
    claim: >
      A POST insert with `Prefer: return=headers-only` returns 201 with a
      `Location` header pointing to the created row via its primary-key filter
      (e.g. `/projects?id=eq.11`), no Content-Type, Content-Length 0, and
      `Preference-Applied: return=headers-only`.
    response_header: Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L128
    case_ids: [1561]

  - id: headers.location.compound_pk
    claim: >
      For a table with a compound primary key, the `Location` filter includes
      every PK column (e.g. `/car_models?name=eq.Enzo&year=eq.2021`).
    response_header: Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L142
    case_ids: [1562]

  - id: headers.location.absent_no_pk
    claim: >
      A POST insert without a Prefer that requests headers/representation, into a
      relation, returns 201 with no `Location` header (and no Content-Type),
      Content-Length 0.
    response_header: Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L157
    case_ids: [1563]

  # -------------------------------------------------------------------------
  # Content-Location (canonical location)
  # -------------------------------------------------------------------------
  - id: headers.content_location.alphabetized
    claim: >
      A GET response carries a `Content-Location` header with the request's
      filter params reordered alphabetically (canonical form),
      e.g. `?b=eq.1&a=eq.1` -> `Content-Location: /no_pk?a=eq.1&b=eq.1`.
    response_header: Content-Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1246
    case_ids: [1564]

  - id: headers.content_location.no_params
    claim: >
      When there are no query params, `Content-Location` omits the question mark
      (e.g. `/simple_pk`).
    response_header: Content-Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1253
    case_ids: [1565]

  # -------------------------------------------------------------------------
  # GUC-driven response headers / status (response.headers, response.status)
  # -------------------------------------------------------------------------
  - id: headers.guc.response_headers
    claim: >
      A function (or trigger) may set the `response.headers` GUC to a JSON array
      of single-key objects; each is emitted as a response header
      (e.g. `X-Test: key1=val1; someValue; key2=val2` plus `X-Test-2: key1=val1`).
      The cited it-block ("succeeds setting the headers") makes the same
      assertion three times, once per call shape: `GET
      /rpc/get_projects_and_guc_headers?id=eq.2&select=id` (#L1032), `GET
      /rpc/get_int_and_guc_headers?num=1` (#L1038) and the POST form of the
      latter (#L1044). Case 1566 mirrors the #L1038 request.
    response_header: (arbitrary)
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1031
    case_ids: [1566]

  - id: headers.guc.response_headers_invalid
    claim: >
      An ill-formed `response.headers` GUC (not a JSON array of single-key
      string-valued objects) fails with HTTP 500 / PGRST111
      ("response.headers guc must be a JSON array composed of objects with a
      single key and a string value").
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1051
    case_ids: [1567]

  - id: headers.guc.repeated_header
    claim: >
      The same response header may be emitted more than once via
      `response.headers` (e.g. two `Set-Cookie` headers).
    response_header: Set-Cookie
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1078
    case_ids: [1568]

  - id: headers.guc.location_override
    claim: >
      A trigger may override the `Location` header on an insert by setting the
      `response.headers` GUC (e.g. `/stuff?id=eq.2&overriden=true`).
    response_header: Location
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1089
    case_ids: [1569]

  - id: headers.guc.status_override
    claim: >
      A function may override the HTTP status via the `response.status` GUC —
      the cited it-block ("can override the status on RPC") gets
      `/rpc/send_body_status_403` and asserts 403 with the function's own JSON
      body. A trigger may set the same GUC: the sibling it-block "can override
      the status through trigger" (#L1136) asserts 205 on `PATCH /stuff?id=eq.1`.
    response_header: (status line)
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1128
    case_ids: [1570, 1571]

  - id: headers.guc.status_invalid
    claim: >
      An invalid `response.status` GUC value fails with HTTP 500 / PGRST112
      ("response.status guc must be a valid status code").
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1142
    case_ids: [1572]

  - id: headers.guc.no_blank_headers
    claim: >
      Regression guard for issue #1427 (blank ` : ` headers made proxies fail
      requests): a `POST /loc_test` must not produce a response header with a
      blank value. Upstream splits the guard into four sibling it-blocks that
      each apply `noBlankHeader` to the whole response header list — POST
      (#L1103), PATCH (#L1109), GET (#L1115) and DELETE (#L1121); only the POST
      one is modelled here. The frozen harness's `headers_no_blank` assertion
      inspects header VALUES only and never header names
      (test/support/conformance_assertions.ex), so no claim about empty header
      names is made.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1103
    case_ids: [1573]

# Behaviors observed in source/docs for this area that are NOT encoded as
# conformance cases here (see structured-output gaps for rationale).
gaps:
  - >
    DROPPED at v16.0 (was modelled at v14.12): "an invalid timezone without
    handling=strict is ignored and the default timezone is used, with
    Preference-Applied echoing only handling=lenient". That behavior no longer
    exists — v16.0 removed the pg_timezone_names membership check from
    Preferences.fromHeaders
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/Preferences.hs#L138)
    so every timezone value reaches PostgreSQL and an invalid one is a 400 /
    22023. Cases 1580 and 1581 replace the dropped assertions, and case 1554
    was rewritten from PGRST122 to the database-error envelope.
  - >
    Vary override through a `db-pre-request` function (upstream's own test:
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/HttpHeaderSpec.hs#L15
    with fixture `custom_vary_hdr`, schema.sql#L3875). The conformance runner
    cannot set `db-pre-request` per case (test/support/conformance_server.ex
    starts variant instances only for a frozen id list), so case 1576 drives
    the identical `response.headers` GUC from an RPC instead. The pre-request
    flavor itself stays uncovered.
  - >
    `Warning: 299 PostgRESTvX.Y "…"` response header, new at v16.0, emitted
    when an embedded resource is referenced by relation name despite having an
    alias (construction at
    https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L264,
    test QuerySpec.hs#L1183). NOT modelled here: the header is a property of the
    embedding/select + reserved-param surface (the deprecation only fires for an
    aliased embed targeted by its relation name), and it is already covered by
    the owning areas' cases — 1028 (url_grammar), 1138/1141 (select),
    1189/1190 (filters), 1224 (ordering) — which pin it with a
    `headers_match` regex whose product token is `\S+`, since the value embeds
    the running server's own version string. Its 400 PGRST108 counterpart needs
    `url-use-legacy-target-names = false`, a per-case config the frozen harness
    honors only for its hardcoded variant ids.
  - >
    Prefer: tx=commit / tx=rollback is a documented Prefer preference
    (docs/references/api/preferences.rst, _prefer_tx) that, when applied,
    is echoed in Preference-Applied (e.g. "tx=rollback, return=representation").
    PostgREST only parses/applies it when the db-tx-end config is set to a
    "-allow-override" mode -- in the source the preference is Nothing unless
    allowTxDbOverride is true
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest/Preferences.hs#L135).
    The conformance runner cannot yet set db-tx-end per case (same config-gating
    limitation as the db-pre-request gaps), so this is recorded as a gap rather
    than guessed.
  - >
    CROSS-REFERENCE, not a gap: the request.method / request.path /
    request.headers / request.cookies GUCs are set by `txVarQuery` on EVERY
    request, with no `db-pre-request` involvement
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Query/PreQuery.hs#L44
    — methodSql/pathSql/headersSql/cookiesSql at #L44-L47), and upstream
    exercises all four through a plain RPC to `/rpc/get_guc_value` under
    `baseCfg` in RpcSpec.hs' `context "HTTP request env vars"`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L871).
    They are already covered in this repo by the auth-band cases against the
    `test.get_guc_value` fixture: 1478 (request.headers, custom header),
    1481/1482 (request.cookies, single + multiple), 1484 (request.method) and
    1485 (request.path). No headers-band case duplicates them. (An earlier pass
    recorded this as config-blocked on `db-pre-request`; that rationale was
    wrong and is retracted.)
  - >
    GUC response headers set by a `db-pre-request` function on every method
    (X-Custom-Header on POST/PATCH/PUT/DELETE, Cache-Control on GET/HEAD, and
    the Content-Disposition / Content-Type overrides), upstream's
    Feature/RpcPreRequestGucsSpec.hs, which runs under
    `configDbPreRequest = Just (QualifiedIdentifier mempty "custom_headers")`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/RpcPreRequestGucsSpec.hs#L15,
    fixture `custom_headers` at test/spec/fixtures/schema.sql#L2051). NOT
