# Content negotiation: which media type PostgREST produces for a request, the
# Content-Type it emits, and the error envelope when nothing is acceptable.
#
# Area scope: application/json, text/csv, application/vnd.pgrst.object+json
# (single object), GeoJSON (application/geo+json), OpenAPI
# (application/openapi+json), application/octet-stream (bytea), and
# application/vnd.pgrst.plan (EXPLAIN, +json/+text with for=/options=).
#
# Pinned to PostgREST v16.0.
# Primary ground truth is the MediaType enum + toMime/toContentType/decodeMediaType
# in src/library/PostgREST/MediaType.hs and the negotiateContent dispatch, which
# in v16.0 moved out of Plan.hs into its own module
# src/library/PostgREST/Plan/Negotiate.hs, cross-checked against the Feature
# test specs.
#
# v14.12 -> v16.0 delta for this area (see the `version_delta` block at the
# bottom for the full list): the negotiation ALGORITHM and every media type is
# byte-for-byte unchanged. What moved is source layout (`src/` -> `src/library/`,
# negotiateContent -> Plan/Negotiate.hs) and one upstream test now pins the row
# order it always relied on.

version: v16.0
previous_version: v14.12

# --- Canonical media type -> mime + Content-Type ----------------------------
# toMime maps the internal MediaType to a wire mime string; toContentType
# appends "; charset=utf-8" for every type EXCEPT MTOctetStream and MTOther,
# which get no charset.
media_types:
  application_json:
    accept: application/json
    content_type: "application/json; charset=utf-8"
    internal: MTApplicationJSON
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L69
  text_csv:
    accept: text/csv
    content_type: "text/csv; charset=utf-8"
    internal: MTTextCSV
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L72
  geojson:
    accept: application/geo+json
    content_type: "application/geo+json; charset=utf-8"
    internal: MTGeoJSON
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L71
  openapi:
    accept: application/openapi+json
    content_type: "application/openapi+json; charset=utf-8"
    internal: MTOpenAPI
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L75
  octet_stream:
    accept: application/octet-stream
    # NOTE: no charset appended for octet-stream.
    content_type: "application/octet-stream"
    internal: MTOctetStream
    charset_appended: false
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L62-L65
    # NOT a built-in producer. Unlike json/csv/geojson/"*/*", octet-stream has
    # no entry in initialMediaHandlers, so it is negotiable ONLY where a
    # media-type DOMAIN registers a handler (see behaviors.octet_stream).
    not_builtin_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1016
    registration_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1024
  other:
    # Any mime decodeMediaType does not recognise becomes MTOther and is echoed
    # verbatim, WITHOUT a charset. This is how custom media-type handlers
    # (DOMAIN + AGGREGATE) surface on the wire, e.g. text/tab-separated-values.
    accept_examples:
      - text/tab-separated-values
      - application/vnd.twkb
    content_type_template: "<the accepted mime, verbatim>"
    internal: MTOther
    charset_appended: false
    mime_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L81
    charset_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L64
  singular_object:
    accept:
      - application/vnd.pgrst.object+json
      - application/vnd.pgrst.object        # +json suffix optional
    content_type: "application/vnd.pgrst.object+json; charset=utf-8"
    internal: MTVndSingularJSON False
    # With ;nulls=stripped the parser yields MTVndSingularJSON True and the mime
    # becomes application/vnd.pgrst.object+json;nulls=stripped.
    stripped_mime: "application/vnd.pgrst.object+json;nulls=stripped"
    decode_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L151-L152
    mime_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L76-L77
  array_stripped:
    accept: application/vnd.pgrst.array+json;nulls=stripped
    content_type: "application/vnd.pgrst.array+json;nulls=stripped; charset=utf-8"
    internal: MTVndArrayJSONStrip
    note: >-
      application/vnd.pgrst.array+json WITHOUT nulls=stripped decodes back to
      MTApplicationJSON (plain JSON array). Only the stripped variant is a
      distinct media type.
    # toMime emits "application/vnd.pgrst.array+json;nulls=stripped" (no space
    # before the parameter); toContentType then appends "; charset=utf-8"
    # because MTVndArrayJSONStrip is not one of the two charset-less cases.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L70
    charset_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L60-L65
    decode_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L153-L154
  plan:
    accept_examples:
      - application/vnd.pgrst.plan                       # defaults to +text, for=application/json
      - application/vnd.pgrst.plan+json
      - application/vnd.pgrst.plan+text
      - 'application/vnd.pgrst.plan+json; for="application/json"; options=verbose'
    internal: "MTVndPlan <for-mediatype> <PlanJSON|PlanText> [options]"
    # toMime composes: application/vnd.pgrst.plan+<fmt>; for="<for-mime>"[; options=a|b]
    # toContentType then appends "; charset=utf-8".
    content_type_template: 'application/vnd.pgrst.plan+<fmt>; for="<for-mime>"[; options=<o1>|<o2>]; charset=utf-8'
    default_format: PlanText
    default_for: application/json
    mime_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L82-L85
    decode_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L148-L150

# --- Media type parsing -----------------------------------------------------
parsing:
  tokenizer:
    description: >-
      decodeMediaType tokenizes "<main>/<sub>[; k=v]*" with a Parsec parser; the
      main/sub types are compared case-insensitively and parameter NAMES are
      normalized to lowercase, so "ApplicatIon/vnd.PgRsT.object+json" decodes to
      MTVndSingularJSON False. A trailing semicolon is tolerated and everything
      after it is discarded.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L190-L197
  case_insensitivity_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L139
  # The anchored line is:
  #   params = fromList $ map (first T.toLower) params' -- normalize parameter
  #   names to lowercase, per RFC 7321
  # Note "RFC 7321" is upstream's own typo for RFC 7231 (HTTP/1.1 Semantics and
  # Content); flagged so nobody "corrects" this spec to match the typo.
  param_names_lowercased_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L162
  case_insensitivity_doctest:
    claim: >-
      The module carries an executable doctest for the case-insensitive path
      (added for upstream issue #3478): decodeMediaType
      "ApplicatIon/vnd.PgRsT.object+json" == MTVndSingularJSON False.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L127-L129
  parse_failure:
    claim: >-
      When the tokenizer fails, decodeMediaType falls back to (mt', "", []) and
      the final catch-all yields MTOther <the whole string>, so an Accept with
      no "/" at all (e.g. "undefined") is carried through verbatim and surfaces
      in the PGRST107 message as-is rather than being rejected earlier.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L156-L161
    test_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L394-L399
  unknown_parameters_ignored:
    claim: >-
      Parameters other than nulls=/for=/options= are ignored, so "text/csv;
      version=1" is just MTTextCSV.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L142

# --- Plan media type parameters --------------------------------------------
plan_parameters:
  formats:
    "+text": PlanText
    "+json": PlanJSON
    bare: PlanText   # "application/vnd.pgrst.plan" with no +suffix == +text
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L148-L150
  for_param:
    meaning: >-
      The for="..." parameter names the downstream media type the plan is being
      generated for; it is echoed in the Content-Type. for="application/vnd.pgrst.object"
      is normalized to for="application/vnd.pgrst.object+json" on output.
    default: application/json
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L163-L172
  options:
    tokens: [analyze, verbose, settings, buffers, wal]
    separator: "|"
    echoed_in_content_type: true
    canonical_order: >-
      Recognised options are re-emitted in the fixed order analyze, verbose,
      settings, buffers, wal, regardless of the order they were sent in;
      unrecognised tokens are dropped.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L163-L172
  toMimePlanOption_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L87-L92
  gated_by_config:
    key: db-plan-enabled
    note: >-
      Plan media types only resolve when db-plan-enabled is true; otherwise the
      plan branch returns Nothing and negotiation fails with PGRST107 / 406.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L74

# --- Negotiation algorithm --------------------------------------------------
negotiation:
  description: >-
    The Accept header is parsed into an ordered list of MediaType values.
    negotiateContent walks that list and picks the FIRST media type for which a
    handler exists (firstAcceptedPick); entries with no handler are skipped, not
    fatal. If none match, it errors with MediaTypeError -> PGRST107 / HTTP 406.
  module_note: >-
    v16.0 moved negotiateContent out of PostgREST.Plan into the dedicated module
    PostgREST.Plan.Negotiate. The function body is unchanged from v14.12 EXCEPT
    for whitespace: the case alternatives were re-aligned. A
    whitespace-insensitive diff of the two bodies is empty - same clauses, same
    guards, same results, same order - so nothing wire-observable moved.
  source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L52-L63
  handler_lookup_order:
    description: >-
      For an overridable media type the handler map is probed in three steps:
      (1) (this relation, */*) - only when the request uses the default select;
      (2) (this relation, the requested media type) - likewise default-select
      only; (3) (anyelement, the requested media type). Step (3) is what makes
      an anyelement aggregate apply to every relation and RPC result.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L75-L78
  accept_list_construction:
    claim: >-
      iAcceptMediaType is the Accept header run through parseHttpAccept (which
      orders by q factor) and then decodeMediaType per entry. A REQUEST WITH NO
      Accept HEADER AT ALL yields the singleton list [MTAny], i.e. it is treated
      exactly like "*/*" - which is why a bare `GET /` with no Accept still
      resolves to the OpenAPI document (case 1645).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L98
    q_factor_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/ApiRequest.hs#L71
    q_factor_test_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L208-L219
  rules:
    - claim: >-
        Vendored media types (vnd.pgrst.object, vnd.pgrst.array stripped, and
        vnd.pgrst.plan) have special handling and cannot be overridden by custom
        media handlers; the others (json, csv, geojson, ...) can be overridden.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L64-L73
    - claim: >-
        A media type whose tokenizer parse fails (no "/" at all, e.g.
        "undefined") is not rejected during parsing: it becomes MTOther and is
        echoed verbatim in the 406 / PGRST107 message.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L394-L399
    - claim: >-
        Media type matching is case-insensitive, so
        "ApplicatIon/vnd.PgRsT.object+json" negotiates the singular object
        handler and the response Content-Type is re-rendered canonically
        lowercase (upstream issue #3478).
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L127-L129
    - claim: >-
        When multiple acceptable types are listed, PostgREST honors the client's
        order (first acceptable wins), even when it is the opposite of the
        server's preference.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1221
    - claim: >-
        A media type with no handler is skipped rather than rejected, so
        "text/unknowntype, text/csv" resolves to CSV with 200.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1229
    - claim: >-
        This also holds for media types PostgREST knows but has no handler for
        on the target relation: "text/plain, application/json" resolves to JSON.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L222
    - claim: >-
        */* matches and rescues an otherwise-unknown leading type, resolving to
        the default JSON handler (200).
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1208
    - claim: >-
        A bare */* on an API endpoint resolves to application/json.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1203
    - claim: >-
        A specific available preference listed alongside */* overrides */*, e.g.
        Accept "text/csv, */*" produces text/csv.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1213
    - claim: >-
        An Accept of a single unsupported type (e.g. text/unknowntype) yields
        406 with PGRST107 and a JSON error body listing the unavailable types.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1191
    - claim: >-
        A HEAD request negotiates a media type and emits its Content-Type but
        runs no result aggregate (upstream #2849), so it produces no body.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L59
  openapi_root_negotiation:
    description: >-
      The root path "/" only produces [OpenAPI, JSON, Any]. Any non-empty
      intersection with the Accept list resolves to MTOpenAPI - including a bare
      */* and including Accept application/json - and the root response always
      emits toContentType MTOpenAPI. application/openapi+json on a non-root path
      is 406. An unsupported type (text/csv) on the root is 406.
    produced_set: [MTOpenAPI, MTApplicationJSON, MTAny]
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L247
    response_content_type_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Response.hs#L208

# --- Error envelope ---------------------------------------------------------
errors:
  unacceptable_media_type:
    http_status: 406
    code: PGRST107
    message_template: "None of these media types are available: <comma-joined accepts>"
    body_shape: { code: string, message: string, details: "null", hint: "null" }
    docs_note: >-
      v16.0 corrected the docs error table for PGRST107, which had wrongly
      documented it as 415 "The Content-Type sent in the request is invalid";
      it now reads 406 "The Accept media type sent in the request is invalid".
      The implementation already returned 406 in v14.12, so this is a docs-only
      fix and no case body changes.
    status_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L102
    code_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L151
    message_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L181
    docs_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/errors.rst#L202
  singular_coercion_failure:
    description: >-
      When a singular-object request (or singular mutation) resolves to a number
      of rows other than exactly 1, the result cannot be coerced to a single JSON
      object: HTTP 406, PGRST116, message "Cannot coerce the result to a single
      JSON object", details "The result contains N rows". The error body is plain
      JSON (Content-Type application/json), NOT vnd.pgrst.object+json.
    http_status: 406
    code: PGRST116
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L97-L104
  geojson_missing_geometry:
    description: >-
      Requesting application/geo+json on a relation lacking a geometry column
      fails with HTTP 400, SQLSTATE 22023, message "geometry column is missing".
    http_status: 400
    code: "22023"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PostGISSpec.hs#L28-L34

# --- Per-media-type behavior summaries --------------------------------------
behaviors:

  singular_object:
    - claim: "GET with Accept vnd.pgrst.object+json returns the single object (not an array) for exactly one row."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L23-L33
    - claim: "The +json suffix is optional: application/vnd.pgrst.object behaves identically."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L29-L33
    - claim: "Zero rows for a GET singular request returns 406 (PGRST116)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L19-L21
    - claim: "Singular shaping works through embedded resources (plurality singular)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L41-L45
    - claim: "POST insert of one row with return=representation + singular returns 201 and the single object."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L116-L124
    - claim: "Singular on a scalar RPC result (sayhello) succeeds with 200."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L280-L283
    - claim: "Singular RPC returning a json proc row returns the single object."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SingularSpec.hs#L285-L290

  text_csv:
    - claim: "Accept text/csv (with or without a version param) returns CSV with a header row then data rows and NO trailing newline; Content-Type text/csv; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1234-L1243
    - claim: "POST insert with Content-Type text/csv + Accept text/csv + return=representation returns the inserted rows as CSV (201)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L642-L649
    - claim: "CSV insert NULL token produces an empty CSV cell on representation output."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L651-L658
    - claim: "CSV insert with inconsistent column counts across lines fails with PGRST102 / 400."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/InsertSpec.hs#L671-L677

  geojson:
    - claim: "GET with Accept application/geo+json on a table with a geometry column returns a FeatureCollection; Content-Type application/geo+json; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PostGISSpec.hs#L16-L26
    - claim: "GeoJSON on no matching rows returns an empty features array (still a FeatureCollection)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PostGISSpec.hs#L36-L42
    - claim: "GeoJSON on a relation without a geometry column fails 400 / SQLSTATE 22023 'geometry column is missing'."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PostGISSpec.hs#L28-L34
    - claim: "The builtin geo+json handler IS overridable per relation (it is not a vendored type): an aggregate over the row type replaces it while keeping the application/geo+json; charset=utf-8 Content-Type."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L188-L195

  openapi:
    - claim: "GET / with Accept application/openapi+json returns the OpenAPI doc; Content-Type application/openapi+json; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L19-L28
    - claim: "application/openapi+json on a non-root path returns 406."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L30-L33
    - claim: "An unsupported Accept (text/csv) on the root path returns 406."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L35-L38
    - claim: "A request to / with no Accept header (i.e. */*) still returns the OpenAPI document."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/OpenApi/OpenApiSpec.hs#L41-L48

  octet_stream:
    # READ THIS FIRST. octet-stream is not produced by any built-in rule; the
    # ONLY thing that makes it negotiable is a media-type DOMAIN. An earlier
    # revision of this block asserted "bytea return => octet-stream", which is
    # false and induced a wrong rule downstream; the claims below replace it.
    - claim: >-
        application/octet-stream is NOT a built-in producer. initialMediaHandlers
        registers exactly four (anyelement, <media type>) entries -- */*,
        application/json, text/csv, application/geo+json -- and nothing else, so
        no relation or routine produces octet-stream by default.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1016
    - claim: >-
        An octet-stream handler exists only where the schema puts one, and the
        mediaHandlers discovery query keys on RETURN TYPES -- never on an
        aggregate's stype. First UNION branch: a handler is registered for every
        AGGREGATE whose own pg_proc row (reached via `pg_aggregate.aggfnoid =
        proc.oid`) has `proc.prorettype` equal to a DOMAIN named after a mime,
        takes exactly one argument (`proc.pronargs = 1`) whose type is a
        relation's reltype or `anyelement`, and lives in an exposed schema.
        Second UNION branch: a handler is registered for every non-set-returning
        plain FUNCTION (`prokind = 'f'`, `NOT proretset`) whose return type is
        such a domain. stype coincides with the aggregate's return type only
        when there is no finalfunc (true of every upstream fixture), which is
        why upstream's own docs phrase the rule as "domain media types as the
        return type of their transition or final functions" -- an
        implementation that keys on stype registers a subtly different handler
        set. The domain named "*/*" is additionally resolved to
        application/octet-stream. A routine returning plain `bytea` registers
        nothing.
      # The aggregate branch's whole FROM/JOIN/WHERE chain: `from media_types`
      # (#L1062) -> `join pg_proc proc on proc.prorettype = media_types.oid`
      # (#L1063) -> `join pg_aggregate agg on agg.aggfnoid = proc.oid` (#L1065)
      # -> `proc.pronargs = 1` (#L1070) -> arg in all_relations (#L1071).
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1062-L1071
      function_branch_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1080-L1086
      resolved_mime_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1045-L1048
      docs_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/media_type_handlers.rst#L77
    - claim: >-
        Upstream's own fixture is what makes the single-unnamed-bytea-parameter
        routine negotiable: it is declared
        `test.unnamed_bytea_param(bytea) returns "application/octet-stream"`,
        i.e. it returns the mime-named DOMAIN, not bytea.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/fixtures/schema.sql#L2372
    - claim: >-
        Given that fixture, POST to that RPC with Content-Type + Accept
        application/octet-stream echoes the raw request bytes back. NOTE the
        cited it-block asserts ONLY `respBody == file`: it asserts neither a
        status nor a Content-Type, so neither may be attributed to it (case 1622
        cites those separately).
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/RpcSpec.hs#L1184-L1191
    - claim: "When octet-stream IS negotiated, its Content-Type carries no charset (toContentType special-cases MTOctetStream and MTOther)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L62-L65
    - claim: "Accept application/octet-stream against a relation that has no octet-stream handler returns 406 / PGRST107."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L161-L166
    - claim: "A routine returning the \"*/*\" DOMAIN matches ANY Accept and, when the handler sets no response.headers, the Content-Type defaults to application/octet-stream."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L320-L325

  custom_media_handlers:
    # A custom media type is a DOMAIN named after the mime. Its handler is an
    # AGGREGATE that RETURNS that domain (the discovery query joins
    # proc.prorettype = the domain oid and pg_aggregate.aggfnoid = proc.oid --
    # it does NOT key on stype; stype merely coincides with the return type
    # when the aggregate has no finalfunc, as in every fixture here), taking a
    # single argument that is either a specific row type (relation-scoped) or
    # anyelement (applies everywhere). Plain non-set-returning FUNCTIONS
    # returning such a domain are handlers too, via the query's second branch.
    # See behaviors.octet_stream for the full anchor set:
    #   discovery query, aggregate branch  SchemaCache.hs#L1062-L1071
    #   discovery query, function branch   SchemaCache.hs#L1080-L1086
    #   docs phrasing ("return type of their transition or final functions")
    #                                      docs/references/api/media_type_handlers.rst#L77
    - claim: "An anyelement aggregate over a custom DOMAIN is negotiable for any relation or RPC result and emits the custom mime with no charset."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L169-L175
    - claim: "A builtin, non-vendored media type (application/json) can be overridden for a single relation; the builtin Content-Type is kept but the body is the handler's output."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L178-L185
    - claim: "Vendored media types cannot be overridden: with an anyelement aggregate registered for the DOMAIN \"application/vnd.pgrst.object\", Accept application/vnd.pgrst.object still yields the ordinary singular object and Content-Type."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L197-L204
    - claim: "A relation-scoped aggregate registers an unknown mime (MTOther) whose Content-Type is echoed verbatim with no charset, e.g. text/tab-separated-values on /projects."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L229-L236
    - claim: "A relation-scoped aggregate is only negotiable with the default select: naming fewer, more, or reordered columns makes it unavailable (406)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/CustomMediaSpec.hs#L301-L316
    - claim: "PostgREST vendor media types (application/vnd.pgrst.plan, application/vnd.pgrst.object, application/vnd.pgrst.array) cannot be overridden."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/media_type_handlers.rst#L18
    - claim: "Mimes longer than a PostgreSQL identifier (e.g. application/vnd.openxmlformats-officedocument.wordprocessingml.document) cannot be expressed as DOMAINs; the any handler is the documented workaround. This is a SEPARATE docs bullet from the vendor-type one above -- it spans the next two lines, not #L18."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/api/media_type_handlers.rst#L19-L20

  nulls_stripped:
    # 'Stripped Nulls' is a dedicated user-facing feature (own docs ToC
    # subsection + own test/spec/Feature/Query/NullsStripSpec.hs). The
    # ;nulls=stripped parameter on the vendored array/object media types omits
    # every null-valued key from each output object.
    - claim: "Accept application/vnd.pgrst.array+json;nulls=stripped returns a JSON array with all null-valued keys omitted; Content-Type application/vnd.pgrst.array+json;nulls=stripped; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L18
    - claim: "The +json suffix is optional: application/vnd.pgrst.array;nulls=stripped behaves identically and the Content-Type is normalized to the +json form."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L46
    - claim: "Accept application/vnd.pgrst.object+json;nulls=stripped returns a single object (not an array) with null keys omitted; Content-Type application/vnd.pgrst.object+json;nulls=stripped; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L56
    - claim: "The stripped singular media type still enforces singular plurality: a non-singular result fails 406 / PGRST116 with a plain application/json error body."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L66
    - claim: "nulls=stripped removes null keys even when the column was explicitly named in select=."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L77
    - claim: "The stripped SINGULAR type composes with an explicit select= too: /organizations?select=id,referee,auditor&limit=1 returns just {\"id\":1}."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L105-L113
    - claim: "The stripped array type also applies to MUTATION representations: POST with Prefer: return=representation returns 201 and a stripped array, so explicitly-sent null columns are absent from the echoed row."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L28-L35
    - claim: "Likewise for PATCH: a column set to null by the patch is stripped from the returned representation while the untouched non-null columns remain."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L37-L44
    - claim: "Plain application/vnd.pgrst.array+json (no nulls=stripped) keeps null keys and responds with Content-Type application/json; charset=utf-8 (decodes back to MTApplicationJSON)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/NullsStripSpec.hs#L116

  plan:
    - claim: "GET with Accept application/vnd.pgrst.plan+json returns the JSON plan; Content-Type application/vnd.pgrst.plan+json; for=\"application/json\"; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L25-L37
    - claim: "Bare application/vnd.pgrst.plan defaults to +text format; Content-Type application/vnd.pgrst.plan+text; for=\"application/json\"; charset=utf-8."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L286-L298
    - claim: "options= parameters (e.g. verbose, buffers) are echoed verbatim in the response Content-Type."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L52-L59
    - claim: "Several options may be combined with \"|\" and are echoed joined the same way, e.g. options=analyze|wal."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L77-L84
    - claim: "for=\"application/vnd.pgrst.object\" is normalized to for=\"application/vnd.pgrst.object+json\" in the response Content-Type."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L118-L125
    - claim: "for= may also name a custom media type (text/xml, application/vnd.twkb); it is echoed unchanged."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L429-L448
    # Deliberately worded as a TEST change, not a behavior change: an earlier
    # revision said "NEW in v16.0: the JSON plan includes ...", which the cited
    # lines do not support and which contradicts this file's own
    # version_delta.behavior_changes ([] - nothing wire-observable changed).
    - claim: >-
        Upstream ADDED a test at v16.0 asserting that the JSON plan carries a
        "Query Identifier" field when options=verbose (it asserts only
        `isJust`, plus the usual options=verbose Content-Type). PostgREST did
        not introduce the field: it is emitted by PostgreSQL's
        EXPLAIN (VERBOSE, FORMAT JSON) when the server computes query ids
        (compute_query_id), so the assertion holds only on such a server. Filed
        under version_delta.test_changes, not behavior_changes.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L97
    - claim: "When db-plan-enabled is false (the default) the plan media type does not resolve and the request fails."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L544-L548

# --- What actually changed between the two pins -----------------------------
version_delta:
  behavior_changes: []      # no wire-observable content-negotiation behavior changed
  source_moves:
    - claim: "All library sources moved from src/PostgREST/... to src/library/PostgREST/..."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L1
    # NOT byte-identical: v16.0 re-aligned the `case` alternatives. The earlier
    # revision of this entry claimed "byte-identical", which a diff refutes;
    # the correct, weaker (and true) statement is identical-modulo-whitespace.
    - claim: >-
        negotiateContent moved out of PostgREST.Plan into the new module
        PostgREST.Plan.Negotiate. The function body is identical to v14.12's
        MODULO WHITESPACE only (the case alternatives were re-aligned); a
        whitespace-insensitive diff is empty, so no clause, guard, result or
        ordering changed.
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan/Negotiate.hs#L52-L63
    - claim: "MediaType.hs gained only a doctest $setup block and a tokenizeMediaType export; every toMime/toContentType/decodeMediaType clause is unchanged."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/MediaType.hs#L11
  test_changes:
    - claim: "QuerySpec's text/csv it-block now sends an explicit ?order=k.desc; the asserted CSV body and Content-Length 21 are unchanged (case 1606 updated to match)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1235
    - claim: "PlanSpec replaced its exact totalCost assertions with `> 0`; the Content-Type assertions this area depends on are unchanged."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L37
    - claim: "PlanSpec added a \"Query Identifier\" verbose test and a \"count preference plan costs\" describe block."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/PlanSpec.hs#L97
  out_of_area_v16_changes:
    # Recorded so they are not lost; each belongs to another area's write channel.
    - claim: "Every response now carries a default Vary: Accept, Prefer, Range header (overridable via the response.headers GUC). Content-negotiation-adjacent, but emitted on EVERY response - routed to the headers area by spec/url_grammar.md."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/App.hs#L259
    - claim: "Every error response now carries a Proxy-Status: PostgREST; error=<code> header - errors-area scope, so no content-negotiation case asserts it (it applies to the 406/PGRST107 responses of cases 1602/1624/1633)."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Error.hs#L86
    - claim: "client-error-verbosity (default verbose) can reduce error bodies to code+message only - config/errors-area scope; at the default the PGRST107 body shape asserted here is unchanged."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/docs/references/configuration.rst#L245

# --- Fixture dependencies this area's cases carry ---------------------------
# Recorded because a transcription slip in one of them silently made an
# assertion unreachable, and the failure mode was invisible from the case alone.
fixture_notes:
  - object: test.unnamed_bytea_param(bytea)
    requirement: >-
      Must RETURN the DOMAIN "application/octet-stream" (base type bytea), NOT
      plain bytea. The return type is the only thing that registers the
      octet-stream handler; with `RETURNS bytea` case 1622 answers 406/PGRST107
      instead of 200. spec/conformance/fixtures.sql:1201 had the plain-bytea
      form; spec/conformance/fixtures/content_negotiation.delta.sql corrects it.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/fixtures/schema.sql#L2372
  - object: 'public."application/octet-stream"'
    requirement: >-
      The DOMAIN itself must exist; upstream declares it alongside the other
      mime-named domains. Declaring the domain alone registers nothing - some
      routine's RETURN TYPE must be it (a plain function's, or an aggregate's
      own prorettype; the discovery query never looks at stype).
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/fixtures/schema.sql#L114
  - object: test.add_them(integer, integer)
    requirement: >-
      Must keep its plain `integer` return type: case 1623 pins the negative
      (a scalar routine with no media-type domain is not negotiable as
      octet-stream). Giving it a mime-named domain return would silently turn
      that 406 into a 200.
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/SchemaCache.hs#L1016
